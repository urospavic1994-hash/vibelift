}
let cloudSyncInflight = null;
async function cloudFullSync(app) {
  // Overlapping calls (SIGNED_IN event + login-screen await) share one run so
  // a second sync can't push a half-restored profile over the cloud copy.
  if (cloudSyncInflight) return cloudSyncInflight;
  cloudSyncInflight = cloudFullSyncRun(app).finally(() => { cloudSyncInflight = null; });
  return cloudSyncInflight;
}
async function cloudFullSyncRun(app) {
  const user = await cloudUser();
  if (!user) return;
  if (!navigator.onLine) { cloudSet('offline'); return; }
  cloudSet('syncing');
  try {
    const { data: rows, error } = await supa.from('workouts').select('date,data');
    if (error) throw error;
    const local = app.getHistory();
    const localByDate = groupByDate(local);
    const adopted = [];
    (rows || []).forEach(r => {
      if (!localByDate[r.date] && Array.isArray(r.data) && r.data.length) adopted.push(...r.data);
    });
    let merged = local;
    if (adopted.length) {
      merged = [...local, ...adopted].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      app.applyHistory(merged);
    }
    await cloudPushDates(user.id, merged, Object.keys(groupByDate(merged)));

    const { data: ceRow } = await supa.from('custom_exercises').select('data').maybeSingle();
    const localCe = app.getCustomEx() || [];
    const remoteCe = (ceRow && Array.isArray(ceRow.data)) ? ceRow.data : [];
    const seen = new Set(localCe.map(e => e.id));
    const mergedCe = [...localCe, ...remoteCe.filter(e => e && e.id && !seen.has(e.id))];
    if (mergedCe.length !== localCe.length) app.applyCustomEx(mergedCe);
    await cloudPushBlob(user.id, 'custom_exercises', mergedCe);

    const { data: pRow } = await supa.from('profiles').select('data').maybeSingle();
    const localP = app.getProfile();
    const remoteP = (pRow && pRow.data) ? pRow.data : null;
    if (!localP && remoteP) {
      app.applyProfile(remoteP);
    } else if (localP && remoteP) {
      // Both exist (e.g. reinstall raced setup ahead of this sync): the cloud
      // copy fills anything the local one lacks, so a fresh install can never
      // wipe the avatar or name off the account again.
      const mergedP = { ...localP };
      if (!mergedP.avatar && remoteP.avatar) mergedP.avatar = remoteP.avatar;
      if ((!mergedP.name || !String(mergedP.name).trim()) && remoteP.name) mergedP.name = remoteP.name;
      if (remoteP.toured && !mergedP.toured) mergedP.toured = true;
      if (JSON.stringify(mergedP) !== JSON.stringify(localP)) app.applyProfile(mergedP);
      await cloudPushBlob(user.id, 'profiles', mergedP);
    } else if (localP) {
      await cloudPushBlob(user.id, 'profiles', localP);
    }

    cloudSet('synced', merged.length);
    cloudSaveMeta(merged.length);
  } catch (e) {
    cloudSet(navigator.onLine ? 'error' : 'offline');
  }
}
async function cloudPushQuick(hist, dates) {
  const user = await cloudUser();
  if (!user) return;
  if (!navigator.onLine) { cloudSet('offline'); return; }
  cloudSet('syncing');
  try {
    await cloudPushDates(user.id, hist, dates);
    cloudSet('synced', hist.length);
    cloudSaveMeta(hist.length);
  } catch (e) { cloudSet('error'); }
}
async function cloudPushBlobQuick(table, value) {
  const user = await cloudUser();
  if (!user || !navigator.onLine) return;
  try { await cloudPushBlob(user.id, table, value); } catch {}
}

function getStreak(history) {
  if (!history.length) return 0;
  const dates = [...new Set(history.map(w => w.date))].sort().reverse();
  const prevDay = iso => { const dt = new Date(iso + 'T12:00:00'); dt.setDate(dt.getDate() - 1); return dt.toISOString().split('T')[0]; };
  const today = todayISO();
  // A streak survives until a full day is missed: anchor on today OR yesterday,
  // so "trained yesterday, opened the app today" still shows the streak.
  let check = dates[0] === today ? today : (dates[0] === prevDay(today) ? prevDay(today) : null);
  if (!check) return 0;
  let streak = 0;
  for (const d of dates) {
    if (d === check) { streak++; check = prevDay(check); }
    else if (d < check) break;
  }
  return streak;
}

function get28Days() {
  const today = new Date(); const dow = today.getDay();
  const start = new Date(today); start.setDate(today.getDate() - dow - 21);
  const arr = [];
  for (let i = 0; i < 28; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    arr.push(localISO(d));
  }
  return arr;
}

function getPersonalBest(history, exId) {
  let best = 0;
  for (const w of history) for (const e of w.exercises) if (e.id === exId) for (const s of e.sets) if (s.weight > best) best = s.weight;
  return best;
}

/* Weights are stored in kg everywhere (history, sets, PBs). These convert only
   at the screen edge, so switching units in Settings re-labels nothing — it
   genuinely converts: 50 kg shows as 110 lb, and 110 lb typed comes back as 50 kg. */
const KG_PER_LB = 0.45359237;
function kgToDisp(kg, unit) {
  if (unit === 'lb') return Math.round((kg / KG_PER_LB) * 2) / 2;   // nearest 0.5 lb
  return Math.round(kg * 100) / 100;
}
function dispToKg(v, unit) {
  return unit === 'lb' ? Math.round(v * KG_PER_LB * 100) / 100 : v;
}
function fmtVol(kgVol, unit) {
  if (unit === 'lb') {
    const lb = Math.round(kgVol / KG_PER_LB);
    return lb >= 2000 ? (lb / 2000).toFixed(1) + 't' : lb + 'lb';   // short tons
  }
  return kgVol >= 1000 ? (kgVol / 1000).toFixed(1) + 't' : kgVol + 'kg';
}

function getTrend(history, exId) {
  const rel = history.filter(w => w.exercises.some(e => e.id === exId));
  if (rel.length < 2) return null;
  const last2 = rel.slice(-2);
  const maxW = w => Math.max(...w.exercises.find(e => e.id === exId).sets.map(s => s.weight));
  const diff = maxW(last2[1]) - maxW(last2[0]);
  return diff > 0 ? 'up' : diff < 0 ? 'down' : 'same';
}

/* ═══════════════════════════════════════
   WORKOUT CALENDAR
═══════════════════════════════════════ */
function getCalendarMonth() {
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day: d, iso });
  }
  return { cells, monthLabel: today.toLocaleDateString('en-US', { month:'long', year:'numeric' }) };
}

function WorkoutCalendar({ history, current }) {
  const [expanded, setExpanded] = useState(null);
  const { cells, monthLabel } = useMemo(getCalendarMonth, []);
  const today = todayISO();
  const doneDates = useMemo(() => new Set(history.map(w => w.date)), [history]);
  const inProgressDate = current && current.exercises.length > 0 ? current.date : null;

  function handleDayTap(iso) {
    if (doneDates.has(iso) || iso === inProgressDate) {
      setExpanded(prev => prev === iso ? null : iso);
    }
  }

  const expandedWorkout = expanded ? history.find(w => w.date === expanded) : null;
  const expandedIsActive = expanded === inProgressDate;

  return (
    <div>
      <div style={{ marginBottom: 10 }}>
        <span className="sec-label" style={{ marginBottom: 0 }}>Activity — {monthLabel}</span>
      </div>
      <div className="cal-grid">
        {DAYS_SHORT.map(d => <div key={d} className="cal-day-lbl">{d}</div>)}
        {cells.map((cell, i) => {
          if (!cell) return <div key={`e${i}`} className="cal-day empty" />;
          const { day, iso } = cell;
          const isDone = doneDates.has(iso);
          const isActive = iso === inProgressDate;
          const isFuture = iso > today;
          const isToday = iso === today;
          const isSelected = expanded === iso;
          let cls = 'cal-day';
          if (isFuture) cls += ' future';
          else if (isActive) cls += ' in-progress';
          else if (isDone) cls += ' has-workout';
          if (isToday) cls += ' today-ring';
          if (isSelected) cls += ' selected';
          return <div key={iso} className={cls} onClick={() => handleDayTap(iso)}><span>{day}</span>{(isDone || isActive) && <span className="cal-day-dot" />}</div>;
        })}
      </div>
      {expanded && (
        <div className={`cal-expand ${expandedIsActive ? 'active-expand' : ''}`} style={{ marginTop: 10 }}>
          <div className="cal-expand-date">{fmtDate(expanded)}</div>
          {expandedIsActive && !expandedWorkout ? (
            <>
              <div className="cal-expand-ex">
                <span className="cal-expand-ex-name">Workout in progress</span>
                <span className="cal-in-progress-badge">Active</span>
              </div>
              {current.exercises.map((ex, j) => (
                <div key={j} className="cal-expand-ex">
                  <span className="cal-expand-ex-name">{ex.name}</span>
                  <span>{ex.sets.length} sets</span>
                </div>
              ))}
            </>
          ) : expandedWorkout ? (
            expandedWorkout.exercises.map((ex, j) => (
              <div key={j} className="cal-expand-ex">
                <span className="cal-expand-ex-name">{ex.name}</span>
                <span>{ex.sets.length} sets</span>
              </div>
            ))
          ) : null}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════

═══════════════════════════════════════ */
function AccountSection({ avatar }) {
  const [session, setSession] = useState(undefined); // undefined = still checking
  const [mode, setMode] = useState('idle');   // idle | sending | sent | verifying
  const [email, setEmail] = useState('');
  const [code, setCode]   = useState('');
  const [error, setError] = useState('');
  const [, bump] = useState(0);               // re-render on cloud status change

  useEffect(() => {
    if (!supa) return;
    supa.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => setSession(s));
    const onCloud = () => bump(x => x + 1);
    cloudState.listeners.add(onCloud);
    return () => { sub.subscription.unsubscribe(); cloudState.listeners.delete(onCloud); };
  }, []);

  if (!supa) return (
    <div className="acct-wrap">
      <div className="acct-fine">Accounts need an internet connection — reconnect and reopen Settings.</div>
    </div>

  // Session check in flight — skeleton instead of flashing the signed-out form

      <div className="acct-card acct-skel">

    if (isDisposableEmail(em)) { setError('That looks like a temporary email address. Your account and every workout in it are tied to this inbox — use one you will still have next year.'); return; }
    setError(''); setMode('sending');
    const { error: err } = await supa.auth.signInWithOtp({
      email: em,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }

    if (err) { setError(friendlyAuthError(err.message)); setMode('idle'); }
    else { setEmail(em); setCode(''); setMode('sent'); }

  async function verifyCode() {

          {(() => {
            const s = cloudState.status;
            let meta = null;

            if (s === 'syncing') return <div className="sync-pill amber"><span className="sync-dot" />Syncing…</div>;
            if (s === 'offline') return <div className="sync-pill gray"><span className="sync-dot" />Offline · will sync later</div>;
            if (s === 'error')   return <div className="sync-pill gray"><span className="sync-dot" />Sync paused · will retry</div>;
            if (s === 'synced')  return <div className="sync-pill"><span className="sync-dot" />Synced · {cloudState.count} workouts in cloud</div>;
            if (meta && meta.count != null) return <div className="sync-pill"><span className="sync-dot" />Synced · {meta.count} workouts in cloud</div>;

          })()}
          <button className="acct-ghost" onClick={signOut}>Sign out (workouts stay on this phone)</button>
          {error && <div className="acct-err">{error}</div>}
        </div>
        <div className="acct-fine">Sync happens automatically after every workout. Offline? It syncs when you're back. <a href="./privacy.html" target="_blank" rel="noopener" style={{ color:'var(--text2)' }}>Privacy policy</a></div>
      </div>
    );
  }

  if (mode === 'sent' || mode === 'verifying') {
    const codeOk = code.replace(/\D/g, '').length >= 6;
    return (
      <div className="acct-wrap">
        <div className="mail-hero">
          <div className="mail-ic">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="var(--pink)" strokeWidth="2"/><path d="M3 7 L12 13.5 L21 7" stroke="var(--pink)" strokeWidth="2" strokeLinecap="round"/></svg>
          </div>
          <div className="acct-big">Check your<br/>email</div>
          <div className="acct-lede">We sent a sign-in code to<br/><b style={{ color:'var(--text)' }}>{email}</b></div>
        </div>
        <input
          className="lg-input lg-code" type="text" inputMode="numeric"

          placeholder="12345678"
          value={code}
          disabled={mode === 'verifying'}
          onChange={e => { setCode(e.target.value.replace(/\D/g, '').slice(0, 10)); setError(''); }}
          onKeyDown={e => { if (e.key === 'Enter') verifyCode(); }}
        />
        {error && <div className="acct-err">{error}</div>}
        <button className="btn-pink" onClick={verifyCode} disabled={!codeOk || mode === 'verifying'}>

        <div className="acct-fine">Type every digit from the newest email. Check spam if it's not there. Valid 1 hour.</div>
        <button className="acct-ghost" onClick={sendLink} disabled={mode === 'verifying'}>Resend code</button>
        <button className="acct-ghost" onClick={() => { setMode('idle'); setEmail(''); setCode(''); setError(''); }} disabled={mode === 'verifying'}>Use a different email</button>
      </div>

  }

  return (
    <div className="acct-wrap">
      <div className="acct-big">Save your<br/>progress</div>
      <div className="acct-lede">Your workouts, on every device. No password — we email you a sign-in code.</div>
      <input className="setup-input" type="email" inputMode="email" autoComplete="email" placeholder="you@email.com"
        value={email} onChange={e => setEmail(e.target.value)}

      {error && <div className="acct-err">{error}</div>}

    </div>
  );

/* Squash any phone photo down to a 256px square JPEG data URL (~20 KB), small
   enough to live in localStorage and ride along with the synced profile blob. */
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('That file is not an image.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Couldn't open that image."));
      img.onload = () => {
        const S = 256;
        const side = Math.min(img.width, img.height);          // centre-crop to a square
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const c = document.createElement('canvas');
        c.width = S; c.height = S;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════
   DANGER ZONE — lives at the very bottom of Settings, far away from
   anything you tap regularly, so delete can't be hit by accident.
═══════════════════════════════════════ */
function DangerZone() {
  const [session, setSession] = useState(null);
  const [armed, setArmed] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!supa) return;
    supa.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  // Arming decays. Coming back to a screen you armed ten minutes ago and
  // tapping the same spot should not delete your account. Declared before the
  // early return below — hooks must run on every render.
  useEffect(() => {
    if (!armed) return;
    const t = setTimeout(() => setArmed(false), 12000);
    return () => clearTimeout(t);
  }, [armed]);

  // Nothing in the cloud to delete when signed out — don't show the section at all
  if (!supa || !session || !session.user) return null;

  async function deleteAccount() {
    if (!armed) { setArmed(true); return; }
    setDeleting(true); setError('');
    const { error: err } = await supa.rpc('delete_account');
    if (err) { setError('Delete failed: ' + err.message); setDeleting(false); setArmed(false); return; }
    try { localStorage.removeItem('fittrack_cloud_meta'); } catch {}
    await supa.auth.signOut();
    cloudSet('idle');
    setDeleting(false); setArmed(false);
  }

  return (
    <>
      <div className="settings-sec danger-sec">Danger Zone</div>
      <div className="danger-card">
        <div className="danger-lede">
          Deletes your account and everything stored in the cloud. Workouts already on this phone stay here.
        </div>
        <button className="danger-btn" onClick={deleteAccount} disabled={deleting}>
          {deleting ? 'Deleting…' : armed ? 'Tap again to permanently delete' : 'Delete account & cloud data'}
        </button>
        {armed && !deleting && (
          <button className="acct-ghost" onClick={() => setArmed(false)}>Cancel — keep my account</button>
        )}
        {error && <div className="acct-err">{error}</div>}
      </div>
    </>
  );
}

/* ═══════════════════════════════════════
   LOGIN SCREEN (first launch on a new device)
   Shown once per device. Skipped forever after you sign in, or after you
   choose "use this phone only".
═══════════════════════════════════════ */
const AUTH_SKIP_KEY = 'vibelift_auth_skipped';

/* The login screen is a first-run event, not a recurring gate. Once you have
   either signed in or chosen to skip on this device, it never shows again —
   even if the Supabase session later expires or Safari evicts it. A missing
   session then means "sync is paused", which belongs in Settings, not a wall
   in front of your workout. */
function authOnboarded() {
  try { return localStorage.getItem(AUTH_SKIP_KEY) === '1'; } catch { return false; }
}
function markOnboarded() {
  try { localStorage.setItem(AUTH_SKIP_KEY, '1'); } catch {}
}

/* Safari evicts script-writable storage after 7 days of not opening a site,
   which would wipe both the session and the local workout history. Installed
   home-screen apps are exempt, and a granted persistence request exempts the
   rest. Ask once, quietly. */
if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(already => {
    if (!already) navigator.storage.persist().catch(() => {});
  }).catch(() => {});
}

/* Throwaway inboxes (10minutemail and friends) are a bad fit here: the address
   IS the account. When the inbox dies, so does every workout tied to it, and
   there is no way back in. Blocked at sign-up only — signing in to an account
   that already exists is never blocked. */
const DISPOSABLE_EMAIL_RE = /(^|\.)(10minutemail|20minutemail|33mail|anonaddy|burnermail|dispostable|discard\.email|dropmail|emailondeck|fakeinbox|fakemail|getairmail|getnada|guerrillamail|harakirimail|inboxbear|jetable|mailcatch|maildrop|mailinator|mailnesia|mailsac|mailtemp|minuteinbox|mintemail|mohmal|moakt|nada|sharklasers|spam4|spamgourmet|temp-mail|tempail|tempinbox|tempmail|tempmailo|throwawaymail|trashmail|tuta\.io|yopmail|zetmail)\./i;
const DISPOSABLE_EXACT = new Set([
  'mailinator.com','guerrillamail.com','yopmail.com','10minutemail.com','tempmail.com',
  'temp-mail.org','throwawaymail.com','trashmail.com','sharklasers.com','getnada.com',
  'maildrop.cc','mohmal.com','dispostable.com','fakeinbox.com','spamgourmet.com',
  'mailsac.com','moakt.com','minuteinbox.com','emailondeck.com','tempmailo.com',
  'mailnesia.com','inboxkitten.com','mail7.io','burnermail.io','anonaddy.me'
]);
function isDisposableEmail(em) {
  const domain = String(em).split('@')[1] || '';
  if (!domain) return false;
  if (DISPOSABLE_EXACT.has(domain)) return true;
  return DISPOSABLE_EMAIL_RE.test(domain + '.');
}

// Supabase errors are written for developers. Rewrite them for humans.
function friendlyAuthError(msg) {
  const m = (msg || '').toLowerCase();
  // Supabase says "Error sending magic link email" whenever its mail server
  // refuses — bad SMTP credentials, unverified sender, or the hourly cap.
  if (m.includes('error sending') || m.includes('smtp'))
    return 'The email server refused to send. If custom SMTP is set up, check the sender address is verified and the SMTP key is right. Otherwise this is usually the hourly email limit — wait an hour, or skip below and sign in later.';
  if (m.includes('signups not allowed') || m.includes('user not found'))
    return 'No account with that email yet. Go back and tap Sign Up.';
  if (m.includes('rate limit') || m.includes('too many'))
    return 'Too many emails for this address. Wait about an hour, or use the code in the last email we sent.';
  if (m.includes('expired') || m.includes('token') || m.includes('invalid') || m.includes('otp'))
    return "That code didn't work. Open the NEWEST email and type those 6 digits — an older code stops working as soon as you request another. If it still fails, send a fresh code below.";
  if (m.includes('fetch') || m.includes('network'))
    return 'No internet connection. Reconnect and try again.';
  return msg || 'Something went wrong. Try again.';
}

/* A first-ever signup issues a 'signup' token; a returning user gets 'email'
   (magiclink). The wrong type comes back as "expired or invalid", so try each.
   Shared by the first-run login screen and the Settings account card. */
async function verifyEmailCode(em, token) {
  let data = null, err = null;
  for (const type of ['email', 'signup', 'magiclink']) {
    const res = await supa.auth.verifyOtp({ email: em, token, type });
    if (!res.error) { return { data: res.data, err: null }; }
    err = res.error;
    // A genuine wrong/expired code fails every type — keep the first message
    if (!/expired|invalid/i.test(res.error.message || '')) break;
  }
  return { data, err };
}

function LoginScreen({ onSignedIn, onSkip }) {
  const [step, setStep]   = useState('email');  // email | code
  const [email, setEmail] = useState('');
  const [code, setCode]   = useState('');
  const [busy, setBusy]   = useState('');       // '' | 'sending' | 'verifying'
  const [error, setError] = useState('');
  const [cooldown, setCooldown] = useState(0);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  const emailOk = /^\S+@\S+\.\S+$/.test(email.trim());
  const codeOk  = code.replace(/\D/g, '').length >= 6;   // Supabase OTP length is project-configurable (6-10)

  // One path for everyone: an existing account signs in, a new email signs up.
  async function send(resend) {
    if (!emailOk || busy) return;
    if (resend && cooldown > 0) return;   // cooldown guards resends only
    const em = email.trim().toLowerCase();
    if (isDisposableEmail(em)) {
      setError('That looks like a temporary email address. Your account and every workout in it are tied to this inbox — use one you will still have next year.');
      return;
    }
    setError(''); setBusy('sending');
    const { error: err } = await supa.auth.signInWithOtp({
      email: em,
      options: {
        emailRedirectTo: window.location.origin + window.location.pathname,
        shouldCreateUser: true,
      }
    });
    setBusy('');
    if (err) { setError(friendlyAuthError(err.message)); return; }
    setEmail(em); setStep('code'); setCode(''); setCooldown(60);
  }

  async function verify() {
    if (!codeOk || busy) return;
    setError(''); setBusy('verifying');
    const em = email.trim().toLowerCase();
    const token = code.replace(/\D/g, '');
    const { data, err } = await verifyEmailCode(em, token);
    setBusy('');
    if (err) { setError(friendlyAuthError(err.message)); return; }
    markOnboarded();
    onSignedIn(data && data.session);
  }

  function skip() {
    markOnboarded();
    onSkip();
  }

  // No connection / Supabase failed to load — never trap the user behind a wall
  if (!supa) {
    return (
      <div className="screen lg-screen">
        <div className="lg-body">
          <div className="lg-brand">VIBELIFT</div>
          <div className="lg-title">You're offline</div>
          <div className="lg-lede">Signing in needs internet. You can train right now and sign in later from Settings — nothing is lost.</div>
          <button className="btn-pink" onClick={skip}>Continue on This Phone</button>
        </div>
      </div>
    );
  }

  return (
    <div className="screen lg-screen">
      <div className="lg-body">

        {step === 'email' && (
          <>
            <BrandWordmark size={34} className="lg-logo" />
            <DailyQuoteCard />

            <label className="lg-label" htmlFor="lg-email">Email</label>
            <input
              id="lg-email" className="lg-input" type="email" inputMode="email"
              autoComplete="email" autoCapitalize="off" autoCorrect="off" spellCheck="false"
              placeholder="you@example.com"
              value={email}
              disabled={busy === 'sending'}
              onChange={e => { setEmail(e.target.value); setError(''); }}
              onKeyDown={e => { if (e.key === 'Enter') send(false); }}
            />
            <div className="lg-hint">New or returning — we email you a sign-in code. No password.</div>

            {error && <div className="lg-err">{error}</div>}

            <button className="btn-pink lg-cta" onClick={() => send(false)} disabled={!emailOk || busy === 'sending'}>
              {busy === 'sending' ? <><span className="lg-spin" />Sending code…</> : 'Continue →'}
            </button>

            <button className="lg-ghost" onClick={skip}>Skip — use this phone only</button>
          </>
        )}

        {step === 'code' && (
          <>
            <div className="lg-title">Enter code</div>
            <div className="lg-lede">Sent to <b className="lg-em">{email}</b></div>

            <label className="lg-label" htmlFor="lg-code">Code from the email</label>
            <input
              id="lg-code" className="lg-input lg-code" type="text" inputMode="numeric"
              pattern="[0-9]*" autoComplete="one-time-code" maxLength={10}
              placeholder="12345678"
              value={code}
              disabled={busy === 'verifying'}
              onChange={e => { setCode(e.target.value.replace(/\D/g, '').slice(0, 10)); setError(''); }}
              onKeyDown={e => { if (e.key === 'Enter') verify(); }}
            />
            <div className="lg-hint">Type every digit shown in the email. Check spam if it's not there. Valid 1 hour.</div>

            {error && <div className="lg-err">{error}</div>}

            <button className="btn-pink lg-cta" onClick={verify} disabled={!codeOk || busy === 'verifying'}>
              {busy === 'verifying' ? <><span className="lg-spin" />Signing in…</> : 'Sign In →'}
            </button>

            <button className="lg-ghost" onClick={() => send(true)} disabled={cooldown > 0 || !!busy}>
              {busy === 'sending' ? 'Sending…' : cooldown > 0 ? `Resend in ${cooldown}s` : 'Resend code'}
            </button>
            <button className="lg-ghost" onClick={() => { setStep('email'); setCode(''); setError(''); setCooldown(0); }} disabled={!!busy}>← Back</button>
          </>
        )}

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   SETTINGS / PROFILE SCREEN
═══════════════════════════════════════ */
function SettingsScreen({ onBack, profile, onSaveProfile, theme, onToggleTheme, customEx, onSaveCustomEx, onShowTour }) {
  const [editingName, setEditingName] = useState(false);
  const [name, setName] = useState((profile && profile.name) || '');
  const [showAdd, setShowAdd] = useState(false);
  const [photoErr, setPhotoErr] = useState('');
  const photoInput = React.useRef(null);

  async function onPhotoPicked(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';                       // let the same file be picked again
    if (!file) return;
    setPhotoErr('');
    try {
      const avatar = await fileToAvatar(file);
      onSaveProfile({ ...profile, avatar });
    } catch (err) { setPhotoErr(err.message || "Couldn't use that photo."); }
  }

  const [newName, setNewName] = useState('');
  const [newGroup, setNewGroup] = useState('chest');
  const weightUnit = (profile && profile.weightUnit) || 'kg';
  function toggleWeightUnit() { onSaveProfile({ ...profile, weightUnit: weightUnit === 'kg' ? 'lb' : 'kg' }); }

  function saveName() {
    onSaveProfile({ ...profile, name: name.trim() });
    setEditingName(false);
  }

  function addExercise() {
    if (!newName.trim()) return;
    const glLabel = DB.find(e => e.group === newGroup);
    const ex = { id: 'custom_' + Date.now(), name: newName.trim(), group: newGroup, gl: glLabel ? glLabel.gl : newGroup, custom: true };
    onSaveCustomEx([...customEx, ex]);
    setNewName(''); setShowAdd(false);
  }

  const groups = Object.keys(GROUP_META);

/* ═══════════════════════════════════════
   HISTORY SCREEN
═══════════════════════════════════════ */
function HistoryScreen({ onBack, history, weightUnit = 'kg' }) {
  const [filter, setFilter] = React.useState('all');

  const today = todayISO();
  const weekStart = (() => {
    // Week starts Monday (European convention); local time, not UTC
    const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localISO(d);
  })();
  const monthStart = today.slice(0,7);

  const sorted = [...history].reverse();
  const filtered = filter === 'all' ? sorted
    : filter === 'week'  ? sorted.filter(w => w.date >= weekStart)
    : sorted.filter(w => w.date.slice(0,7) === monthStart);

  const thisWeekCount = sorted.filter(w => w.date >= weekStart).length;

  return (
    <div className="screen">
      <div className="hdr">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="hdr-title">History</span>
        <div style={{ width: 38 }} />
      </div>
      <div className="hist-body">
        {/* Stat cards */}
        <div className="hist-stats-row">
          <div className="hist-stat-card">
            <div className="hist-stat-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" />
              </svg>
            </div>
            <div className="hist-stat-val">{history.length}</div>
            <div className="hist-stat-lbl">Total Workouts</div>
          </div>
          <div className="hist-stat-card">
            <div className="hist-stat-icon">📅</div>
            <div className="hist-stat-val" style={{ color: 'var(--pink)' }}>{thisWeekCount}</div>
            <div className="hist-stat-lbl">This Week</div>
          </div>
        </div>

        {/* Filter pills */}
        <div className="hist-filter-row">
          {[['all','All'],['week','This Week'],['month','This Month']].map(([val, lbl]) => (
            <button key={val} className={`hist-filter-pill ${filter === val ? 'active' : ''}`} onClick={() => setFilter(val)}>{lbl}</button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div className="hist-empty">
            <div className="hist-empty-icon">📋</div>
            <div className="hist-empty-txt">No workouts yet.<br/>Start your first session to see history here.</div>
          </div>
        )}
        {filtered.map((w, i) => {
          const totalSets = w.exercises.reduce((s,e)=>s+e.sets.length,0);
          const totalVol  = w.exercises.reduce((s,e)=>e.sets.reduce((a,t)=>a+t.weight*t.reps,s),0);
          return (
            <div key={i} className="hist-workout-card">
              <div className="hist-workout-hdr">
                <div>
                  <div className="hist-workout-date">{fmtDate(w.date)}</div>
                  <div className="hist-workout-meta">{w.exercises.length} exercises · {totalSets} sets</div>
                </div>
                <div className="hist-workout-vol">{fmtVol(totalVol, weightUnit)}</div>
              </div>
              <div className="hist-ex-list">
                {w.exercises.map((ex, j) => {
                  const meta = GROUP_META[ex.group] || GROUP_META.chest;
                  return (
                    <div key={j} className="hist-ex-row">
                      {ex.sessionAdded
                        ? <div style={{ width:26, height:26, borderRadius:8, background:meta.color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:8, fontWeight:800, color:meta.color, textAlign:'center', lineHeight:1, flexShrink:0 }}>{ex.name.substring(0,3).toUpperCase()}</div>
                        : <ExIcon id={ex.id} size={26} color={meta.color} img={ex.img || null} builder={ex.builder || null} />}
                      <div className="hist-ex-info">
                        <div className="hist-ex-name">{ex.name}</div>
                        <div className="hist-ex-sets">
                          {ex.sets.map((s, k) => (
                            <span key={k} className="hist-set-pill">{s.bw ? 'BW' : kgToDisp(s.weight, weightUnit) + weightUnit} × {s.reps}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   GROUP SELECT SCREEN
═══════════════════════════════════════ */
function GroupSelectScreen({ onBack, onSelectGroup, onFinish, completedIds, partialMap = {}, allExercises, planMode = false, planIds = [], onSavePlan }) {
  const groups = Object.keys(GROUP_META);
  const exList = allExercises || DB;
  const totalLogged = completedIds.length + Object.keys(partialMap).length;
  return (
    <div className="screen">
      <div className="hdr">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="hdr-title">{planMode ? 'Plan Next Workout' : 'Choose Muscle Group'}</span>
        {planMode && planIds.length > 0
          ? <span className="done-count-badge">{planIds.length} picked</span>
          : completedIds.length > 0
          ? <span className="done-count-badge">{completedIds.length} done</span>
          : <div style={{ width: 38 }} />}
      </div>
      <div className="group-select-body">
        {groups.map(grp => {
          const meta = GROUP_META[grp];
          const exs  = exList.filter(e => e.group === grp);
          const doneCnt = exs.filter(e => completedIds.includes(e.id)).length;
          const partCnt = exs.filter(e => partialMap[e.id]).length;
          const planCnt = planIds.length ? exs.filter(e => planIds.includes(e.id)).length : 0;
          return (
            <div
              key={grp}
              className="grp-card"
              style={meta.img
                ? { backgroundImage: `url('./assets/${meta.img}')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundColor: '#111' }
                : { background: meta.grad }}
              onClick={() => onSelectGroup(grp)}
            >
              {!meta.img && <div className="grp-card-bg-icon"><ExIcon id={meta.icon} size={130} color="white" /></div>}
              {doneCnt > 0 && <div className="grp-done-pill">✓ {doneCnt} done</div>}
              {doneCnt === 0 && planCnt > 0 && <div className="grp-done-pill">{planCnt} planned</div>}
              <div className="grp-card-overlay">
                <div className="grp-card-name">{exs[0].gl}</div>
                <div className="grp-card-count">{exs.length} exercises{doneCnt > 0 ? ` · ${doneCnt} completed` : ''}{partCnt > 0 ? ` · ${partCnt} in progress` : ''}{planCnt > 0 ? ` · ${planCnt} planned` : ''}</div>
              </div>
            </div>
          );
        })}
      </div>
      {planMode ? (
        planIds.length > 0 && (
          <div className="finish-bar">
            <button className="btn-pink" onClick={onSavePlan}>Save Plan ({planIds.length})</button>
          </div>
        )
      ) : totalLogged > 0 && (
        <div className="finish-bar">
          <button className="btn-pink" onClick={onFinish}>Finish Workout</button>
        </div>
      )}
    </div>
  );
}

const BUILDER_POSES = {

  'Hanging':   { head:[105,58], sh:[105,76], hip:[105,112], knee:[103,134], foot:[99,148], fwd:[1,0], up:[0,-1],
                 bench:'<line x1="70" y1="30" x2="150" y2="30" stroke="#59614a" stroke-width="6" stroke-linecap="round"/>', hang:true },
};
const BUILDER_ARMS = {
  'Press':     { e:[10,12],  h:[15,36] },
  'Row':       { e:[8,-12],  h:[18,-4] },
  'Curl':      { e:[3,-16],  h:[17,-6] },
  'Raise':     { e:[15,1],   h:[29,3] },
  'Extension': { e:[7,16],   h:[19,28] },
  'Squat':     { e:[4,-14],  h:[7,-23] },
  'Lunge':     { e:[4,-14],  h:[7,-23] },
  'Fly':       { e:[16,0],   h:[27,13] },
  'Pull':      { e:[7,14],   h:[9,30] },
  'Hold':      { e:[2,-13],  h:[4,-23] },
  '_idle':     { e:[3,-13],  h:[5,-23] },
};
/* Arm pose at the START of a rep (t = 0). BUILDER_ARMS above is the peak
   (t = 1). The wiki animation lerps between the two. Moves missing here
   animate the body instead (Squat/Lunge/hanging) or hold still (Hold). */
const BUILDER_ARM_START = {
  'Press':     { e:[5,2],   h:[8,10] },
  'Row':       { e:[12,8],  h:[22,16] },
  'Curl':      { e:[3,-16], h:[6,-28] },
  'Raise':     { e:[6,-12], h:[11,-22] },
  'Extension': { e:[7,16],  h:[8,8] },
  'Fly':       { e:[18,-4], h:[32,-2] },
  'Pull':      { e:[6,0],   h:[10,8] },
};
function builderFigureSVG(eq, pos, move, t) {
  const FIG = '#f0f5d8', EQC = '#c8f235', BEN = '#59614a';
  const pose = BUILDER_POSES[pos || 'Standing'];
  let arm = BUILDER_ARMS[move || '_idle'];
  if (pose.hang) arm = BUILDER_ARMS['Pull'];
  if (pose.pressUp && move === 'Press') arm = { e:[2,14], h:[2,30] };
  // t == null → static preview (exact old behavior). t in 0..1 → wiki animation.
  const bodyMoves = move === 'Squat' || move === 'Lunge';
  let dy = 0;
  if (t != null) {
    if (pose.hang || bodyMoves) dy = (1 - t) * 14;
    else {
      const f = BUILDER_ARM_START[move];
      if (f) arm = { e:[f.e[0]+(arm.e[0]-f.e[0])*t, f.e[1]+(arm.e[1]-f.e[1])*t],
                     h:[f.h[0]+(arm.h[0]-f.h[0])*t, f.h[1]+(arm.h[1]-f.h[1])*t] };
    }
  }
  const legsFixed = bodyMoves && !pose.hang;      // squatting: feet stay planted
  const B = p => [p[0], p[1] + dy];
  const head = B(pose.head), hip = B(pose.hip);
  const knee = legsFixed ? pose.knee : B(pose.knee);
  const foot = legsFixed ? pose.foot : B(pose.foot);
  const Pt = (base, off) => [base[0]+pose.fwd[0]*off[0]+pose.up[0]*off[1], base[1]+pose.fwd[1]*off[0]+pose.up[1]*off[1]];
  const Ln = (a,b,w,c,o) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||FIG}" stroke-width="${w||5}" stroke-linecap="round"${o?` opacity="${o}"`:''}/>`;
  const Ci = (p,r,c,o) => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c||FIG}"${o?` opacity="${o}"`:''}/>`;
  const sh = B(pose.sh);
  let elbow = Pt(sh, arm.e), hand = Pt(sh, arm.h);
  if (pose.hang) { elbow = [sh[0]+6, (sh[1]+32)/2]; hand = [pose.sh[0]+8, 32]; }
  let s = `<line x1="20" y1="150" x2="200" y2="150" stroke="rgba(127,127,127,.25)" stroke-width="2"/>` + pose.bench;
  if (eq === 'Cable') { const py = hand[1] < sh[1] ? 32 : 144; s += `<rect x="186" y="24" width="8" height="126" rx="3" fill="${BEN}"/>` + Ci([190,py],4,EQC) + Ln(hand,[190,py],2.5,EQC); }
  if (eq === 'Machine') { s += `<rect x="48" y="26" width="7" height="124" rx="3" fill="${BEN}"/><rect x="48" y="26" width="60" height="7" rx="3" fill="${BEN}"/>` + Ln([104,32],hand,3,BEN); }
  if (eq === 'Smith Machine') { s += `<rect x="60" y="22" width="5" height="128" fill="${BEN}"/><rect x="158" y="22" width="5" height="128" fill="${BEN}"/>` + Ln([62,hand[1]],[161,hand[1]],4,EQC) + Ci([70,hand[1]],7,EQC) + Ci([152,hand[1]],7,EQC); }
  const e2 = [elbow[0]-7, elbow[1]+3], h2 = [hand[0]-7, hand[1]+3];
  s += Ln(sh,e2,5,FIG,.3) + Ln(e2,h2,5,FIG,.3) + Ci(h2,3,FIG,.3);
  s += Ln(sh,hip,7) + Ln(hip,knee,5.5) + Ln(knee,foot,5.5) + Ci(foot,3.5) + Ln(sh,head,4) + Ci(head,8);
  s += Ln(sh,elbow,5) + Ln(elbow,hand,5) + Ci(hand,3.5);
  if (eq === 'Barbell') {
    if (move === 'Squat' || move === 'Lunge') s += Ci([sh[0],sh[1]-4],8,EQC,.9) + Ln([sh[0]-16,sh[1]-4],[sh[0]+16,sh[1]-4],4,EQC);
    else s += Ci(hand,9,EQC,.92) + Ci(hand,5,'#121508') + Ci(hand,3,EQC);
  }
  if (eq === 'Dumbbell') s += Ln([hand[0]-7,hand[1]],[hand[0]+7,hand[1]],4,EQC) + Ci([hand[0]-7,hand[1]],5,EQC) + Ci([hand[0]+7,hand[1]],5,EQC);
  if (eq === 'Kettlebell') s += Ci([hand[0],hand[1]+9],7,EQC) + `<path d="M ${hand[0]-5} ${hand[1]+4} Q ${hand[0]} ${hand[1]-4} ${hand[0]+5} ${hand[1]+4}" stroke="${EQC}" stroke-width="3" fill="none"/>`;
  if (eq === 'Plate') s += Ci(hand,10,EQC,.92) + Ci(hand,4,'#121508');
  if (eq === 'Band') { const a = [pose.foot[0],148]; s += `<path d="M ${hand[0]} ${hand[1]} Q ${(hand[0]+a[0])/2+9} ${(hand[1]+a[1])/2} ${a[0]} ${a[1]}" stroke="${EQC}" stroke-width="3" fill="none" stroke-dasharray="5 4"/>`; }
  return s;
}

/* Looping animated figure for the wiki sheet — re-renders builderFigureSVG
   with a phase easing 0→1→0, one rep every ~2.2 s with a pause at the peak. */
function AnimatedFigure({ eq, pos, move }) {
  const [t, setT] = useState(1);
  useEffect(() => {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let raf;
    const start = performance.now();
    const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
    const loop = now => {
      const ph = ((now - start) % 2200) / 2200;
      const lin = ph < .4 ? ph / .4 : ph < .55 ? 1 : ph < .95 ? 1 - (ph - .55) / .4 : 0;
      setT(ease(lin));
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [eq, pos, move]);
  return <svg viewBox="0 0 220 170" dangerouslySetInnerHTML={{ __html: builderFigureSVG(eq, pos, move, t) }} />;
}

function ExerciseBuilder({ group, gl, onSave, onCancel }) {
  const [step, setStep] = useState(1);
  const [eq, setEq]     = useState(null);
  const [pos, setPos]   = useState(null);
  const [move, setMove] = useState(null);
  const [grip, setGrip] = useState(null);
  const [name, setName] = useState('');
  const STEPS = {
    1: { title:'Equipment', sub:'What are you lifting with?', chips:['Barbell','Dumbbell','Cable','Machine','Bodyweight','Kettlebell','Plate','Band','Smith Machine'], val:eq, set:setEq, btn:'Next: Position' },
    2: { title:'Position', sub:'How is your body set up?', chips:['Standing','Seated','Lying Flat','Incline','Decline','Bent-Over','Kneeling','Hanging'], val:pos, set:setPos, btn:'Next: Movement' },
    3: { title:'Movement', sub:'What does the movement look like?', chips:['Press','Row','Curl','Raise','Extension','Squat','Lunge','Fly','Pull','Hold'], val:move, set:setMove, btn:'Next: Name' },
    4: { title:'Name & Save', sub:'Auto-named. Edit it if you like.', btn:'Save to ' + gl },
  };
  const s = STEPS[step];
  const autoName = [pos, eq, grip, move].filter(Boolean).join(' ');
  function next() {
    if (step < 4) {
      if (step === 3) setName(autoName);
      setStep(step + 1);
      return;
    }
    const finalName = (name || autoName || '').trim();
    if (!finalName) return;
    onSave({
      id: 'custom_' + Date.now(),
      name: finalName, group, gl,
      eq: BUILDER_EQ_MAP[eq] || 'dumbbell',
      custom: true,
      builder: { eq, pos, move, grip },
    });
  }
  const chipRow = (chips, val, set) => chips.map(c => (
    <div key={c} className={`builder-chip ${val === c ? 'sel' : ''}`} onClick={() => set(val === c ? null : c)}>{c}</div>
  ));
  return (
    <div className="builder-card">
      <div className="builder-steps">{[1,2,3,4].map(i => <div key={i} className={`builder-step ${i <= step ? 'on' : ''}`} />)}</div>
      <div>
        <div className="builder-title">{s.title}</div>
        <div className="builder-sub">{s.sub}</div>
      </div>
      <div className="builder-stage">
        <svg viewBox="0 0 220 170" dangerouslySetInnerHTML={{ __html: builderFigureSVG(eq, pos, move) }} />
      </div>
      <div className="builder-name-preview">
        <label>Your exercise · {gl}</label>
        <div className="builder-name-line">
          {step === 4
            ? <span className="b-slot">{name || autoName || '—'}</span>
            : autoName
              ? <span className="b-slot">{autoName}</span>
              : <span className="b-ghost">Tap chips to build the name…</span>}
        </div>
      </div>
      {step < 4 ? (
        <div className="builder-chips">
          {chipRow(s.chips, s.val, s.set)}
          {step === 3 && <>
            <div className="builder-chips-label">Grip (optional)</div>
            {chipRow(['Overhand','Underhand','Neutral','Wide Grip','Close Grip'], grip, setGrip)}
          </>}
        </div>
      ) : (
        <div>
          <div className="setup-label">Name — edit if you want (e.g. "Power Clean")</div>
          <input className="setup-input" type="text" value={name} placeholder={autoName || 'e.g. Power Clean'} onChange={e => setName(e.target.value)} />
        </div>
      )}
      <button className="btn-pink" onClick={next} disabled={step < 4 ? !s.val : !(name || autoName).trim()}>{s.btn}</button>
      {step < 4 && <button className="btn-outline" onClick={() => setStep(step + 1)}>Skip this step →</button>}
      {step > 1 && <button className="btn-outline" onClick={() => setStep(step - 1)}>← Back</button>}
      <button className="btn-outline" onClick={onCancel}>Cancel</button>
    </div>
  );
}

function GroupDetailScreen({ group, onBack, onPick, onFinish, completedIds, partialMap = {}, history, allExercises, onSaveCustom, planMode = false, planIds = [], onTogglePlan, onSavePlan, weightUnit = 'kg' }) {
  const [showAddCustom, setShowAddCustom] = useState(false);
  const [wikiEx, setWikiEx] = useState(null);
  const meta = GROUP_META[group];
  const exsRaw = (allExercises || DB).filter(e => e.group === group);
  // A planned workout floats its exercises to the top of the list.
  const exs = planIds.length && !planMode
    ? [...exsRaw].sort((a, b) => (planIds.includes(b.id) ? 1 : 0) - (planIds.includes(a.id) ? 1 : 0))
    : exsRaw;
  const totalLogged = completedIds.length + Object.keys(partialMap).length;

  function handleBuilderSave(ex) {
    setShowAddCustom(false);
    onSaveCustom(ex);
    if (planMode) onTogglePlan(ex); else onPick(ex);
  }

  return (
    <div className="screen">
      <div className="hdr">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="hdr-title">{exs[0].gl}</span>
        {planMode && planIds.length > 0
          ? <span className="done-count-badge">{planIds.length} picked</span>

      </div>
      <div className="group-detail-body">
        <div className="grp-detail-hero">
          <div className="grp-detail-hero-inner" style={meta.img
            ? { backgroundImage: `url('./assets/${meta.img}')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundColor: '#111' }
            : { background: meta.grad }}>
            <div style={{ position:'absolute', inset:0, background:'linear-gradient(to right, rgba(0,0,0,.72) 0%, rgba(0,0,0,.2) 100%)', zIndex:0 }} />
            <div style={{ position:'relative', zIndex:1 }}>
              <div className="grp-detail-hero-name">{exs[0].gl}</div>
              <div className="grp-detail-hero-sub">{exs.length} exercises</div>
            </div>
          </div>
        </div>

        {exs.map(ex => {
          const inPlan = planIds.includes(ex.id);
          const done = planMode ? inPlan : completedIds.includes(ex.id);
          const partialSets = partialMap[ex.id] || 0;
          const pb   = getPersonalBest(history, ex.id);
          return (
            <div key={ex.id} className={`ex-row-card ${done ? 'done-row' : ''}`} onClick={() => planMode ? onTogglePlan(ex) : onPick(ex)}>
              <div className="ex-row-icon">
                <ExIcon id={ex.id} size={28} color={done ? '#0daa74' : meta.color} img={ex.img || null} builder={ex.builder || null} />
              </div>
              <div className="ex-row-info">
                <div className="ex-row-name">{ex.name}</div>
                {pb > 0 && <div className="ex-row-pb">Best: {kgToDisp(pb, weightUnit)} {weightUnit}</div>}
                {ex.custom && <span className="ex-custom-tag">Custom</span>}
                {!planMode && inPlan && !completedIds.includes(ex.id) && <span className="ex-plan-tag">Planned</span>}
              </div>
              {wikiInfo(ex) && (
                <button className="ex-info-btn" aria-label={`How to do ${ex.name}`}
                  onClick={e => { e.stopPropagation(); setWikiEx(ex); }}>i</button>
              )}
              {done && <div className="ex-row-check">✓</div>}
              {!done && partialSets > 0 && (
                <div style={{ fontFamily:'var(--fb)', fontSize:11, fontWeight:800, color:'#121508', background:'var(--pink)', padding:'4px 9px', borderRadius:20, display:'flex', alignItems:'center', gap:5, whiteSpace:'nowrap', flexShrink:0 }}>
                  <span style={{ width:6, height:6, borderRadius:'50%', background:'#121508' }} />
                  {partialSets} {partialSets === 1 ? 'set' : 'sets'} · in progress
                </div>
              )}
            </div>
          );
        })}

        {/* Build your own exercise */}
        {showAddCustom ? (
          <ExerciseBuilder group={group} gl={exs[0] ? exs[0].gl : group.charAt(0).toUpperCase() + group.slice(1)} onSave={handleBuilderSave} onCancel={() => setShowAddCustom(false)} />
        ) : (
          <div className="ex-row-card" style={{ borderStyle:'dashed', borderColor:'var(--text2)', opacity:.65 }} onClick={() => setShowAddCustom(true)}>
            <div className="ex-row-icon" style={{ fontSize:20, color:'var(--text2)' }}>+</div>
            <div className="ex-row-info">
              <div className="ex-row-name" style={{ color:'var(--text2)' }}>Build your own exercise</div>
              <div className="ex-row-pb">Pick equipment, position, movement — it stays in this group</div>
            </div>
          </div>
        )}
      </div>
      {planMode ? (
        planIds.length > 0 && (
          <div className="finish-bar">
            <button className="btn-pink" onClick={onSavePlan}>Save Plan ({planIds.length})</button>
          </div>
        )
      ) : totalLogged > 0 && (
        <div className="finish-bar">
          <button className="btn-pink" onClick={onFinish}>Finish Workout</button>
        </div>
      )}
      {wikiEx && <WikiSheet exercise={wikiEx} onClose={() => setWikiEx(null)} />}
    </div>
  );
}
