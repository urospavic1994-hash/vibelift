<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeLift</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121508">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeLift">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta property="og:title" content="VibeLift">
  <meta property="og:description" content="Track your workouts, lift your vibe.">
  <meta property="og:image" content="https://vibelift.vercel.app/assets/logo.png">
  <meta property="og:url" content="https://vibelift.vercel.app/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #c8f235;
      --pink2:     #b0d929;
      --navy:      #121508;
      --navy2:     #1b2010;
      --navy3:     #242d16;
      --success:   #7ec832;
      --pink-glow: rgba(200,242,53,.22);

      /* Dark defaults — app loads dark before JS runs */
      --bg:     #121508;
      --card:   #1b2010;
      --sfx:    #242d16;
      --border: rgba(200,242,53,0.12);
      --text:   #f0f5d8;
      --text2:  rgba(240,245,216,0.45);
      --hdr-bg: rgba(18,21,8,.92);
      --bar-bg: rgba(18,21,8,.96);
      --sh1: 0 1px 4px rgba(0,0,0,.3), 0 3px 10px rgba(0,0,0,.35);
      --sh2: 0 2px 8px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.42);
      --sh3: 0 4px 16px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.50);

      --r:    18px;
      --r-sm: 12px;
      --fd: 'Passion One', sans-serif;
      --fb: 'DM Sans', sans-serif;
    }

    [data-theme="light"] {
      --bg:     #f4f7e8;
      --card:   #ffffff;
      --sfx:    #edf2d8;
      --border: rgba(18,21,8,0.1);
      --text:   #121508;
      --text2:  rgba(18,21,8,0.5);
      --hdr-bg: rgba(255,255,255,.88);
      --bar-bg: rgba(255,255,255,.92);
      --sh1: 0 1px 4px rgba(18,21,8,.05), 0 3px 10px rgba(18,21,8,.06);
      --sh2: 0 2px 8px rgba(18,21,8,.05), 0 8px 26px rgba(18,21,8,.09);
      --sh3: 0 4px 16px rgba(18,21,8,.08), 0 20px 48px rgba(18,21,8,.12);
    }

    /* Keep dark selector as a no-op alias so existing stored 'dark' value still works */
    [data-theme="dark"] {}

    html, body { height: 100%; overflow-x: hidden; overscroll-behavior: none; }

    body {
      font-family: var(--fb);
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
    }

    body::before {
      content: '';
      position: fixed; top: -60px; right: -60px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px; left: -150px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(126,200,50,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    #root { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 1; }

    .screen {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      animation: slideUp .26s cubic-bezier(.18,.82,.4,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Glass header ── */
    .hdr {
      padding: calc(13px + env(safe-area-inset-top)) 18px 13px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--hdr-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .hdr-title { font-family: var(--fd); font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: .6px; }

    .back-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: rgba(127,127,127,.1); color: var(--text);
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .14s, transform .1s;
    }
    .back-btn:active { background: rgba(127,127,127,.2); transform: scale(.92); }

    /* ── Theme toggle ── */
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text2); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh1); transition: transform .1s;
    }
    .theme-btn:active { transform: scale(.9); }

    /* ── Buttons ── */
    .btn-pink {
      width: 100%; padding: 16px; border-radius: var(--r-sm);
      border: none;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink2) 100%);
      color: #121508; font-family: var(--fd);
      font-size: 18px; font-weight: 800; letter-spacing: .8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,242,53,.35), 0 1px 4px rgba(176,217,41,.22);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-pink:active {
      transform: scale(.93);
      filter: brightness(1.3);
      box-shadow: 0 0 0 6px rgba(200,242,53,.28), 0 2px 8px rgba(200,242,53,.25);
      transition: transform .05s, box-shadow .05s, filter .05s;
    }
    .btn-pink:disabled { opacity: .38; }
    .btn-pink.btn-pop { animation: btn-pop .35s cubic-bezier(.2,.8,.4,1); }
    @keyframes btn-pop {
      0%   { transform: scale(.93); box-shadow: 0 0 0 0 rgba(200,242,53,.5); }
      55%  { transform: scale(1.03); }
      100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(200,242,53,0); }
    }

    .btn-outline {
      width: 100%; padding: 14px; border-radius: var(--r-sm);
      border: 2px solid var(--border); background: transparent;
      color: var(--text); font-family: var(--fd);
      font-size: 17px; font-weight: 700; letter-spacing: .4px;
      cursor: pointer; transition: background .14s, transform .12s, border-color .14s;
    }
    .btn-outline:active {
      background: rgba(200,242,53,.10); transform: scale(.95);
      border-color: rgba(200,242,53,.45);
      transition: background .05s, transform .05s, border-color .05s;
    }

    /* ── Card ── */
    .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--sh2); }
    .sec-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.6px; color: var(--text2); margin-bottom: 14px;
    }

    /* ══════════════════════════════════
       HOME SCREEN
    ══════════════════════════════════ */
    .home-screen {
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    }
    .home-compact-hdr {
      position: sticky; top: 0; z-index: 100;
      background: var(--hdr-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .home-hdr-left { display: flex; align-items: center; gap: 12px; }
    .home-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--navy3); border: 2px solid var(--pink);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fd); font-size: 15px; font-weight: 900; color: var(--pink);
    }
    .home-greeting { font-family: var(--fd); font-size: 19px; font-weight: 900; color: var(--text); letter-spacing: .3px; }
    .home-date-sub { font-size: 11px; color: var(--text2); font-weight: 500; margin-top: 1px; }
    .home-hdr-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--sfx);
      color: var(--text2); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .14s;
    }
    .home-hdr-btn:active { background: var(--card); }

    /* Week date strip */
    .week-strip {
      display: flex; gap: 8px; padding: 16px 18px 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .week-strip::-webkit-scrollbar { display: none; }
    .week-day {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 14px; border-radius: 22px; min-width: 48px; flex-shrink: 0;
      font-size: 11px; font-weight: 700; color: var(--text2); cursor: default;
      transition: background .15s;
    }
    .week-day-name { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
    .week-day-num { font-family: var(--fd); font-size: 18px; font-weight: 900; line-height: 1; }
    .week-day.today { background: var(--pink); color: #121508; box-shadow: 0 4px 14px rgba(200,242,53,.35); }
    .week-day.has-workout:not(.today) { border: 1.5px solid var(--pink); }

    /* Stat cards grid */
    .home-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 18px 4px; }
    .home-stat-card {
      background: var(--card); border-radius: var(--r); padding: 16px 14px;
      box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 4px;
    }
    .home-stat-icon { font-size: 20px; margin-bottom: 2px; }
    .home-stat-val { font-family: var(--fd); font-size: 40px; font-weight: 900; color: var(--text); line-height: 1; }
    .home-stat-val.accent { color: var(--pink); }
    .home-stat-lbl { font-size: 11px; color: var(--text2); font-weight: 600; }

    /* Home body padding */
    .home-body {
      flex: 1; padding: 12px 18px calc(88px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }

    /* Legacy classes for other screens still using these */
    .home-scroll-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .home-scroll-body {
      flex: 1; overflow-y: auto;
      padding: 18px 18px 60px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--sh2); }
    .stat-val        { font-family: var(--fd); font-size: 44px; font-weight: 900; color: var(--text); line-height: 1; }
    .stat-val.accent { color: var(--pink); }
    .stat-lbl        { font-size: 12px; color: var(--text2); margin-top: 4px; font-weight: 500; }

    /* calendar */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-lbl { text-align: center; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); padding-bottom: 6px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; font-weight: 600; color: var(--text2);
      cursor: default; transition: background .15s; position: relative;
    }
    .cal-day.has-workout { background: rgba(200,242,53,.15); color: var(--pink); cursor: pointer; font-weight: 700; }
    .cal-day.has-workout:active { background: rgba(200,242,53,.28); }
    .cal-day.in-progress { background: rgba(200,242,53,.18); color: var(--pink); cursor: pointer; font-weight: 700; }
    .cal-day.today-ring { box-shadow: 0 0 0 2px var(--text); }
    .cal-day.future { opacity: .3; }
    .cal-day.selected { background: var(--pink) !important; color: #121508 !important; box-shadow: 0 2px 12px rgba(200,242,53,.40); }
    .cal-day.in-progress.selected { background: var(--pink) !important; color: #121508 !important; }
    .cal-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--pink); flex-shrink: 0; }
    .cal-day.selected .cal-day-dot { background: #121508; }
    .cal-expand {
      grid-column: 1 / -1;
      background: var(--sfx); border-radius: 12px;
      padding: 12px 14px; margin-top: 2px;
      border-left: 3px solid var(--pink);
      animation: slideDown .2s ease;
    }
    .cal-expand.active-expand { border-left-color: var(--pink); }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes barSwitch { from { opacity:0; transform:scaleX(.55) scaleY(.4); } to { opacity:1; transform:scaleX(1) scaleY(1); } }
    .cal-expand-date { font-family: var(--fd); font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 8px; letter-spacing: .3px; }
    .cal-expand-ex { font-size: 12px; color: var(--text2); padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cal-expand-ex:last-child { border-bottom: none; }
    .cal-expand-ex-name { font-weight: 600; color: var(--text); }
    .cal-in-progress-badge { font-size: 10px; font-weight: 700; color: var(--pink); background: rgba(200,242,53,.14); padding: 2px 8px; border-radius: 20px; }

    /* break modal & exercise-done sheet */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal-sheet {
      width: 100%; max-width: 430px; margin: 0 auto;
      background: var(--card); border-radius: 24px 24px 0 0;
      padding: 20px 22px env(safe-area-inset-bottom, 28px);
      animation: slideUp .28s cubic-bezier(.18,.82,.4,1);
    }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 20px; }
    .modal-title { font-family: var(--fd); font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: .4px; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--text2); margin-bottom: 22px; line-height: 1.5; }
    .ex-done-btn {
      width: 100%; padding: 16px 18px; border-radius: var(--r-sm); border: 2px solid var(--border);
      background: var(--card); color: var(--text);
      font-family: var(--fd); font-size: 17px; font-weight: 800; letter-spacing: .4px;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--sh1); transition: border-color .14s, background .14s; margin-bottom: 10px;
    }
    .ex-done-btn:active { background: var(--sfx); border-color: var(--pink); }
    .ex-done-btn-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .ex-done-finish {
      width: 100%; padding: 11px; border-radius: var(--r-sm); border: none; margin-top: 2px;
      background: transparent; color: var(--text2);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: color .14s;
    }
    .ex-done-finish:active { color: var(--text); }

    /* Home history preview */
    .hist-preview-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .hist-preview-row:last-child { border-bottom: none; }
    .hist-preview-date { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .hist-preview-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .hist-preview-icons { display: flex; gap: 4px; align-items: center; }
    .view-all-btn {
      display: block; width: 100%; margin-top: 12px; padding: 10px;
      border-radius: var(--r-sm); border: 1.5px solid var(--border); background: transparent;
      color: var(--text2); font-family: var(--fd); font-size: 14px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
      transition: background .14s;
    }
    .view-all-btn:active { background: rgba(127,127,127,.07); }

    /* ══════════════════════════════════
       HISTORY SCREEN
    ══════════════════════════════════ */
    .hist-body { flex: 1; overflow-y: auto; padding: 0 18px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    /* History stat cards */
    .hist-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 0 4px; }
    .hist-stat-card {
      background: var(--card); border-radius: var(--r); padding: 16px 14px; box-shadow: var(--sh2);
    }
    .hist-stat-icon { font-size: 20px; margin-bottom: 4px; }
    .hist-stat-val { font-family: var(--fd); font-size: 38px; font-weight: 900; color: var(--text); line-height: 1; }
    .hist-stat-lbl { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 3px; }

    /* Filter pills */
    .hist-filter-row { display: flex; gap: 8px; padding: 4px 0 12px; overflow-x: auto; }
    .hist-filter-row::-webkit-scrollbar { display: none; }
    .hist-filter-pill {
      padding: 8px 18px; border-radius: 22px; flex-shrink: 0;
      font-family: var(--fb); font-size: 13px; font-weight: 700;
      background: var(--sfx); color: var(--text2); cursor: pointer;
      border: none; transition: background .15s, color .15s;
    }
    .hist-filter-pill.active { background: var(--pink); color: #121508; }

    .hist-workout-card { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh2); }
    .hist-workout-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .hist-workout-date { font-family: var(--fd); font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .hist-workout-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .hist-workout-vol {
      font-family: var(--fd); font-size: 16px; font-weight: 800; color: var(--pink);
      background: rgba(200,242,53,.12); padding: 4px 10px; border-radius: 20px;
    }
    .hist-ex-list { padding: 4px 0; }
    .hist-ex-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
    }
    .hist-ex-row:last-child { border-bottom: none; }
    .hist-ex-info { flex: 1; }
    .hist-ex-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .hist-ex-sets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .hist-set-pill {
      font-size: 11px; font-weight: 600; color: var(--text2);
      background: var(--sfx); padding: 3px 8px; border-radius: 20px;
    }
    .hist-empty { text-align: center; padding: 60px 24px; color: var(--text2); }
    .hist-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .hist-empty-txt { font-size: 15px; line-height: 1.6; }

    /* ══════════════════════════════════
       GROUP SELECT SCREEN
    ══════════════════════════════════ */
    .group-select-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    .grp-card {
      position: relative; border-radius: 20px; overflow: hidden; height: 148px;
      cursor: pointer; box-shadow: var(--sh2);
      transition: transform .14s cubic-bezier(.2,.8,.4,1);
    }
    .grp-card:active { transform: scale(.97); }

    .grp-card-bg-icon {
      position: absolute; right: -12px; bottom: -12px; opacity: .14;
      transform: rotate(-10deg);
    }
    .grp-card-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 18px 18px;
      background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.1) 100%);
    }
    .grp-card-name { font-family: var(--fd); font-size: 30px; font-weight: 900; color: white; letter-spacing: .4px; line-height: 1; }
    .grp-card-count { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px; font-weight: 500; }
    .grp-done-pill {
      position: absolute; top: 12px; right: 12px;
      background: var(--success); color: white;
      font-family: var(--fd); font-size: 12px; font-weight: 800; letter-spacing: .5px;
      padding: 4px 10px; border-radius: 20px;
    }

    .finish-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 14px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
    }
    .done-count-badge {
      font-family: var(--fd); font-size: 13px; font-weight: 800; color: #121508;
      background: var(--pink); padding: 4px 12px; border-radius: 20px; letter-spacing: .4px;
    }

    /* ══════════════════════════════════
       GROUP DETAIL (exercise list)
    ══════════════════════════════════ */
    .group-detail-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    .grp-detail-hero {
      border-radius: 16px; overflow: hidden; height: 100px; position: relative; margin-bottom: 8px;
    }
    .grp-detail-hero-inner {
      height: 100%; display: flex; align-items: center; padding: 0 20px; gap: 16px; position: relative;
    }
    .grp-detail-hero-name {
      font-family: var(--fd); font-size: 42px; font-weight: 900; color: white; letter-spacing: .5px;
    }
    .grp-detail-hero-sub { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 2px; }

    .ex-row-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      box-shadow: var(--sh1); cursor: pointer;
      display: flex; align-items: center; gap: 14px;
      border: 2px solid transparent;
      transition: border-color .15s, transform .12s;
    }
    .ex-row-card:active { transform: scale(.97); }
    .ex-row-card.done-row { border-color: var(--success); background: rgba(13,170,116,.05); }
    .ex-row-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--sfx); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ex-row-info { flex: 1; }
    .ex-row-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .ex-row-pb   { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .ex-row-check { width: 24px; height: 24px; border-radius: 50%; background: var(--success); display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: 800; flex-shrink: 0; }
    .ex-info-btn {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid var(--border); background: transparent;
      color: var(--text2); font-size: 14px; font-weight: 700; font-style: italic;
      font-family: Georgia, serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
    }
    .ex-info-btn:active { color: var(--pink); border-color: var(--pink); }

    /* ─── REST TIMER ─── */
    .rest-card {
      background: var(--card); border: 1.5px solid rgba(200,242,53,.35);
      border-radius: var(--r); padding: 14px 18px; box-shadow: var(--sh2);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: slideDown .25s ease;
    }
    .rest-card.rest-done { border-color: var(--success); }
    .rest-label {
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text2);
    }
    .rest-time {
      font-family: var(--fd); font-size: 44px; font-weight: 900; line-height: 1;
      color: var(--pink); font-variant-numeric: tabular-nums;
    }
    .rest-done .rest-time { color: var(--success); animation: dot-pop .45s ease; }
    .rest-bar {
      width: 100%; height: 6px; border-radius: 3px;
      background: var(--border); overflow: hidden;
    }
    .rest-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--pink2), var(--pink));
      transition: width 1s linear;
    }
    .rest-actions { display: flex; gap: 10px; width: 100%; }
    .rest-btn {
      flex: 1; padding: 9px; border-radius: 10px;
      border: 1.5px solid var(--border); background: transparent;
      color: var(--text); font-size: 13px; font-weight: 700;
      font-family: var(--fb); cursor: pointer; transition: all .12s;
    }
    .rest-btn:active { background: rgba(200,242,53,.12); border-color: rgba(200,242,53,.45); transform: scale(.95); }

    /* ─── EXERCISE BUILDER ─── */
    .builder-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      box-shadow: var(--sh1); display: flex; flex-direction: column; gap: 12px;
    }
    .builder-steps { display: flex; gap: 6px; }
    .builder-step { height: 5px; flex: 1; border-radius: 3px; background: var(--border); transition: background .25s; }
    .builder-step.on { background: var(--pink); }
    .builder-title { font-family: var(--fd); font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; }
    .builder-sub { font-size: 12px; color: var(--text2); margin-top: -8px; }
    .builder-stage { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .builder-stage svg { display: block; width: 100%; height: auto; }
    .builder-stage svg * { animation: figIn .35s ease; }
    @keyframes figIn { from { opacity: .25; } }
    .builder-name-preview {
      background: var(--bg); border: 1.5px dashed rgba(200,242,53,.35);
      border-radius: 12px; padding: 9px 13px;
    }
    .builder-name-preview label {
      font-size: 9px; font-weight: 800; letter-spacing: 1.8px;
      text-transform: uppercase; color: var(--text2); display: block;
    }
    .builder-name-line {
      font-family: var(--fd); font-size: 18px; font-weight: 900;
      text-transform: uppercase; line-height: 1.1; margin-top: 2px; min-height: 20px;
    }
    .builder-name-line .b-slot { color: var(--pink); }
    .builder-name-line .b-ghost { color: var(--text2); opacity: .5; }
    .builder-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .builder-chip {
      border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s; user-select: none;
    }
    .builder-chip.sel { background: var(--pink); color: #121508; border-color: var(--pink); font-weight: 800; }
    .builder-chips-label {
      width: 100%; font-size: 9px; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--text2); margin-top: 4px;
    }
    .ex-custom-tag {
      font-size: 9px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--pink); border: 1px solid rgba(200,242,53,.4); border-radius: 8px;
      padding: 1px 7px; display: inline-block; margin-top: 3px;
    }
    .log-hero-wiki {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35);
      color: white; font-size: 16px; font-weight: 700; font-style: italic;
      font-family: Georgia, serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ══════════════════════════════════
       LOG SCREEN — Tinder hero style
    ══════════════════════════════════ */
    .log-hero {
      position: relative; overflow: hidden;
      min-height: 150px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .log-hero-bg-icon {
      position: absolute; right: -20px; top: -10px; opacity: .1;
      transform: rotate(12deg);
    }
    .log-hero-content {
      position: relative; z-index: 1; padding: 22px 22px 20px;
      background: linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.05) 100%);
    }
    .log-hero-eyebrow {
      font-family: var(--fd); font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; color: rgba(255,255,255,.55); margin-bottom: 4px;
    }
    .log-hero-name {
      font-family: var(--fd); font-size: clamp(34px, 11vw, 44px); font-weight: 900;
      color: white; line-height: .95; letter-spacing: .5px; text-transform: uppercase;
    }
    .log-hero-pb {
      font-size: 13px; color: rgba(255,255,255,.65); margin-top: 7px; font-weight: 500;
    }
    .log-hero-back {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,.35); border: none; color: white;
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: background .14s;
    }
    .log-hero-back:active { background: rgba(0,0,0,.55); }
    .pr-glow { color: #ffd700; font-size: 13px; font-weight: 700; }

    .log-body {
      flex: 1; padding: 16px 18px calc(200px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: 14px;
    }

    .set-prog {
      background: var(--card); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--sh2);
      position: sticky; top: 8px; z-index: 20;
    }
    .set-dots { display: flex; align-items: flex-start; gap: 0; justify-content: center; }
    .set-dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; max-width: 64px; }
    .set-dot-connector { flex: 1; height: 2px; margin-top: 19px; background: var(--border); max-width: 28px; transition: background .3s; }
    .set-dot-connector.done-conn { background: var(--pink); }
    .set-dot {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2.5px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: var(--text2);
      transition: all .25s cubic-bezier(.2,.8,.4,1);
    }
    .set-dot.completed { background: var(--navy2); border-color: var(--navy2); color: var(--text); }
    .set-dot.just-done { animation: dot-pop .45s ease; }
    @keyframes dot-pop {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(13,170,116,.55); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(13,170,116,0); }
    }
    .spark-host { position: fixed; z-index: 999; pointer-events: none; width: 0; height: 0; }
    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      animation: spark-fly .55s cubic-bezier(.1,.8,.3,1) forwards;
    }
    @keyframes spark-fly {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
    }

    /* ─── WORKOUT-DONE CELEBRATION ─── */
    .celebrate-overlay {
      position: fixed; inset: 0; z-index: 9500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px;
      background: rgba(10,13,4,.95);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      cursor: pointer; overflow: hidden;
      animation: fadeIn .3s ease;
    }
    .celebrate-title {
      font-family: var(--fd); font-size: clamp(44px, 13vw, 64px); font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px; line-height: .95;
      color: var(--pink); text-align: center;
      animation: celeb-pop .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes celeb-pop {
      from { opacity: 0; transform: scale(.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    .celebrate-stats { display: flex; gap: 12px; }
    .celebrate-stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px 16px; text-align: center; min-width: 86px;
    }
    .celebrate-stat-v {
      font-family: var(--fd); font-size: 30px; font-weight: 900; color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .celebrate-stat-l {
      font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--text2);
    }
    .celebrate-streak {
      background: rgba(200,242,53,.10); border: 1px solid rgba(200,242,53,.45);
      color: var(--pink); border-radius: 24px; padding: 9px 24px;
      font-weight: 900; font-size: 13px; letter-spacing: 2.4px; text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .celebrate-hint { font-size: 12px; color: var(--text2); }
    .confetti-piece {
      position: absolute; top: -14px; width: 8px; height: 13px; border-radius: 2px;
      opacity: .9; pointer-events: none;
      animation: confetti-fall var(--dur, 1.8s) linear var(--delay, 0s) forwards;
    }
    @keyframes confetti-fall {
      from { transform: translateY(-6vh) rotate(0); }
      to   { transform: translateY(110vh) rotate(720deg); }
    }
    .set-dot.active { background: var(--pink); border-color: var(--pink); color: #121508; box-shadow: 0 0 0 6px rgba(200,242,53,.18); transform: scale(1.1); }
    .set-dot.warmup-skipped { background: var(--sfx); border-color: var(--border); color: var(--text2); }
    .set-dot-lbl { font-size: 9px; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

    .warmup-card {
      background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--sh2);
      display: flex; flex-direction: column; gap: 12px;
    }
    .warmup-card-title { font-family: var(--fd); font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .warmup-card-desc { color: var(--text2); font-size: 14px; line-height: 1.5; }

    .input-form { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--sh2); }
    .input-form-title { font-family: var(--fd); font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 16px; letter-spacing: .3px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .inp-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: var(--text2); margin-bottom: 7px; }
    .inp-group input {
      width: 100%; padding: 13px 10px; border-radius: var(--r-sm);
      border: 2px solid var(--border);
      font-family: var(--fd); font-size: 34px; font-weight: 800;
      color: var(--text); text-align: center; outline: none;
      background: var(--sfx); transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }
    .inp-group input::-webkit-inner-spin-button,
    .inp-group input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .inp-group input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(200,242,53,.12); }

    .prev-sets { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sh2); }
    .prev-set-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .prev-set-row:last-child { border-bottom: none; }
    .prev-set-lbl { font-size: 13px; color: var(--text2); font-weight: 500; }
    .prev-set-val { font-size: 14px; font-weight: 700; color: var(--text); }

    .pr-badge {
      display: inline-block; background: var(--pink);
      color: #121508; font-size: 9px; font-weight: 800;
      padding: 2px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: .6px; margin-left: 6px;
    }

    .done-banner {
      background: rgba(13,170,116,.08); border: 1.5px solid var(--success);
      border-radius: 12px; padding: 13px 16px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--success);
    }

    .log-action-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 12px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
      display: flex; flex-direction: column; gap: 9px;
    }
    .sets-ctrl { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 2px; }
    .sets-ctrl-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--card);
      color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .14s, transform .1s;
    }
    .sets-ctrl-btn:active { border-color: var(--pink); transform: scale(.9); background: rgba(200,242,53,.08); }
    .sets-ctrl-lbl { font-family: var(--fd); font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .4px; }

    /* ══════════════════════════════════
       SUMMARY SCREEN
    ══════════════════════════════════ */
    .sum-hero {
      background: linear-gradient(148deg, var(--navy3) 0%, var(--navy) 50%, var(--navy2) 100%);
      padding: calc(34px + env(safe-area-inset-top)) 22px 26px; color: var(--text); text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .sum-hero::before {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.18) 0%, transparent 70%);
    }
    .sum-hero-emoji { font-size: 52px; position: relative; z-index: 1; }
    .sum-title { font-family: var(--fd); font-size: 34px; font-weight: 900; margin-top: 6px; letter-spacing: .5px; position: relative; z-index: 1; }
    .sum-date  { font-size: 13px; opacity: .58; margin-top: 4px; font-weight: 500; }
    .sum-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
    .sum-stat  { background: rgba(255,255,255,.1); border-radius: 13px; padding: 13px 8px; text-align: center; border: 1px solid rgba(255,255,255,.13); }
    .sum-stat-v { font-family: var(--fd); font-size: 30px; font-weight: 900; }
    .sum-stat-l { font-size: 11px; opacity: .58; margin-top: 2px; font-weight: 500; }
    .sum-body { flex: 1; overflow-y: auto; padding: 20px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .sum-ex-card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sh2); }
    .sum-ex-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .sum-ex-icon { width: 30px; height: 30px; display: flex; align-items: center; }
    .sum-ex-name  { font-size: 15px; font-weight: 700; color: var(--text); }
    .sum-ex-group { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }
    .sum-tbl-hdr {
      display: grid; grid-template-columns: 38px 1fr 1fr;
      padding: 4px 0 8px; border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px; color: var(--text2);
    }
    .sum-set-row { display: grid; grid-template-columns: 38px 1fr 1fr; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .sum-set-row:last-child { border-bottom: none; }
    .sum-set-n { font-size: 12px; color: var(--text2); font-weight: 700; }
    .sum-set-w { font-family: var(--fd); font-size: 17px; font-weight: 800; color: var(--text); }
    .sum-set-r { font-size: 13px; color: var(--text2); font-weight: 500; }
    .sum-action-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 12px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
    }

    .trend-up   { color: var(--success); font-weight: 700; font-size: 12px; }
    .trend-down { color: #e05050;        font-weight: 700; font-size: 12px; }

    /* ══════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════ */
    /* ─── SPLASH ROOT ─── */
    .sp-root {
      position: fixed; top: 0; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      z-index: 9999;
      background: #0a0d04;
      overflow: hidden;
      transition: opacity .5s ease;
    }
    .sp-root.sp-exit { opacity: 0; pointer-events: none; }

    /* ─── PHASE 1: dark + logo ─── */
    .sp-p1 {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2;
      transition: opacity .35s ease;
    }
    .sp-p1.sp-p1-out { opacity: 0; pointer-events: none; }

    .sp-logo-glow {
      position: absolute;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.16) 0%, transparent 68%);
      animation: sp-glow-pulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes sp-glow-pulse {
      from { transform: scale(.88); opacity: .6; }
      to   { transform: scale(1.08); opacity: 1; }
    }

    .sp-logo {
      position: relative; z-index: 1;
      width: 180px; border-radius: 20px;
      animation: sp-logo-in .7s cubic-bezier(.16,1,.3,1) both;
      animation-delay: .12s;
    }
    @keyframes sp-logo-in {
      from { opacity: 0; transform: scale(.75) translateY(12px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }


    /* ─── PHASE 2: photo + quote ─── */
    .sp-p2 {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0a0d04 0%, #1a220c 55%, #0a0d04 100%);
      display: flex; flex-direction: column;
      z-index: 1;

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const dailyQuotes = [
  { ref: "Joshua 1:9", text: "Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go.", category: "Strength" },
  { ref: "Isaiah 40:31", text: "But those who hope in the Lord will renew their strength. They will soar on wings like eagles; they will run and not grow weary, they will walk and not be faint.", category: "Strength" },
  { ref: "Philippians 4:13", text: "I can do all this through him who gives me strength.", category: "Strength" },

  const quoteIndex = (new Date().getDate() - 1) % 30;
  const q = dailyQuotes[quoteIndex];

    <div className="quote-card">

/* ═══════════════════════════════════════
   FEEDBACK EFFECTS (haptic + sparks)
═══════════════════════════════════════ */
function vibe(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

function sparkBurst(x, y, count = 12) {
  const host = document.createElement('div');
  host.className = 'spark-host';
  const colors = ['#c8f235', '#0daa74', '#ffd700'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 28 + Math.random() * 34;
    p.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(ang) * dist - 12}px`);
    p.style.background = colors[i % 3];
    host.appendChild(p);
  }
  host.style.left = x + 'px';
  host.style.top = y + 'px';
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 650);
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

function fmtDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}
function fmtDateShort(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('fittrack_v1') || '[]'); } catch { return []; }
}
function saveHistory(h) { localStorage.setItem('fittrack_v1', JSON.stringify(h)); }
function loadCurrent() {
  try { const s = localStorage.getItem('fittrack_current'); return s ? JSON.parse(s) : null; } catch { return null; }
}
function saveCurrent(w) {
  if (w) localStorage.setItem('fittrack_current', JSON.stringify(w));
  else localStorage.removeItem('fittrack_current');
}
function loadTheme() { return localStorage.getItem('fittrack_theme') || 'dark'; }
function saveTheme(t) { localStorage.setItem('fittrack_theme', t); }

function loadProfile() {
  try { return JSON.parse(localStorage.getItem('fittrack_profile') || 'null'); } catch { return null; }
}
function saveProfile(p) { localStorage.setItem('fittrack_profile', JSON.stringify(p)); }

function loadCustomEx() {
  try { return JSON.parse(localStorage.getItem('fittrack_custom_ex') || '[]'); } catch { return []; }
}
function saveCustomEx(ex) { localStorage.setItem('fittrack_custom_ex', JSON.stringify(ex)); }

function getStreak(history) {
  if (!history.length) return 0;
  const dates = [...new Set(history.map(w => w.date))].sort().reverse();
  const today = todayISO();
  let streak = 0, check = today;
  for (const d of dates) {
    if (d === check) {
      streak++;
      const dt = new Date(check + 'T12:00:00'); dt.setDate(dt.getDate() - 1);
      check = dt.toISOString().split('T')[0];
    } else if (d < check) break;
  }
  return streak;
}

function get28Days() {
  const today = new Date(); const dow = today.getDay();
  const start = new Date(today); start.setDate(today.getDate() - dow - 21);
  const arr = [];
  for (let i = 0; i < 28; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    arr.push(d.toISOString().split('T')[0]);
  }
  return arr;
}

function getPersonalBest(history, exId) {
  let best = 0;
  for (const w of history) for (const e of w.exercises) if (e.id === exId) for (const s of e.sets) if (s.weight > best) best = s.weight;
  return best;
}

function getTrend(history, exId) {
  const rel = history.filter(w => w.exercises.some(e => e.id === exId));
  if (rel.length < 2) return null;
  const last2 = rel.slice(-2);
  const maxW = w => Math.max(...w.exercises.find(e => e.id === exId).sets.map(s => s.weight));
  const diff = maxW(last2[1]) - maxW(last2[0]);
  return diff > 0 ? 'up' : diff < 0 ? 'down' : 'same';
}

/* ═══════════════════════════════════════
   WORKOUT CALENDAR
═══════════════════════════════════════ */
function getCalendarMonth() {
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day: d, iso });
  }
  return { cells, monthLabel: today.toLocaleDateString('en-US', { month:'long', year:'numeric' }) };
}

function WorkoutCalendar({ history, current }) {
  const [expanded, setExpanded] = useState(null);
  const { cells, monthLabel } = useMemo(getCalendarMonth, []);
  const today = todayISO();
  const doneDates = useMemo(() => new Set(history.map(w => w.date)), [history]);
  const inProgressDate = current && current.exercises.length > 0 ? current.date : null;

  function handleDayTap(iso) {
    if (doneDates.has(iso) || iso === inProgressDate) {
      setExpanded(prev => prev === iso ? null : iso);
    }
  }

  const expandedWorkout = expanded ? history.find(w => w.date === expanded) : null;
  const expandedIsActive = expanded === inProgressDate;

  return (
    <div>
      <div style={{ marginBottom: 10 }}>
        <span className="sec-label" style={{ marginBottom: 0 }}>Activity — {monthLabel}</span>
      </div>
      <div className="cal-grid">
        {DAYS_SHORT.map(d => <div key={d} className="cal-day-lbl">{d}</div>)}
        {cells.map((cell, i) => {
          if (!cell) return <div key={`e${i}`} className="cal-day empty" />;
          const { day, iso } = cell;
          const isDone = doneDates.has(iso);
          const isActive = iso === inProgressDate;
          const isFuture = iso > today;
          const isToday = iso === today;
          const isSelected = expanded === iso;
          let cls = 'cal-day';
          if (isFuture) cls += ' future';
          else if (isActive) cls += ' in-progress';
          else if (isDone) cls += ' has-workout';
          if (isToday) cls += ' today-ring';
          if (isSelected) cls += ' selected';
          return <div key={iso} className={cls} onClick={() => handleDayTap(iso)}><span>{day}</span>{(isDone || isActive) && <span className="cal-day-dot" />}</div>;
        })}
      </div>
      {expanded && (
        <div className={`cal-expand ${expandedIsActive ? 'active-expand' : ''}`} style={{ marginTop: 10 }}>
          <div className="cal-expand-date">{fmtDate(expanded)}</div>
          {expandedIsActive && !expandedWorkout ? (
            <>
              <div className="cal-expand-ex">
                <span className="cal-expand-ex-name">Workout in progress</span>
                <span className="cal-in-progress-badge">Active</span>
              </div>
              {current.exercises.map((ex, j) => (
                <div key={j} className="cal-expand-ex">
                  <span className="cal-expand-ex-name">{ex.name}</span>
                  <span>{ex.sets.length} sets</span>
                </div>
              ))}
            </>
          ) : expandedWorkout ? (
            expandedWorkout.exercises.map((ex, j) => (
              <div key={j} className="cal-expand-ex">
                <span className="cal-expand-ex-name">{ex.name}</span>
                <span>{ex.sets.length} sets</span>
              </div>
            ))
          ) : null}
        </div>
      )}
    </div>
  );
}

function HomeScreen({ onStart, onViewHistory, onOpenSettings, history, hasActive, profile, current }) {
  const today = todayISO();
  const streak = getStreak(history);
  const workedToday = history.some(w => w.date === today);
  const recent = [...history].reverse().slice(0, 3);
  const firstName = (profile && profile.name) ? profile.name.split(' ')[0] : null;
  const initial = firstName ? firstName.charAt(0).toUpperCase() : '?';
  const heroQuote = dailyQuotes[(new Date().getDate() - 1) % 30];

  const heroTitle = hasActive ? 'Resume Workout' : workedToday ? 'Train Again?' : 'Ready to lift';
  const heroSub   = hasActive ? 'You have a workout in progress.' : workedToday ? 'You already trained today.' : 'Build your session in real time.';
  const btnLabel  = hasActive ? 'Resume →' : 'Start Workout →';

  // Build 7-day week strip centred on today
  const todayDate = new Date();
  const weekDays = [];
  for (let i = -3; i <= 3; i++) {
    const d = new Date(todayDate);
    d.setDate(todayDate.getDate() + i);
    const iso = d.toISOString().slice(0,10);
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    weekDays.push({ iso, num: d.getDate(), name: dayNames[d.getDay()], isToday: iso === today });
  }
  const doneDates = new Set(history.map(w => w.date));
  const inProgressDate = (current && current.exercises && current.exercises.length > 0) ? todayISO() : null;

  return (
    <div className="home-screen screen">

      {/* ── Compact sticky header ── */}
      <div className="home-compact-hdr">
        <div className="home-hdr-left">
          <div className="home-avatar">{initial}</div>
          <div>
            <div className="home-greeting">{firstName ? `Hey, ${firstName}` : 'Hey there'}</div>
            <div className="home-date-sub">{fmtDate(today)}</div>
          </div>
        </div>
        <button className="home-hdr-btn" onClick={onOpenSettings}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/>
          </svg>
        </button>
      </div>

      {/* ── Week date strip ── */}
      <div className="week-strip">
        {weekDays.map(({ iso, num, name, isToday }) => {
          const hasDone = doneDates.has(iso) || iso === inProgressDate;
          let cls = 'week-day';
          if (isToday) cls += ' today';
          else if (hasDone) cls += ' has-workout';
          return (
            <div key={iso} className={cls}>
              <div className="week-day-name">{name}</div>
              <div className="week-day-num">{num}</div>
            </div>
          );
        })}
      </div>

      {/* ── Stat cards ── */}
      <div className="home-stats-row">
        <div className="home-stat-card">
          <div className="home-stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M13 2 L5 14 H11 L10 22 L19 9 H12.5 Z" fill="var(--pink)"/>
            </svg>
          </div>
          <div className={`home-stat-val${streak > 0 ? ' accent' : ''}`}>{streak}</div>
          <div className="home-stat-lbl">Day Streak</div>
        </div>
        <div className="home-stat-card">
          <div className="home-stat-icon">
            <svg width="24" height="14" viewBox="0 0 38 20" fill="none">
              <rect x="1" y="2" width="9" height="16" rx="4" fill="var(--pink)"/>
              <rect x="10" y="7" width="3" height="6" rx="1" fill="var(--pink)"/>
              <rect x="13" y="8.5" width="12" height="3" rx="1.5" fill="var(--pink)"/>
              <rect x="25" y="7" width="3" height="6" rx="1" fill="var(--pink)"/>
              <rect x="28" y="2" width="9" height="16" rx="4" fill="var(--pink)"/>
            </svg>
          </div>
          <div className="home-stat-val accent">{history.length}</div>
          <div className="home-stat-lbl">Total Workouts</div>
        </div>
      </div>

      {/* ── Scrollable body ── */}
      <div className="home-body">

        {/* CTA card */}
        <div className="card" style={{ textAlign:'center', padding:'28px 20px' }}>
          <div style={{ fontFamily:'var(--fd)', fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'2px', color:'var(--text2)', marginBottom:8 }}>Today's Program</div>
          <div style={{ fontFamily:'var(--fd)', fontSize:28, fontWeight:900, color:'var(--text)', lineHeight:1.1, marginBottom:6 }}>{heroTitle}</div>
          <div style={{ fontSize:13, color:'var(--text2)', marginBottom:22, fontWeight:500 }}>{heroSub}</div>
          <button className="btn-pink" onClick={onStart} style={{ fontSize:18, letterSpacing:'.8px' }}>{btnLabel}</button>
        </div>

        {/* Bible verse */}
        <div className="quote-card">
          <div className="quote-text">"{heroQuote.text}"</div>
          <div className="quote-ref">— {heroQuote.ref}</div>
          <span className="quote-badge">{heroQuote.category}</span>
        </div>

        {/* Calendar */}
        <div className="card">
          <WorkoutCalendar history={history} current={current} />
        </div>

        {/* History preview */}
        <div className="card">
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: recent.length > 0 ? 14 : 0 }}>
            <div className="sec-label" style={{ marginBottom:0 }}>Recent Workouts</div>
            <button className="view-all-btn" onClick={onViewHistory} style={{ width:'auto', marginTop:0, padding:'5px 12px', fontSize:12 }}>

            recent.map((w, i) => (
              <div key={i} className="hist-preview-row" onClick={onViewHistory}>
                <div>
                  <div className="hist-preview-date">{fmtDate(w.date)}</div>
                  <div className="hist-preview-meta">{w.exercises.length} exercises · {w.exercises.reduce((s,e)=>s+e.sets.length,0)} sets</div>
                </div>
                <div style={{ display:'flex', gap:4, flexWrap:'wrap', justifyContent:'flex-end', maxWidth:120 }}>
                  {w.exercises.slice(0,3).map((ex,j) => (
                    <span key={j} style={{ fontSize:10, fontWeight:700, letterSpacing:.4, color:'var(--text2)', background:'var(--sfx)', padding:'2px 7px', borderRadius:20 }}>{ex.gl}</span>
                  ))}
                </div>
              </div>
            ))
          )}
        </div>

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   SPLASH SCREEN
═══════════════════════════════════════ */
function SplashScreen({ isFirstTime, onContinue }) {
  const [phase, setPhase]     = useState(1);
  const [p1Out, setP1Out]     = useState(false);
  const [p2In,  setP2In]      = useState(false);
  const [exiting, setExiting] = useState(false);

  useEffect(() => {
    const t1 = setTimeout(() => setP1Out(true), 1300);
    const t2 = setTimeout(() => { setP2In(true); setPhase(2); }, 1620);
    let t3, t4;
    if (!isFirstTime) {
      t3 = setTimeout(() => setExiting(true), 3300);
      t4 = setTimeout(onContinue, 3800);
    }
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
  }, []);

  function handleBtn() { setExiting(true); setTimeout(onContinue, 500); }

  return (
    <div className={`sp-root ${exiting ? 'sp-exit' : ''}`}>

      {/* Phase 1 — dark + logo */}
      <div className={`sp-p1 ${p1Out ? 'sp-p1-out' : ''}`}>
        <div className="sp-logo-glow" />
        <img src="./assets/Logo%20resized.png" alt="VibeLift" className="sp-logo" />
      </div>

      {/* Phase 2 — photo + quote */}
      <div className={`sp-p2 ${p2In ? 'sp-p2-in' : ''}`}>
        <div className="sp-p2-glow" />
        <div className="sp-p2-content">
          <DailyQuoteCard />
          {isFirstTime && <button className="splash-btn" onClick={handleBtn}>Get Started →</button>}
        </div>
      </div>

      {/* 2 dots */}
      <div className="sp-dots">
        <div className={`sp-dot ${phase === 1 ? 'sp-dot-active' : ''}`} />
        <div className={`sp-dot ${phase === 2 ? 'sp-dot-active' : ''}`} />
      </div>

    </div>
  );
}

            );
          } catch { return null; }
        })()}

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════

function HistoryScreen({ onBack, history, weightUnit = 'kg' }) {
  const [filter, setFilter] = React.useState('all');

  const today = todayISO();
  const weekStart = (() => {
    const d = new Date(); d.setDate(d.getDate() - d.getDay()); return d.toISOString().slice(0,10);
  })();
  const monthStart = today.slice(0,7);

  const sorted = [...history].reverse();
  const filtered = filter === 'all' ? sorted
    : filter === 'week'  ? sorted.filter(w => w.date >= weekStart)
    : sorted.filter(w => w.date.slice(0,7) === monthStart);

  const thisWeekCount = sorted.filter(w => w.date >= weekStart).length;

  return (
    <div className="screen">
      <div className="hdr">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="hdr-title">History</span>
        <div style={{ width: 38 }} />
      </div>
      <div className="hist-body">
        {/* Stat cards */}
        <div className="hist-stats-row">
          <div className="hist-stat-card">
            <div className="hist-stat-icon">🏋</div>
            <div className="hist-stat-val">{history.length}</div>
            <div className="hist-stat-lbl">Total Workouts</div>
          </div>
          <div className="hist-stat-card">
            <div className="hist-stat-icon">📅</div>
            <div className="hist-stat-val" style={{ color: 'var(--pink)' }}>{thisWeekCount}</div>
            <div className="hist-stat-lbl">This Week</div>
          </div>
        </div>

        {/* Filter pills */}
        <div className="hist-filter-row">
          {[['all','All'],['week','This Week'],['month','This Month']].map(([val, lbl]) => (
            <button key={val} className={`hist-filter-pill ${filter === val ? 'active' : ''}`} onClick={() => setFilter(val)}>{lbl}</button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div className="hist-empty">
            <div className="hist-empty-icon">📋</div>
            <div className="hist-empty-txt">No workouts yet.<br/>Start your first session to see history here.</div>
          </div>

        {filtered.map((w, i) => {
          const totalSets = w.exercises.reduce((s,e)=>s+e.sets.length,0);
          const totalVol  = w.exercises.reduce((s,e)=>e.sets.reduce((a,t)=>a+t.weight*t.reps,s),0);
          return (
            <div key={i} className="hist-workout-card">
              <div className="hist-workout-hdr">
                <div>
                  <div className="hist-workout-date">{fmtDate(w.date)}</div>
                  <div className="hist-workout-meta">{w.exercises.length} exercises · {totalSets} sets</div>
                </div>
                <div className="hist-workout-vol">{totalVol >= 1000 ? (totalVol/1000).toFixed(1)+'t' : totalVol+weightUnit}</div>
              </div>
              <div className="hist-ex-list">
                {w.exercises.map((ex, j) => {
                  const meta = GROUP_META[ex.group] || GROUP_META.chest;
                  return (
                    <div key={j} className="hist-ex-row">
                      {ex.sessionAdded
                        ? <div style={{ width:26, height:26, borderRadius:8, background:meta.color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:8, fontWeight:800, color:meta.color, textAlign:'center', lineHeight:1, flexShrink:0 }}>{ex.name.substring(0,3).toUpperCase()}</div>
                        : <ExIcon id={ex.id} size={26} color={meta.color} img={ex.img || null} />}
                      <div className="hist-ex-info">
                        <div className="hist-ex-name">{ex.name}</div>
                        <div className="hist-ex-sets">
                          {ex.sets.map((s, k) => (
                            <span key={k} className="hist-set-pill">{s.weight}{weightUnit} × {s.reps}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  'Barbell':'barbell', 'Dumbbell':'dumbbell', 'Cable':'cable', 'Machine':'machine',
  'Bodyweight':'bodyweight', 'Kettlebell':'dumbbell', 'Plate':'plate', 'Band':'bodyweight',
  'Smith Machine':'machine',
};
const BUILDER_POSES = {
  'Standing':  { head:[105,36], sh:[105,58], hip:[105,98], knee:[105,124], foot:[105,150], fwd:[1,0], up:[0,-1], bench:'' },
  'Seated':    { head:[100,44], sh:[100,64], hip:[100,106], knee:[128,106], foot:[128,150], fwd:[1,0], up:[0,-1],
                 bench:'<rect x="88" y="112" width="52" height="7" rx="3" fill="#59614a"/><rect x="94" y="119" width="6" height="31" fill="#59614a"/><rect x="126" y="119" width="6" height="31" fill="#59614a"/>' },
  'Lying Flat':{ head:[70,92], sh:[86,96], hip:[122,96], knee:[138,84], foot:[150,100], fwd:[0,-1], up:[-0.1,-1],
                 bench:'<rect x="58" y="104" width="100" height="8" rx="4" fill="#59614a"/><rect x="70" y="112" width="6" height="38" fill="#59614a"/><rect x="140" y="112" width="6" height="38" fill="#59614a"/>',
                 pressUp:true },
  'Incline':   { head:[132,76], sh:[120,86], hip:[92,116], knee:[76,128], foot:[76,150], fwd:[0.7,-0.7], up:[-0.2,-0.98],
                 bench:'<line x1="86" y1="130" x2="144" y2="76" stroke="#59614a" stroke-width="9" stroke-linecap="round"/><rect x="106" y="132" width="6" height="18" fill="#59614a"/>' },
  'Decline':   { head:[134,114], sh:[122,104], hip:[92,86], knee:[78,76], foot:[64,90], fwd:[0.7,0.7], up:[-0.2,-0.98],
                 bench:'<line x1="86" y1="80" x2="146" y2="120" stroke="#59614a" stroke-width="9" stroke-linecap="round"/><rect x="106" y="116" width="6" height="34" fill="#59614a"/>' },
  'Bent-Over': { head:[68,66], sh:[80,76], hip:[112,96], knee:[114,124], foot:[114,150], fwd:[-0.2,1], up:[-0.85,-0.5], bench:'' },
  'Kneeling':  { head:[103,56], sh:[103,76], hip:[103,114], knee:[103,144], foot:[128,146], fwd:[1,0], up:[0,-1], bench:'' },
  'Hanging':   { head:[105,58], sh:[105,76], hip:[105,112], knee:[103,134], foot:[99,148], fwd:[1,0], up:[0,-1],
                 bench:'<line x1="70" y1="30" x2="150" y2="30" stroke="#59614a" stroke-width="6" stroke-linecap="round"/>', hang:true },
};
const BUILDER_ARMS = {
  'Press':     { e:[10,12],  h:[15,36] },
  'Row':       { e:[8,-12],  h:[18,-4] },
  'Curl':      { e:[3,-16],  h:[17,-6] },
  'Raise':     { e:[15,1],   h:[29,3] },
  'Extension': { e:[7,16],   h:[19,28] },
  'Squat':     { e:[4,-14],  h:[7,-23] },
  'Lunge':     { e:[4,-14],  h:[7,-23] },
  'Fly':       { e:[16,0],   h:[27,13] },
  'Pull':      { e:[7,14],   h:[9,30] },
  'Hold':      { e:[2,-13],  h:[4,-23] },
  '_idle':     { e:[3,-13],  h:[5,-23] },
};
function builderFigureSVG(eq, pos, move) {
  const FIG = '#f0f5d8', EQC = '#c8f235', BEN = '#59614a';
  const pose = BUILDER_POSES[pos || 'Standing'];
  let arm = BUILDER_ARMS[move || '_idle'];
  if (pose.hang) arm = BUILDER_ARMS['Pull'];
  if (pose.pressUp && move === 'Press') arm = { e:[2,14], h:[2,30] };
  const Pt = (base, off) => [base[0]+pose.fwd[0]*off[0]+pose.up[0]*off[1], base[1]+pose.fwd[1]*off[0]+pose.up[1]*off[1]];
  const Ln = (a,b,w,c,o) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||FIG}" stroke-width="${w||5}" stroke-linecap="round"${o?` opacity="${o}"`:''}/>`;
  const Ci = (p,r,c,o) => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c||FIG}"${o?` opacity="${o}"`:''}/>`;
  const sh = pose.sh;
  let elbow = Pt(sh, arm.e), hand = Pt(sh, arm.h);
  if (pose.hang) { elbow = [sh[0]+6, 52]; hand = [sh[0]+8, 32]; }
  let s = `<line x1="20" y1="150" x2="200" y2="150" stroke="rgba(127,127,127,.25)" stroke-width="2"/>` + pose.bench;
  if (eq === 'Cable') { const py = hand[1] < sh[1] ? 32 : 144; s += `<rect x="186" y="24" width="8" height="126" rx="3" fill="${BEN}"/>` + Ci([190,py],4,EQC) + Ln(hand,[190,py],2.5,EQC); }
  if (eq === 'Machine') { s += `<rect x="48" y="26" width="7" height="124" rx="3" fill="${BEN}"/><rect x="48" y="26" width="60" height="7" rx="3" fill="${BEN}"/>` + Ln([104,32],hand,3,BEN); }
  if (eq === 'Smith Machine') { s += `<rect x="60" y="22" width="5" height="128" fill="${BEN}"/><rect x="158" y="22" width="5" height="128" fill="${BEN}"/>` + Ln([62,hand[1]],[161,hand[1]],4,EQC) + Ci([70,hand[1]],7,EQC) + Ci([152,hand[1]],7,EQC); }
  const e2 = [elbow[0]-7, elbow[1]+3], h2 = [hand[0]-7, hand[1]+3];
  s += Ln(sh,e2,5,FIG,.3) + Ln(e2,h2,5,FIG,.3) + Ci(h2,3,FIG,.3);
  s += Ln(pose.sh,pose.hip,7) + Ln(pose.hip,pose.knee,5.5) + Ln(pose.knee,pose.foot,5.5) + Ci(pose.foot,3.5) + Ln(pose.sh,pose.head,4) + Ci(pose.head,8);
  s += Ln(sh,elbow,5) + Ln(elbow,hand,5) + Ci(hand,3.5);
  if (eq === 'Barbell') {
    if (move === 'Squat' || move === 'Lunge') s += Ci([sh[0],sh[1]-4],8,EQC,.9) + Ln([sh[0]-16,sh[1]-4],[sh[0]+16,sh[1]-4],4,EQC);
    else s += Ci(hand,9,EQC,.92) + Ci(hand,5,'#121508') + Ci(hand,3,EQC);
  }
  if (eq === 'Dumbbell') s += Ln([hand[0]-7,hand[1]],[hand[0]+7,hand[1]],4,EQC) + Ci([hand[0]-7,hand[1]],5,EQC) + Ci([hand[0]+7,hand[1]],5,EQC);
  if (eq === 'Kettlebell') s += Ci([hand[0],hand[1]+9],7,EQC) + `<path d="M ${hand[0]-5} ${hand[1]+4} Q ${hand[0]} ${hand[1]-4} ${hand[0]+5} ${hand[1]+4}" stroke="${EQC}" stroke-width="3" fill="none"/>`;
  if (eq === 'Plate') s += Ci(hand,10,EQC,.92) + Ci(hand,4,'#121508');
  if (eq === 'Band') { const a = [pose.foot[0],148]; s += `<path d="M ${hand[0]} ${hand[1]} Q ${(hand[0]+a[0])/2+9} ${(hand[1]+a[1])/2} ${a[0]} ${a[1]}" stroke="${EQC}" stroke-width="3" fill="none" stroke-dasharray="5 4"/>`; }
  return s;
}

function ExerciseBuilder({ group, gl, onSave, onCancel }) {
  const [step, setStep] = useState(1);
  const [eq, setEq]     = useState(null);
  const [pos, setPos]   = useState(null);
  const [move, setMove] = useState(null);
  const [grip, setGrip] = useState(null);
  const [name, setName] = useState('');
  const STEPS = {
    1: { title:'Equipment', sub:'What are you lifting with?', chips:['Barbell','Dumbbell','Cable','Machine','Bodyweight','Kettlebell','Plate','Band','Smith Machine'], val:eq, set:setEq, btn:'Next: Position' },
    2: { title:'Position', sub:'How is your body set up?', chips:['Standing','Seated','Lying Flat','Incline','Decline','Bent-Over','Kneeling','Hanging'], val:pos, set:setPos, btn:'Next: Movement' },
    3: { title:'Movement', sub:'What does the movement look like?', chips:['Press','Row','Curl','Raise','Extension','Squat','Lunge','Fly','Pull','Hold'], val:move, set:setMove, btn:'Next: Name' },
    4: { title:'Name & Save', sub:'Auto-named. Edit it if you like.', btn:'Save to ' + gl },
  };
  const s = STEPS[step];
  const autoName = [pos, eq, grip, move].filter(Boolean).join(' ');
  function next() {
    if (step < 4) {
      if (step === 3) setName(autoName);
      setStep(step + 1);
      return;
    }
    const finalName = (name || autoName || '').trim();
    if (!finalName) return;
    onSave({
      id: 'custom_' + Date.now(),
      name: finalName, group, gl,
      eq: BUILDER_EQ_MAP[eq] || 'dumbbell',
      custom: true,
      builder: { eq, pos, move, grip },
    });
  }
  const chipRow = (chips, val, set) => chips.map(c => (
    <div key={c} className={`builder-chip ${val === c ? 'sel' : ''}`} onClick={() => set(val === c ? null : c)}>{c}</div>
  ));
  return (
    <div className="builder-card">
      <div className="builder-steps">{[1,2,3,4].map(i => <div key={i} className={`builder-step ${i <= step ? 'on' : ''}`} />)}</div>
      <div>
        <div className="builder-title">{s.title}</div>
        <div className="builder-sub">{s.sub}</div>
      </div>
      <div className="builder-stage">
        <svg viewBox="0 0 220 170" dangerouslySetInnerHTML={{ __html: builderFigureSVG(eq, pos, move) }} />
      </div>
      <div className="builder-name-preview">
        <label>Your exercise · {gl}</label>
        <div className="builder-name-line">
          {step === 4
            ? <span className="b-slot">{name || autoName || '—'}</span>
            : autoName
              ? <span className="b-slot">{autoName}</span>
              : <span className="b-ghost">Tap chips to build the name…</span>}
        </div>
      </div>
      {step < 4 ? (
        <div className="builder-chips">
          {chipRow(s.chips, s.val, s.set)}
          {step === 3 && <>
            <div className="builder-chips-label">Grip (optional)</div>
            {chipRow(['Overhand','Underhand','Neutral','Wide Grip','Close Grip'], grip, setGrip)}
          </>}
        </div>
      ) : (
        <div>
          <div className="setup-label">Name — edit if you want (e.g. "Power Clean")</div>
          <input className="setup-input" type="text" value={name} placeholder={autoName || 'e.g. Power Clean'} onChange={e => setName(e.target.value)} />
        </div>
      )}
      <button className="btn-pink" onClick={next} disabled={step < 4 ? !s.val : !(name || autoName).trim()}>{s.btn}</button>
      {step < 4 && <button className="btn-outline" onClick={() => setStep(step + 1)}>Skip this step →</button>}
      {step > 1 && <button className="btn-outline" onClick={() => setStep(step - 1)}>← Back</button>}
      <button className="btn-outline" onClick={onCancel}>Cancel</button>
    </div>
  );
}
