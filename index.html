/* Renders children into <body> so `position: fixed` is measured against the
   viewport. Screens animate with a transform, and a transformed ancestor makes
   fixed children stick to the screen box instead of the window — which pushed
   the action bar and rest pill to the very bottom of a long page. */
function FixedLayer({ children }) {
  return ReactDOM.createPortal(children, document.body);
}

const REST_POS_KEY = 'vibelift_rest_pos';

function LogScreen({ exercise, savedEntry, onBack, onComplete, onSetLogged, history, weightUnit = 'kg', restSecs = 90, sessionWarmup = 'pending', onSessionWarmup }) {
  const [totalSets, setTotalSets] = useState(3);
  // Inherit the session's warm-up state: once you've warmed up, every later
  // exercise in that workout starts straight at set 1.
  const [warmup, setWarmup] = useState(sessionWarmup); // 'pending' | 'done' | 'skipped'

  function resolveWarmup(v) {
    setWarmup(v);
    if (onSessionWarmup) onSessionWarmup(v);
  }
  const [currentSet, setCurrentSet] = useState(1);
  const [doneSets, setDoneSets] = useState([]);
  const [weight, setWeight] = useState('');
  const [reps, setReps] = useState('');
  const [allDone, setAllDone] = useState(false);
  const [weightType, setWeightType] = useState(null); // null | 'free' | 'barbell'
  const [showWiki, setShowWiki] = useState(false);
  const [platesPerSide, setPlatesPerSide] = useState([]);
  const [addBothSides, setAddBothSides] = useState(true);
  const [barType, setBarType] = useState('straight'); // 'straight' | 'ez'

  const unit = weightUnit || 'kg';
  const plateData = unit === 'lb' ? PLATE_DATA_LB : PLATE_DATA_KG;
  const barWeight = barType === 'ez' ? (unit === 'lb' ? 22 : 10) : (unit === 'lb' ? 44 : 20);
  const totalBarbellWeight = barWeight + platesPerSide.reduce((a,b)=>a+b,0) * (addBothSides ? 2 : 1);

  // Every set from the most recent session that included this exercise.
  const lastSets = useMemo(() => {
    for (let i = history.length - 1; i >= 0; i--) {
      const ex = history[i].exercises.find(e => e.id === exercise.id);
      if (ex && ex.sets && ex.sets.length > 0) return ex.sets;
    }
    return null;
  }, [history, exercise.id]);

  const pb    = useMemo(() => getPersonalBest(history, exercise.id), [history, exercise.id]);
  const trend = useMemo(() => getTrend(history, exercise.id), [history, exercise.id]);
  const meta  = GROUP_META[exercise.group] || GROUP_META.chest;

  useEffect(() => {
    if (lastSets && lastSets[0]) {
      if (!lastSets[0].bw) setWeight(String(kgToDisp(lastSets[0].weight, unit)));
      setReps(String(lastSets[0].reps));
    }
    if (exercise.name && exercise.name.toLowerCase().includes('ez bar')) setBarType('ez');
    // Auto-select mode so the chooser never interrupts — user can still switch via bottom toggle
    if (exercise.eq) {
      const auto = exercise.eq === 'barbell' ? 'barbell' : exercise.eq === 'bodyweight' ? 'bodyweight' : 'free';
      setWeightType(auto);
    }
  }, []);

  // Resume an in-progress (or previously logged) exercise so the user picks up where they left off
  useEffect(() => {
    if (savedEntry && savedEntry.sets && savedEntry.sets.length > 0) {
      const planned = savedEntry.totalSets || Math.max(savedEntry.sets.length, 3);
      setDoneSets(savedEntry.sets);
      setCurrentSet(savedEntry.sets.length + 1);
      setTotalSets(planned);
      setWarmup(savedEntry.warmup || 'done');
      setWeightType(savedEntry.weightType || null);
      const last = savedEntry.sets[savedEntry.sets.length - 1];
      if (last && !last.bw) setWeight(String(kgToDisp(last.weight, unit)));
      if (last) setReps(String(last.reps));
      if (savedEntry.sets.length >= planned) setAllDone(true);
    }
  }, []);

  const maxLogged   = doneSets.length ? Math.max(...doneSets.map(s => s.weight)) : 0;
  const isNewPR     = maxLogged > pb && pb > 0;
  const inWarmup    = warmup === 'pending';
  const suggestFree = ['dumbbell','cable','machine','plate'].includes(exercise.eq);
  const suggestBar  = exercise.eq === 'barbell';
  const suggestBW   = exercise.eq === 'bodyweight';

  // Which kind of lift this is. It auto-detects from the exercise and changes
  // maybe twice a year, so it belongs beside the input it controls — not as
  // three permanent sub-44px targets in the thumb zone.
  function ModeSwitch() {
    const opts = [['free', 'Free Weight'], ['barbell', 'Barbell'], ['bodyweight', 'Bodyweight']];
    return (
      <div className="mode-switch">
        {opts.map(([val, label]) => (
          <button key={val} className={`mode-chip ${weightType === val ? 'on' : ''}`}
            onClick={() => {
              setWeightType(val);
              if (val !== 'barbell') setPlatesPerSide([]);
              if (val !== 'free') setWeight('');
            }}>
            {label}
          </button>
        ))}
      </div>
    );
  }

  // What this exact set looked like last session — the number he is chasing.
  function LastTime({ setNum }) {
    const prev = lastSets && lastSets[setNum - 1];
    if (!prev) return null;
    const better = !prev.bw && maxLogged > 0 && maxLogged > prev.weight;
    return (
      <div className="last-time">
        <span className="last-time-lbl">Last time</span>
        <span className="last-time-val">
          {prev.bw ? 'BW' : `${kgToDisp(prev.weight, unit)} ${unit}`} × {prev.reps}
        </span>
        {better && <span className="last-time-up">up on last week</span>}
      </div>
    );
  }

  const [justDone, setJustDone] = useState(null);
  const [stamp, setStamp] = useState(null);       // big "SET N ✓" flash on log
  const stampTimer = React.useRef(null);

  // Hero photo loads over the network the first time — shimmer until it's in
  const heroUrl = meta.img ? `./assets/${meta.img}` : null;
  const [heroReady, setHeroReady] = useState(!heroUrl);
  useEffect(() => {
    if (!heroUrl) { setHeroReady(true); return; }
    setHeroReady(false);
    const im = new Image();
    im.onload = im.onerror = () => setHeroReady(true);
    im.src = heroUrl;
  }, [heroUrl]);
  // Rest timer: {endAt (epoch ms), total (s), left (s)} — left is derived from
  // endAt on every tick, so locking the phone or switching apps can't drift it.
  const [rest, setRest] = useState(null);
  const restNotified = React.useRef(false);

  // Ask the service worker to drop / schedule the "rest over" notification.
  function swRest(msg) {
    try {
      const sw = navigator.serviceWorker;
      if (sw && sw.controller) sw.controller.postMessage(msg);
    } catch {}
  }

  const restAlarmId = React.useRef(null);

  function stopRestAlarm() {
    swRest({ type: 'cancel-rest-alert' });
    if (restAlarmId.current) {
      restAlarmId.current = null;
      pushApi({ action: 'cancel' });
    }
  }

  function startRestAlarm(seconds) {
    // Called from the Complete Set tap, so this counts as a user gesture —
    // the only moment the browser lets us unlock audio and ask for the
    // notification permission the server push needs.
    primeRestAudio();
    swRest({ type: 'rest-alert', delay: seconds * 1000, body: exercise.name + ' · next set' });
    const id = 'a_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    restAlarmId.current = id;
    const fireAt = Date.now() + seconds * 1000;
    ensurePushSubscription().then(ok => {
      // A +30s or an early finish may have replaced this alarm while the
      // (first-time) subscribe round-trip ran — then this one must not fire.
      if (ok && restAlarmId.current === id) {
        pushApi({ action: 'schedule', alarm_id: id, fire_at: fireAt, body: exercise.name + ' · next set' });
      }
    });
  }

  useEffect(() => stopRestAlarm, []);

  useEffect(() => {
    if (!rest || rest.left <= 0) return;
    const tick = () => {
      setRest(r => {
        if (!r) return null;
        const left = Math.max(0, Math.round((r.endAt - Date.now()) / 1000));
        if (left <= 0 && r.left > 0) {
          vibe([120, 60, 120, 60, 200]);
          restBeep();
          // Backup for the service worker notification (same tag, so at most
          // one ever shows). Only when the app is not on screen.
          if (!restNotified.current && document.hidden && 'Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
            restNotified.current = true;
            navigator.serviceWorker.getRegistration().then(reg => {
              if (reg) reg.showNotification('Rest over — GO', { body: exercise.name + ' · next set', icon: './assets/icons/icon-192.png', vibrate: [60, 60, 60], tag: 'vibelift-rest' });
            }).catch(() => {});
          }
          return { ...r, left: 0 };
        }
        return left === r.left ? r : { ...r, left };
      });
    };
    const iv = setInterval(tick, 500);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', tick); };
  }, [rest && rest.endAt]);

  // "GO" is worth seeing for a moment. Coming back to the app minutes later and
  // still being told GO is just stale — clear it and let the set stand on its own.
  useEffect(() => {
    if (rest && rest.left === 0) {
      const overFor = Date.now() - rest.endAt;
      const t = setTimeout(() => setRest(null), overFor > 15000 ? 0 : 2500);
      return () => clearTimeout(t);
    }
  }, [rest]);

  /* ── Action bar height → bottom padding, so nothing hides behind the bar ── */
  const barRef = React.useRef(null);
  const [barH, setBarH] = useState(220);
  useEffect(() => {
    const measure = () => { if (barRef.current) setBarH(barRef.current.offsetHeight); };
    measure();
    if (typeof ResizeObserver !== 'undefined' && barRef.current) {
      const ro = new ResizeObserver(measure);
      ro.observe(barRef.current);
      window.addEventListener('resize', measure);
      return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
    }
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  /* ── Draggable rest pill — drop it anywhere, it stays there ── */
  const [restPos, setRestPos] = useState(() => {
    try {
      const p = JSON.parse(localStorage.getItem(REST_POS_KEY));
      if (p && typeof p.x === 'number' && typeof p.y === 'number') return p;
    } catch {}
    return null;
  });
  const [dragging, setDragging] = useState(false);
  const dragRef = React.useRef(null);
  const pillRef = React.useRef(null);

  // Keep a saved position on-screen after rotation / keyboard / smaller viewport
  useEffect(() => {
    if (!restPos || !pillRef.current) return;
    const r = pillRef.current.getBoundingClientRect();
    const x = Math.min(Math.max(6, restPos.x), Math.max(6, window.innerWidth - r.width - 6));
    const y = Math.min(Math.max(6, restPos.y), Math.max(6, window.innerHeight - r.height - 6));
    if (x !== restPos.x || y !== restPos.y) setRestPos({ x, y });
  }, [restPos, !!rest]);

  useEffect(() => {
    if (restPos) { try { localStorage.setItem(REST_POS_KEY, JSON.stringify(restPos)); } catch {} }
  }, [restPos]);

  function pillDown(e) {
    if (e.target.closest && e.target.closest('button')) return; // let +30s / ✕ work
    const el = pillRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    dragRef.current = { dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
    setDragging(true);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  }
  function pillMove(e) {
    const d = dragRef.current;
    if (!d) return;
    e.preventDefault();
    setRestPos({
      x: Math.min(Math.max(6, e.clientX - d.dx), Math.max(6, window.innerWidth - d.w - 6)),
      y: Math.min(Math.max(6, e.clientY - d.dy), Math.max(6, window.innerHeight - d.h - 6)),
    });
  }
  function pillUp(e) {
    if (!dragRef.current) return;
    dragRef.current = null;
    setDragging(false);
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
  }

  const logging = React.useRef(false);

  function completeSet(e) {
    if (logging.current) return;      // sweaty double-tap logged the set twice
    logging.current = true;
    setTimeout(() => { logging.current = false; }, 450);
    let s;
    if (weightType === 'bodyweight') {
      if (!reps || parseInt(reps) < 1) return;
      s = { setNum: currentSet, weight: 0, reps: parseInt(reps), bw: true };
    } else if (weightType === 'barbell') {
      if (!reps) return;
      s = { setNum: currentSet, weight: dispToKg(totalBarbellWeight, unit), reps: parseInt(reps) };
    } else {
      if (!weight || !reps) return;
      s = { setNum: currentSet, weight: dispToKg(parseFloat(weight), unit), reps: parseInt(reps) };
    }
    if (e && e.currentTarget) {
      const r = e.currentTarget.getBoundingClientRect();
      const x = e.clientX || (r.left + r.width / 2);
      const y = e.clientY || (r.top + r.height / 2);
      sparkBurst(x, y);
    }
    vibe(currentSet >= totalSets ? [30, 40, 30] : 30);
    stopRestAlarm();
    setJustDone(currentSet);
    setTimeout(() => setJustDone(null), 500);
    setStamp(currentSet >= totalSets ? 'All sets done ✓' : `Set ${currentSet} ✓`);
    clearTimeout(stampTimer.current);
    stampTimer.current = setTimeout(() => setStamp(null), 800);
    const next = [...doneSets, s];
    setDoneSets(next);
    if (currentSet >= totalSets) setAllDone(true);
    else {
      const nextSet = currentSet + 1;
      setCurrentSet(nextSet);
      const prev = lastSets && lastSets[nextSet - 1];
      if (prev) {
        if (!prev.bw && weightType !== 'barbell') setWeight(String(kgToDisp(prev.weight, unit)));
        setReps(String(prev.reps));
      }
      if (restSecs !== 'off') {
        restNotified.current = false;
        // startRestAlarm asks for notification permission itself — the tap
        // that logged the set is the user gesture the prompt needs.
        setRest({ endAt: Date.now() + restSecs * 1000, total: restSecs, left: restSecs });
        startRestAlarm(restSecs);
      }
    }
    onSetLogged({ ...exercise, sets: next, totalSets, weightType, warmup });
  }

  // Mistyped a weight? Pull the set back out. Renumbers what follows so the
  // progress rail and the next set stay honest.
  function undoSet(index) {
    const removed = doneSets[index];
    const next = doneSets.filter((_, i) => i !== index).map((x, i) => ({ ...x, setNum: i + 1 }));
    setDoneSets(next);
    setCurrentSet(next.length + 1);
    setAllDone(false);
    stopRestAlarm();
    setRest(null);
    if (removed) {
      if (!removed.bw && weightType !== 'barbell') setWeight(String(kgToDisp(removed.weight, unit)));
      setReps(String(removed.reps));
    }
    vibe(20);
    onSetLogged({ ...exercise, sets: next, totalSets, weightType, warmup });
  }

  function finish() { onComplete({ ...exercise, sets: doneSets, totalSets: Math.max(totalSets, doneSets.length), weightType, warmup }); }
  function handleBack() { onBack(); }

  // Feeling strong? Tack on another set after the planned ones are done.
  function addAnotherSet() {
    const n = doneSets.length + 1;
    setTotalSets(Math.max(totalSets + 1, n));
    setCurrentSet(n);
    setAllDone(false);
    setRest(null);
    vibe(25);
  }

  return (
    <div className="screen">
      {stamp && <div className="set-stamp" key={stamp + currentSet}>{stamp}</div>}
      <div className={`log-hero ${heroUrl && !heroReady ? 'hero-loading' : ''}`} style={meta.img && heroReady
        ? { backgroundImage: `url('./assets/${meta.img}')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundColor: '#111' }
        : meta.img ? { backgroundColor: '#111' } : { background: meta.grad }}>
        {meta.img && <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.42)', zIndex:0 }} />}
        <button className="log-hero-back" onClick={handleBack}>←</button>
        {wikiInfo(exercise) && (
          <button className="log-hero-wiki" aria-label={`How to do ${exercise.name}`}
            onClick={() => setShowWiki(true)}>i</button>
        )}
        {!exercise.img && (
          <div className="log-hero-bg-icon">
            <ExIcon id={exercise.id} size={160} color="white" builder={exercise.builder || null} />
          </div>
        )}
        <div className="log-hero-content">
          <div className="log-hero-eyebrow">{exercise.gl}</div>
          <div className="log-hero-name">{exercise.name}</div>
          <div className="log-hero-pb">
            {pb > 0 ? <>Personal best: <strong>{kgToDisp(pb, unit)} {unit}</strong>{trend === 'up' && ' ↑'}{trend === 'down' && ' ↓'}</> : 'First time logging this'}
            {isNewPR && <span className="pr-glow">New PR</span>}
          </div>
        </div>
      </div>

      <div className="log-body" style={{ paddingBottom: barH + 26 }}>
        {/* Set progress dots — Warmup dot + working set dots */}
        <div className="set-prog">
          <div className="sec-label">Set Progress</div>
          <div className="set-dots">
            <div className="set-dot-wrap">
              <div className={`set-dot ${warmup === 'done' ? 'completed' : ''} ${inWarmup ? 'active' : ''} ${warmup === 'skipped' ? 'warmup-skipped' : ''}`}>
                {warmup === 'done' ? '✓' : warmup === 'skipped' ? '—' : 'W'}
              </div>
              <div className="set-dot-lbl">Warm Up</div>
            </div>
            <div className={`set-dot-connector ${warmup !== 'pending' ? 'done-conn' : ''}`} />
            {Array.from({ length: totalSets }, (_, i) => {
              const n = i + 1;
              const completed = doneSets.some(s => s.setNum === n);
              const active    = !inWarmup && !allDone && n === currentSet;
              return (
                <React.Fragment key={n}>
                  <div className="set-dot-wrap">
                    <div className={`set-dot ${completed ? 'completed' : ''} ${active ? 'active' : ''} ${justDone === n ? 'just-done' : ''}`}>
                      {completed ? '✓' : n}
                    </div>
                    <div className="set-dot-lbl">Set {n}</div>
                  </div>
                  {i < totalSets - 1 && <div className={`set-dot-connector ${completed ? 'done-conn' : ''}`} />}
                </React.Fragment>
              );
            })}
          </div>
        </div>

        {showWiki && <WikiSheet exercise={exercise} onClose={() => setShowWiki(false)} />}

        {/* Rest timer — floating, always on screen, drag it wherever you like */}
        {rest && !allDone && (
          <FixedLayer>
            <div
              ref={pillRef}
              className={`rest-float rest-placed ${rest.left === 0 ? 'rest-done' : ''} ${dragging ? 'rest-dragging' : ''}`}
              style={restPos
                ? { left: restPos.x, top: restPos.y }
                : { left: '50%', bottom: barH + 14, transform: 'translateX(-50%)' }}
              onPointerDown={pillDown}
              onPointerMove={pillMove}
              onPointerUp={pillUp}
              onPointerCancel={pillUp}
            >
              <span className="rest-grip" aria-hidden="true"><span /></span>
              <span className="rest-float-label">{rest.left === 0 ? 'GO' : 'Rest'}</span>
              {rest.left > 0 && <span className="rest-float-time">{Math.floor(rest.left / 60)}:{String(rest.left % 60).padStart(2, '0')}</span>}
              {rest.left > 0 && (
                <>
                  <button className="rest-btn" onClick={() => {
                    if (rest.left <= 30) { stopRestAlarm(); setRest(null); return; }
                    setRest(r => { if (!r) return r; const left = r.left - 30; startRestAlarm(left); return { ...r, endAt: r.endAt - 30000, total: Math.max(r.total - 30, left), left }; });
                  }}>−30s</button>
                  <button className="rest-btn" onClick={() => setRest(r => { if (!r) return r; const left = r.left + 30; startRestAlarm(left); return { ...r, endAt: r.endAt + 30000, total: r.total + 30, left }; })}>+30s</button>
                  <button className="rest-btn" onClick={() => { stopRestAlarm(); setRest(null); }} aria-label="Dismiss rest timer">✕</button>
                </>
              )}
            </div>
          </FixedLayer>
        )}

        {/* Warmup phase UI */}
        {inWarmup && (
          <div className="warmup-card">
            <div className="warmup-card-title">Warm-Up Set</div>
            <div className="warmup-card-desc">Do a light set to get the muscle primed before going heavy. No weight or reps logged. Asked once per workout, not per exercise.</div>
            <button className="btn-pink" onClick={() => resolveWarmup('done')}>✓ Warm-Up Done</button>
            <button className="btn-outline" onClick={() => resolveWarmup('skipped')}>Skip Warm-Up</button>
          </div>
        )}

        {/* Weight type chooser — appears after warmup if not yet chosen */}
        {!inWarmup && !allDone && weightType === null && (
          <div className="input-form">
            <div className="input-form-title">How are you lifting?</div>
            <div className="weight-type-choice">
              <button className={`wt-choice-btn${suggestFree?' suggested':''}`} onClick={() => setWeightType('free')}>
                <svg width="34" height="18" viewBox="0 0 38 20" fill="none">
                  <rect x="1" y="2" width="9" height="16" rx="4" fill="var(--text)" opacity=".65"/>
                  <rect x="10" y="7" width="3" height="6" rx="1" fill="var(--text)" opacity=".65"/>
                  <rect x="13" y="8.5" width="12" height="3" rx="1.5" fill="var(--text)" opacity=".65"/>
                  <rect x="25" y="7" width="3" height="6" rx="1" fill="var(--text)" opacity=".65"/>
                  <rect x="28" y="2" width="9" height="16" rx="4" fill="var(--text)" opacity=".65"/>
                </svg>
                <span>Free Weight</span>
                <span style={{ fontSize:12, color:'var(--text)', fontFamily:'var(--fb)', fontWeight:600, textAlign:'center', lineHeight:1.35 }}>
                  {exercise.eq==='cable' ? 'Cable Machine' :
                   exercise.eq==='dumbbell' ? 'Dumbbells' :
                   exercise.eq==='machine' ? 'Machine' :
                   exercise.eq==='plate' ? 'Plates' :
                   <>Cables · DB<br/>Machines</>}
                </span>
              </button>
              <button className={`wt-choice-btn${suggestBar?' suggested':''}`} onClick={() => setWeightType('barbell')}>
                <svg width="34" height="18" viewBox="0 0 38 20" fill="none">
                  <rect x="0" y="7" width="5" height="6" rx="2" fill="var(--text)" opacity=".65"/>
                  <rect x="5" y="4" width="5" height="12" rx="2" fill="var(--text)" opacity=".65"/>
                  <rect x="10" y="8" width="18" height="4" rx="1.5" fill="var(--text)" opacity=".65"/>
                  <rect x="28" y="4" width="5" height="12" rx="2" fill="var(--text)" opacity=".65"/>
                  <rect x="33" y="7" width="5" height="6" rx="2" fill="var(--text)" opacity=".65"/>
                </svg>
                <span>Barbell</span>
                <span style={{ fontSize:12, color:'var(--text)', fontFamily:'var(--fb)', fontWeight:600, textAlign:'center', lineHeight:1.35 }}>Plates<br/>{barWeight}{unit} bar</span>
              </button>
              <button className={`wt-choice-btn${suggestBW?' suggested':''}`} onClick={() => setWeightType('bodyweight')}>
                <svg width="20" height="32" viewBox="0 0 20 32" fill="none">
                  <circle cx="10" cy="4" r="3.5" fill="var(--text)" opacity=".65"/>
                  <path d="M5 10 Q10 8 15 10 L16 20 H13 L10 26 L7 20 H4 Z" fill="var(--text)" opacity=".65"/>
                  <path d="M4 20 L2 28" stroke="var(--text)" strokeWidth="2.2" strokeLinecap="round" opacity=".65"/>
                  <path d="M16 20 L18 28" stroke="var(--text)" strokeWidth="2.2" strokeLinecap="round" opacity=".65"/>
                </svg>
                <span>Bodyweight</span>
                <span style={{ fontSize:12, color:'var(--text)', fontFamily:'var(--fb)', fontWeight:600, textAlign:'center', lineHeight:1.35 }}>Reps only</span>
              </button>
            </div>
          </div>
        )}

        {/* Free weight input */}
        {!inWarmup && !allDone && weightType === 'free' && (
          <div className="input-form">
            <div className="input-form-title">Set {currentSet} of {totalSets}</div>
            <LastTime setNum={currentSet} />
            <div className="input-row">
              <div className="inp-group">
                <label>Weight ({unit})</label>
                <input type="number" inputMode="decimal" pattern="[0-9.]*" value={weight} placeholder="0" min="0" step="0.5" onChange={e => setWeight(e.target.value)} />
              </div>
              <div className="inp-group">
                <label>Reps</label>
                <input type="number" inputMode="numeric" pattern="[0-9]*" value={reps} placeholder="0" min="0" step="1" onChange={e => setReps(e.target.value)} />
              </div>
            </div>
            <ModeSwitch />
          </div>
        )}

        {/* Barbell plate picker */}
        {!inWarmup && !allDone && weightType === 'barbell' && (
          <div className="input-form" style={{ display:'flex', flexDirection:'column', gap:18 }}>

            {/* Header label */}
            <div style={{ fontSize:11, fontWeight:800, letterSpacing:2, textTransform:'uppercase', color:'var(--text2)' }}>Set {currentSet} of {totalSets}</div>
            <LastTime setNum={currentSet} />

            {/* Total weight display — iOS style */}
            <div style={{ textAlign:'center', padding:'8px 0 4px' }}>
              {addBothSides ? (
                <>
                  <div style={{ display:'inline-flex', alignItems:'flex-start', justifyContent:'center' }}>
                    <span style={{ fontFamily:'var(--fd)', fontSize:88, fontWeight:900, color:'var(--text)', lineHeight:1, letterSpacing:'-3px' }}>{totalBarbellWeight}</span>
                    <span style={{ fontFamily:'var(--fb)', fontSize:21, fontWeight:800, color:'var(--text)', opacity:.7, marginTop:14, marginLeft:8, letterSpacing:'0' }}>{unit}</span>
                  </div>
                  <div style={{ fontSize:12, color:'var(--text2)', fontWeight:600, letterSpacing:'.4px', marginTop:2 }}>
                    {barWeight}{unit} bar + {platesPerSide.reduce((a,b)=>a+b,0)}{unit}/side × 2
                  </div>
                </>
              ) : (
                <>
                  <div style={{ display:'inline-flex', alignItems:'flex-start', justifyContent:'center' }}>
                    <span style={{ fontFamily:'var(--fd)', fontSize:88, fontWeight:900, color:'var(--text)', lineHeight:1, letterSpacing:'-3px' }}>{platesPerSide.reduce((a,b)=>a+b,0)}</span>
                    <span style={{ fontFamily:'var(--fb)', fontSize:17, fontWeight:800, color:'var(--text)', opacity:.7, marginTop:18, marginLeft:8, letterSpacing:'0' }}>{unit}/side</span>
                  </div>
                  <div style={{ fontSize:12, color:'var(--text2)', fontWeight:600, letterSpacing:'.4px', marginTop:2 }}>
                    {totalBarbellWeight} {unit} total · {barWeight}{unit} bar included
                  </div>
                </>
              )}
            </div>

            {/* Barbell visual — metallic serious style */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', padding:'6px 0' }}>
              {/* Left end cap */}
              <div style={{ width:24, height:18, background:'linear-gradient(to bottom,#c8c8c8 0%,#787878 45%,#a8a8a8 100%)', borderRadius:'5px 0 0 5px', flexShrink:0, boxShadow:'-2px 3px 6px rgba(0,0,0,.5)' }} />
              {/* Left plates */}
              {[...platesPerSide].reverse().map((p, i) => {
                const pd = plateData.find(x => x.w === p) || plateData[plateData.length-1];
                return <div key={i} style={{ width:pd.pw+4, height:pd.h+12, background:`linear-gradient(to right,rgba(0,0,0,.35) 0%,${pd.color} 18%,${pd.color} 82%,rgba(0,0,0,.35) 100%)`, borderLeft:'2px solid rgba(0,0,0,.4)', borderRight:'2px solid rgba(0,0,0,.4)', flexShrink:0, boxShadow:'inset 0 2px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.3)' }} />;
              })}
              {/* Left collar */}
              <div style={{ width:12, height:40, background:'linear-gradient(to bottom,#e4e4e4 0%,#b0b0b0 30%,#888 65%,#c0c0c0 100%)', borderRadius:'0 4px 4px 0', flexShrink:0, boxShadow:'2px 0 4px rgba(0,0,0,.3)' }} />
              {/* Bar — straight or EZ */}
              {barType === 'ez' ? (
                <svg key="ez" width="100" height="28" viewBox="0 0 100 28" style={{ flexShrink:0, overflow:'visible', animation:'barSwitch .38s cubic-bezier(.16,1,.3,1) both' }}>
                  <defs>
                    <linearGradient id="ezBarGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#f2f2f2"/>
                      <stop offset="22%" stopColor="#d0d0d0"/>
                      <stop offset="52%" stopColor="#909090"/>
                      <stop offset="78%" stopColor="#b8b8b8"/>
                      <stop offset="100%" stopColor="#e8e8e8"/>
                    </linearGradient>
                    <linearGradient id="ezShineGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="rgba(255,255,255,.45)"/>
                      <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
                    </linearGradient>
                  </defs>
                  {/* EZ bar W-shape — two downward V bends at grip sections */}
                  <path
                    d="M 0,6 L 17,6 L 26,1 L 36,15 L 50,7 L 64,15 L 74,1 L 83,6 L 100,6
                       L 100,14 L 83,14 L 74,9 L 64,23 L 50,15 L 36,23 L 26,9 L 17,14 L 0,14 Z"
                    fill="url(#ezBarGrad)"
                    style={{ filter:'drop-shadow(0 3px 8px rgba(0,0,0,.5))' }}
                  />
                  {/* Top shine highlight */}
                  <path
                    d="M 0,6 L 17,6 L 26,1 L 36,15 L 50,7 L 64,15 L 74,1 L 83,6 L 100,6
                       L 100,10 L 83,10 L 74,5 L 64,19 L 50,11 L 36,19 L 26,5 L 17,10 L 0,10 Z"
                    fill="url(#ezShineGrad)" opacity=".55"
                  />
                </svg>
              ) : (
                <div key="straight" style={{ width:100, height:14, background:'linear-gradient(to bottom,#f2f2f2 0%,#d0d0d0 25%,#909090 55%,#b8b8b8 80%,#e8e8e8 100%)', flexShrink:0, boxShadow:'0 3px 10px rgba(0,0,0,.45)', animation:'barSwitch .38s cubic-bezier(.16,1,.3,1) both' }} />
              )}
              {/* Right collar */}
              <div style={{ width:12, height:40, background:'linear-gradient(to bottom,#e4e4e4 0%,#b0b0b0 30%,#888 65%,#c0c0c0 100%)', borderRadius:'4px 0 0 4px', flexShrink:0, boxShadow:'-2px 0 4px rgba(0,0,0,.3)' }} />
              {/* Right plates */}
              {platesPerSide.map((p, i) => {
                const pd = plateData.find(x => x.w === p) || plateData[plateData.length-1];
                return <div key={i} style={{ width:pd.pw+4, height:pd.h+12, background:`linear-gradient(to right,rgba(0,0,0,.35) 0%,${pd.color} 18%,${pd.color} 82%,rgba(0,0,0,.35) 100%)`, borderLeft:'2px solid rgba(0,0,0,.4)', borderRight:'2px solid rgba(0,0,0,.4)', flexShrink:0, boxShadow:'inset 0 2px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.3)' }} />;
              })}
              {/* Right end cap */}
              <div style={{ width:24, height:18, background:'linear-gradient(to bottom,#c8c8c8 0%,#787878 45%,#a8a8a8 100%)', borderRadius:'0 5px 5px 0', flexShrink:0, boxShadow:'2px 3px 6px rgba(0,0,0,.5)' }} />
            </div>

            {/* Bar type toggle — Straight vs EZ */}
            <div style={{ display:'flex', background:'var(--sfx)', border:'1px solid var(--border)', borderRadius:12, padding:4 }}>
              <button onClick={() => setBarType('straight')} style={{ flex:1, minHeight:44, padding:'10px', borderRadius:9, border:'none', background:barType==='straight'?'var(--sfx)':'transparent', fontFamily:'var(--fd)', fontSize:13, fontWeight:700, color:barType==='straight'?'var(--text)':'var(--text2)', cursor:'pointer', transition:'background .15s, color .15s' }}>Straight Bar</button>
              <button onClick={() => setBarType('ez')} style={{ flex:1, minHeight:44, padding:'10px', borderRadius:9, border:'none', background:barType==='ez'?'rgba(200,242,53,.22)':'transparent', fontFamily:'var(--fd)', fontSize:13, fontWeight:700, color:barType==='ez'?'var(--pink)':'var(--text2)', cursor:'pointer', transition:'background .15s, color .15s' }}>EZ Bar</button>
            </div>

            {/* Both sides / per side — iOS segmented control */}
            <div style={{ display:'flex', background:'var(--sfx)', border:'1px solid var(--border)', borderRadius:12, padding:4 }}>

          <div className="prev-sets">
            <div className="sec-label">Completed Sets</div>

              <div key={i} className="prev-set-row">

                <span className="prev-set-val">
                  {s.bw ? 'BW' : `${kgToDisp(s.weight, unit)} ${unit}`} × {s.reps} reps
                  {!s.bw && s.weight >= maxLogged && isNewPR && <span className="pr-badge">PR</span>}
                </span>
                <button className="prev-set-undo" onClick={() => undoSet(i)}
                  aria-label={`Undo set ${s.setNum} — logged wrong, put it back`}>
                  Undo
                </button>
              </div>
            ))}
          </div>
        )}

        {allDone && (
          <div className="done-banner"><span>All {totalSets} sets complete</span></div>
        )}
      </div>

      <FixedLayer>
      <div className="log-action-bar" ref={barRef}>
        {/* Sets adjuster — stays available all through the exercise, so you can
            add or drop planned sets after you've already logged some */}
        {!allDone && (
          <div className="sets-ctrl">
            <button className="sets-ctrl-btn" onClick={() => setTotalSets(t => Math.max(doneSets.length + 1, t - 1))} aria-label="One set fewer">−</button>
            <span className="sets-ctrl-lbl">{totalSets} sets</span>
            <button className="sets-ctrl-btn" onClick={() => setTotalSets(t => Math.min(12, t + 1))} aria-label="One set more">+</button>
          </div>
        )}
        {!inWarmup && weightType && (!allDone
          ? <button className="btn-pink" onClick={completeSet} disabled={weightType === 'bodyweight' ? (!reps || parseInt(reps) < 1) : (weightType === 'barbell' ? !reps : (!weight || !reps))}>Complete Set {currentSet} →</button>
          : <button className="btn-pink" onClick={finish}>✓ Mark Exercise Complete</button>)}

        {/* Feeling strong — bolt an extra set onto a finished exercise */}
        {allDone && (
          <button className="btn-outline" onClick={addAnotherSet}>+ Add Another Set</button>
        )}

        {/* Finish early — easy to find, but no longer a second glowing green
            slab directly under the button you tap eight times a set. */}
        {!allDone && doneSets.length > 0 && (
          <div className="bar-secondary">
            <button className="btn-finish" onClick={finish}>Finish exercise · {doneSets.length} {doneSets.length === 1 ? 'set' : 'sets'}</button>
            <button className="btn-quiet" onClick={onBack}>Pause</button>
          </div>
        )}
        {!allDone && doneSets.length === 0 && (
          <button className="btn-quiet" onClick={onBack}>Back to exercises</button>
        )}
      </div>
      </FixedLayer>
    </div>
  );
}

function useCountUp(target, dur = 1200, delay = 250) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf, t0 = null;
    const start = setTimeout(() => {
      const step = ts => {
        if (t0 === null) t0 = ts;
        const p = Math.min((ts - t0) / dur, 1);
        setVal(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }, delay);
    return () => { clearTimeout(start); if (raf) cancelAnimationFrame(raf); };
  }, [target, dur, delay]);
  return val;
}

function CelebrationOverlay({ workout, streak, onDone, weightUnit = 'kg' }) {
  const totalSets = workout.exercises.reduce((s,e)=>s+e.sets.length,0);
  const totalVol  = workout.exercises.reduce((s,e)=>e.sets.reduce((a,t)=>a+t.weight*t.reps,s),0);
  const exCount = Math.round(useCountUp(workout.exercises.length, 900));
  const setCount = Math.round(useCountUp(totalSets, 1200));
  const dispVol  = weightUnit === 'lb' ? Math.round(totalVol / KG_PER_LB) : totalVol;
  const volDiv   = weightUnit === 'lb' ? 2000 : 1000;
  const volCount = Math.round(useCountUp(dispVol, 1500));
  const confetti = useMemo(() => {
    const colors = ['#c8f235', '#0daa74', '#ffd700', '#ff8c42', '#f0f5d8'];
    return Array.from({ length: 40 }, (_, i) => ({
      left: Math.random() * 100,
      dur: 1.4 + Math.random(),
      delay: Math.random() * 0.5,
      color: colors[i % 5],
    }));
  }, []);
  useEffect(() => {
    vibe([40, 60, 40, 60, 80]);
    const t = setTimeout(onDone, 3200);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="celebrate-overlay" onClick={onDone}>
      {confetti.map((c, i) => (
        <div key={i} className="confetti-piece"
          style={{ left: c.left + '%', background: c.color, '--dur': c.dur + 's', '--delay': c.delay + 's' }} />
      ))}
      <div className="celebrate-title">Workout<br/>Complete!</div>
      <div className="celebrate-stats">
        <div className="celebrate-stat"><div className="celebrate-stat-v">{exCount}</div><div className="celebrate-stat-l">Exercises</div></div>
        <div className="celebrate-stat"><div className="celebrate-stat-v">{setCount}</div><div className="celebrate-stat-l">Sets</div></div>
        <div className="celebrate-stat"><div className="celebrate-stat-v">{dispVol >= volDiv ? (volCount/volDiv).toFixed(1)+'t' : volCount+weightUnit}</div><div className="celebrate-stat-l">Volume</div></div>
      </div>
      {streak > 0 && <div className="celebrate-streak">Day {streak} Streak</div>}
      <div className="celebrate-hint">tap anywhere to continue</div>
    </div>
  );
}

/* ═══════════════════════════════════════

function WorkoutClock({ startedAt, inHero }) {
  const [, tick] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => tick(x => x + 1), 1000);
    const onVis = () => tick(x => x + 1);
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, []);
  const secs = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  const txt = h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  return (
    <div className={`wo-clock ${inHero ? 'wo-clock-hero' : ''}`} title="Total time since this workout started">
      <span className="wo-clock-dot" />
      <span className="wo-clock-lbl">Workout<br />time</span>
      <span className="wo-clock-time">{txt}</span>
    </div>
  );
}

function App() {
  const [history, setHistory]       = useState(() => loadHistory());
  const [current, setCurrent]       = useState(() => loadCurrent());
  const [activeGroup, setActiveGroup] = useState(null);
  const [activeEx, setActiveEx]     = useState(null);
  const [summary, setSummary]       = useState(null);
  const [celebrate, setCelebrate]   = useState(false);
  const [theme, setTheme]           = useState(() => loadTheme());
  const [profile, setProfile]       = useState(() => loadProfile());
  const [customEx, setCustomEx]     = useState(() => loadCustomEx());
  const [splash, setSplash]         = useState(true);
  const [screen, setScreen]         = useState('home');
  const [breakModal, setBreakModal] = useState(false);
  const [exerciseDoneSheet, setExerciseDoneSheet] = useState(null);
  const [showTour, setShowTour]     = useState(false);

  // Apply theme to body immediately
  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    saveTheme(theme);
  }, [theme]);

  useEffect(() => { saveCurrent(current); }, [current]);

  // Cloud sync (Phase 2C): refs so the sync engine always reads fresh state
  const historyRef = React.useRef(history);   historyRef.current = history;
  const customExRef = React.useRef(customEx); customExRef.current = customEx;
  const profileRef = React.useRef(profile);   profileRef.current = profile;
  const accessorsRef = React.useRef(null);
  useEffect(() => {
    if (!supa) return;
    const accessors = {
      getHistory:   () => historyRef.current,
      applyHistory: h  => { setHistory(h); saveHistory(h); },
      getCustomEx:  () => customExRef.current,
      applyCustomEx: ex => { setCustomEx(ex); saveCustomEx(ex); },
      getProfile:   () => profileRef.current,
      applyProfile: p  => { setProfile(p); saveProfile(p); },
    };
    accessorsRef.current = accessors;
    cloudFullSync(accessors);
    const { data: sub } = supa.auth.onAuthStateChange(ev => {
      if (ev === 'SIGNED_IN') cloudFullSync(accessors);
      if (ev === 'SIGNED_OUT') cloudSet('idle');
    });
    const onOnline = () => cloudFullSync(accessors);
    window.addEventListener('online', onOnline);
    return () => { sub.subscription.unsubscribe(); window.removeEventListener('online', onOnline); };
  }, []);

  function toggleTheme() { setTheme(t => t === 'light' ? 'dark' : 'light'); }

  // Merge built-in + custom exercises — passed to group screens
  const allExercises = useMemo(() => [...DB, ...customEx], [customEx]);
  const weightUnit = (profile && profile.weightUnit) || 'kg';

  /* ── Auth gate: login shows once on a device that has never signed in ── */
  const [authReady, setAuthReady]   = useState(!supa);
  const [hasSession, setHasSession] = useState(false);
  const [postSplash, setPostSplash] = useState(false);

  useEffect(() => {
    if (!supa) return;
    supa.auth.getSession().then(({ data }) => {
      setHasSession(!!(data && data.session));
      setAuthReady(true);
    }).catch(() => setAuthReady(true));
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => setHasSession(!!s));
    return () => sub.subscription.unsubscribe();
  }, []);

  function routeOnward() {
    // Read the freshest profile — a cloud restore may have just written it and
    // React state can lag inside async callbacks.
    const p = profileRef.current || loadProfile();
    if (!p || !p.setupDone) { setScreen('profile-setup'); return; }
    const active = current && current.exercises.length > 0;
    // Mid-workout reopen (e.g. phone locked between sets) drops you straight
    // back into the workout. After 12 h it's an abandoned session — land on
    // home and let the break modal ask what to do with it.
    if (active && current.startedAt && Date.now() - current.startedAt < 12 * 3600 * 1000) {
      setScreen('group-select');
      return;
    }
    setScreen('home');
    if (active) setBreakModal(true);
  }

  // Wait for the session check before deciding — never flash a login wall at
  // someone who is already signed in.
  useEffect(() => {
    if (!postSplash || !authReady) return;
    setPostSplash(false);
    if (supa && !hasSession && !authOnboarded()) { setScreen('login'); return; }
    routeOnward();
  }, [postSplash, authReady]);

  // Magic link opened in this browser → session appears → leave the login screen.
  // Wait for the first cloud sync so a returning user's profile (name, avatar,
  // setup-done flag) is restored BEFORE routing — otherwise a fresh install
  // sends them back through setup + tour as if they were new.
  useEffect(() => {
    if (!hasSession) return;
    markOnboarded();
    if (screen !== 'login') return;
    let cancelled = false;
    (async () => {
      try { if (accessorsRef.current) await cloudFullSync(accessorsRef.current); } catch {}
      if (cancelled) return;
      const p = profileRef.current || loadProfile();
      if (p && p.setupDone) {
        localStorage.setItem('fittrack_toured', 'true');   // returning user — never re-show the tour
        setWelcomeBack(p.name ? String(p.name).split(' ')[0] : '');
      }
      routeOnward();
    })();
    return () => { cancelled = true; };
  }, [hasSession, screen]);

  // "Welcome back" toast after a returning user signs in on a fresh install
  const [welcomeBack, setWelcomeBack] = useState(null);
  useEffect(() => {
    if (welcomeBack === null) return;
    const t = setTimeout(() => setWelcomeBack(null), 3200);
    return () => clearTimeout(t);
  }, [welcomeBack]);

  function onSplashDone() {
    setSplash(false);
    setPostSplash(true);
  }

  function onProfileSave(p) {
    saveProfile(p);
    setProfile(p);
    setScreen('home');
    if (!localStorage.getItem('fittrack_toured')) setShowTour(true);
  }

  function onSaveProfile(p) { saveProfile(p); setProfile(p); cloudPushBlobQuick('profiles', p); }
  function onSaveCustomEx(ex) { saveCustomEx(ex); setCustomEx(ex); cloudPushBlobQuick('custom_exercises', ex); }

  function startWorkout() {
    if (!current) setCurrent({ date: todayISO(), exercises: [], startedAt: Date.now(), warmup: 'pending' });
    setScreen('group-select');
  }

  /* ── Plan ahead: build tomorrow's workout at home, start it at the gym ── */
  const plan = (profile && profile.plannedWorkout && Array.isArray(profile.plannedWorkout.ids) && profile.plannedWorkout.ids.length > 0)
    ? profile.plannedWorkout : null;
  const [planDraft, setPlanDraft] = useState(null);

  function savePlannedWorkout(ids) {
    const p = { ...(profile || {}), plannedWorkout: (ids && ids.length) ? { ids, createdAt: Date.now() } : null };
    saveProfile(p); setProfile(p); cloudPushBlobQuick('profiles', p);
  }
  function startPlanEdit() { setPlanDraft(plan ? [...plan.ids] : []); setScreen('plan-groups'); }
  function togglePlanEx(ex) {
    setPlanDraft(d => (d || []).includes(ex.id) ? d.filter(x => x !== ex.id) : [...(d || []), ex.id]);
  }
  function savePlan() { savePlannedWorkout(planDraft); setPlanDraft(null); setScreen('home'); }
  function startPlannedWorkout() {
    if (!plan || current) return;
    // The plan rides along on the live workout: its exercises get "Planned"
    // tags and float to the top, everything else (Smart Swap, custom picks)
    // works as usual.
    setCurrent({ date: todayISO(), exercises: [], startedAt: Date.now(), warmup: 'pending', planIds: [...plan.ids] });
    savePlannedWorkout(null);   // consumed — one pending plan at a time
    setScreen('group-select');
  }

  function selectGroup(grp) { setActiveGroup(grp); setScreen('group-detail'); }
  function pickExercise(ex) { setActiveEx(ex); setScreen('log'); }

  function completeExercise(ex) {
    setCurrent(prev => ({ ...prev, exercises: [...prev.exercises.filter(e => e.id !== ex.id), { ...ex, status: 'done' }] }));
    setActiveEx(null);
    setScreen('group-detail');
    setExerciseDoneSheet({ exerciseName: ex.name, group: ex.group });
  }

  function savePartial(ex) {
    setCurrent(prev => {
      const base = prev || { date: todayISO(), exercises: [] };
      return { ...base, exercises: [...base.exercises.filter(e => e.id !== ex.id), { ...ex, status: 'partial' }] };
    });
  }

  function finishWorkout() {
    if (!current || current.exercises.length === 0) return;
    const base = [...history];
    const next = [...history, current];
    setHistory(next); saveHistory(next);
    cloudPushQuick(next, [current.date]);
    setSummary({ workout: current, baseHistory: base, streak: getStreak(next) });
    setCurrent(null);
    setBreakModal(false);
    setExerciseDoneSheet(null);
    setCelebrate(true);
    setScreen('summary');
  }

  function backFromLog() { setActiveEx(null); setScreen('group-detail'); }
  function backFromGroupDetail() { setScreen('group-select'); }
  function backFromGroupSelect() {
    const hasWork = current && current.exercises.length > 0;
    if (hasWork) { setBreakModal(true); return; }
    if (current) setCurrent(null); // Clear empty session — don't leave "Resume Workout" falsely active
    setScreen('home');
  }

  const isFirstTime = !profile || !profile.setupDone;
  const exEntries = (current && current.exercises) ? current.exercises : [];
  const doneIds = exEntries.filter(e => e.status !== 'partial').map(e => e.id);
  const partialMap = {};
  exEntries.forEach(e => { if (e.status === 'partial') partialMap[e.id] = e.sets.length; });

  // Always render splash on top when active
  return (
    <>
      {splash && (
        <SplashScreen
          isFirstTime={isFirstTime}
          onContinue={onSplashDone}
        />
      )}

      {!splash && screen === 'login' && (
        <LoginScreen
          onSignedIn={() => routeOnward()}
          onSkip={() => routeOnward()}
        />
      )}

      {!splash && screen === 'profile-setup' && (
        <ProfileSetupScreen onSave={onProfileSave} />
      )}

      {!splash && screen === 'home' && (
        <HomeScreen onStart={startWorkout} onViewHistory={() => setScreen('history')} onOpenSettings={() => setScreen('settings')} history={history} hasActive={!!current} profile={profile} current={current}
          plan={plan} allExercises={allExercises} onPlanNew={startPlanEdit} onPlanStart={startPlannedWorkout} onPlanEdit={startPlanEdit} onPlanDelete={() => savePlannedWorkout(null)} />
      )}

      {!splash && screen === 'plan-groups' && (
        <GroupSelectScreen planMode planIds={planDraft || []} onSavePlan={savePlan}
          onBack={() => { setPlanDraft(null); setScreen('home'); }}
          onSelectGroup={grp => { setActiveGroup(grp); setScreen('plan-detail'); }}
          onFinish={() => {}} completedIds={[]} allExercises={allExercises} />
      )}

      {!splash && screen === 'plan-detail' && activeGroup && (
        <GroupDetailScreen planMode group={activeGroup} planIds={planDraft || []} onTogglePlan={togglePlanEx} onSavePlan={savePlan}
          onBack={() => setScreen('plan-groups')} onPick={() => {}} onFinish={() => {}}
          completedIds={[]} history={history} allExercises={allExercises}
          onSaveCustom={ex => onSaveCustomEx([...customEx, ex])} />
      )}

      {breakModal && (
        <BreakModal
          onBreak={() => { setBreakModal(false); setScreen('home'); }}
          onDone={() => { finishWorkout(); }}
        />
      )}

      {exerciseDoneSheet && (
        <ExerciseDoneSheet
          exerciseName={exerciseDoneSheet.exerciseName}
          group={exerciseDoneSheet.group}
          onSameGroup={() => { setExerciseDoneSheet(null); setScreen('group-detail'); }}
          onNewGroup={() => { setExerciseDoneSheet(null); setScreen('group-select'); }}
          onFinish={() => { setExerciseDoneSheet(null); finishWorkout(); }}
        />
      )}

      {!splash && screen === 'history' && (
        <HistoryScreen onBack={() => setScreen('home')} history={history} weightUnit={weightUnit} />
      )}

      {!splash && screen === 'settings' && (
        <SettingsScreen onBack={() => setScreen('home')} profile={profile} onSaveProfile={onSaveProfile} theme={theme} onToggleTheme={toggleTheme} customEx={customEx} onSaveCustomEx={onSaveCustomEx} onShowTour={() => setShowTour(true)} />
      )}

      {showTour && <OnboardingScreen onDone={() => {
        setShowTour(false);
        // Remember "seen the tour" on the account too, so it survives reinstalls
        const p = profileRef.current || loadProfile();
        if (p && !p.toured) onSaveProfile({ ...p, toured: true });
      }} />}
      {welcomeBack !== null && (
        <div className="wb-toast">Welcome back{welcomeBack ? `, ${welcomeBack}` : ''}</div>
      )}

      {!splash && screen === 'group-select' && (
        <GroupSelectScreen onBack={backFromGroupSelect} onSelectGroup={selectGroup} onFinish={finishWorkout} completedIds={doneIds} partialMap={partialMap} allExercises={allExercises} planIds={(current && current.planIds) || []} weightUnit={weightUnit} />
      )}

      {!splash && screen === 'group-detail' && activeGroup && (
        <GroupDetailScreen group={activeGroup} onBack={backFromGroupDetail} onPick={pickExercise} onFinish={finishWorkout} completedIds={doneIds} partialMap={partialMap} history={history} allExercises={allExercises} onSaveCustom={ex => onSaveCustomEx([...customEx, ex])} planIds={(current && current.planIds) || []} weightUnit={weightUnit} />
      )}

      {!splash && screen === 'log' && activeEx && (
        <LogScreen
          exercise={activeEx}
          savedEntry={exEntries.find(e => e.id === activeEx.id) || null}
          onBack={backFromLog}
          onComplete={completeExercise}
          onSetLogged={savePartial}
          history={history}
          weightUnit={weightUnit}
          restSecs={(profile && profile.restSecs) || 90}
          sessionWarmup={(current && current.warmup) || 'pending'}
          onSessionWarmup={v => setCurrent(prev => ({ ...(prev || { date: todayISO(), exercises: [] }), warmup: v }))}
        />
      )}

      {!splash && current && current.startedAt && ['group-select','group-detail','log'].includes(screen) && (
        <WorkoutClock startedAt={current.startedAt} inHero={screen === 'log'} />
      )}

      {!splash && screen === 'summary' && summary && (
        <SummaryScreen workout={summary.workout} baseHistory={summary.baseHistory} onDone={() => { setSummary(null); setScreen('home'); }} weightUnit={weightUnit} />
      )}
      {!splash && celebrate && summary && (
        <CelebrationOverlay workout={summary.workout} streak={summary.streak || 0} onDone={() => setCelebrate(false)} weightUnit={weightUnit} />
      )}

      {/* ── Persistent bottom nav (hidden on splash + profile-setup) ── */}
      {!splash && <BottomNav screen={screen} setScreen={setScreen} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
/* Boot: compile once, then never again.
   Babel is 2.8 MB and re-parsing 200 KB of JSX on every launch was the single
   biggest chunk of startup. The compiled output is cached against a hash of the
   source, so editing the app above automatically invalidates it — a stale cache
   is impossible, and Babel is only downloaded when the hash actually changes. */
(function () {
  var el = document.getElementById('app-src');
  var src = el.textContent;
  var h = 5381;
  for (var i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
  var KEY = 'vibelift_compiled_v1';

  function run(code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.h === h && o.c) { run(o.c); return; }
    }
  } catch (e) { /* corrupt or unavailable cache — fall through and compile */ }

  var s = document.createElement('script');
  s.src = 'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js';
  s.onload = function () {
    var code = Babel.transform(src, { presets: ['react'] }).code;
    try { localStorage.setItem(KEY, JSON.stringify({ h: h, c: code })); } catch (e) { /* over quota — still runs, just recompiles next time */ }
    run(code);
  };
  s.onerror = function () {
    document.body.innerHTML = '<div style="padding:40px;font:600 15px system-ui;color:#c8f235;background:#121508;min-height:100vh">VibeLift could not load. Check your connection and reopen.</div>';
  };
  document.head.appendChild(s);
})();
</script>
<script>
  /* Tactile press feedback on every button: tiny vibration on touch,
     pop animation on primary buttons. Delegated so React re-renders
     never detach it. */
  document.addEventListener('pointerdown', function (e) {
    var btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
  }, { passive: true });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button.btn-pink');
    if (!btn || btn.disabled) return;
    btn.classList.remove('btn-pop');
    void btn.offsetWidth; /* restart animation */
    btn.classList.add('btn-pop');
  }, { passive: true });

  /* Register the service worker for offline + installability.
     Only on a secure context (https or localhost); file:// is skipped so
     local testing is unaffected. */
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.warn('[VibeLift] SW registration failed:', e);
      });
    });
  }
</script>
</body>
</html>
