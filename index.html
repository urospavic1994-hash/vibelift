<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeLift</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121508">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeLift">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta property="og:title" content="VibeLift">
  <meta property="og:description" content="Track your workouts, lift your vibe.">
  <meta property="og:image" content="https://vibelift.vercel.app/assets/logo.png">
  <meta property="og:url" content="https://vibelift.vercel.app/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #c8f235;
      --pink2:     #b0d929;
      --navy:      #121508;
      --navy2:     #1b2010;
      --navy3:     #242d16;
      --success:   #7ec832;
      --pink-glow: rgba(200,242,53,.22);

      /* Dark defaults — app loads dark before JS runs */
      --bg:     #121508;
      --card:   #1b2010;
      --sfx:    #242d16;
      --border: rgba(200,242,53,0.12);
      --text:   #f0f5d8;
      --text2:  rgba(240,245,216,0.68);
      --hdr-bg: rgba(18,21,8,.92);
      --bar-bg: rgba(18,21,8,.96);
      --sh1: 0 1px 4px rgba(0,0,0,.3), 0 3px 10px rgba(0,0,0,.35);
      --sh2: 0 2px 8px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.42);
      --sh3: 0 4px 16px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.50);

      --r:    18px;
      --r-sm: 12px;
      --fd: 'Passion One', sans-serif;
      --fb: 'DM Sans', sans-serif;
    }

    [data-theme="light"] {
      --bg:     #f4f7e8;
      --card:   #ffffff;
      --sfx:    #edf2d8;
      --border: rgba(18,21,8,0.1);
      --text:   #121508;
      --text2:  rgba(18,21,8,0.68);
      --hdr-bg: rgba(255,255,255,.88);
      --bar-bg: rgba(255,255,255,.92);
      --sh1: 0 1px 4px rgba(18,21,8,.05), 0 3px 10px rgba(18,21,8,.06);
      --sh2: 0 2px 8px rgba(18,21,8,.05), 0 8px 26px rgba(18,21,8,.09);
      --sh3: 0 4px 16px rgba(18,21,8,.08), 0 20px 48px rgba(18,21,8,.12);
    }

    /* Keep dark selector as a no-op alias so existing stored 'dark' value still works */
    [data-theme="dark"] {}

    html, body { height: 100%; overflow-x: hidden; overscroll-behavior: none; }

    body {
      font-family: var(--fb);
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
    }

    body::before {
      content: '';
      position: fixed; top: -60px; right: -60px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px; left: -150px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(126,200,50,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    #root { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 1; }

    .screen {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      animation: slideUp .26s cubic-bezier(.18,.82,.4,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Glass header ── */
    .hdr {
      padding: calc(13px + env(safe-area-inset-top)) 18px 13px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--hdr-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .hdr-title { font-family: var(--fd); font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: .6px; }

    .back-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: rgba(127,127,127,.1); color: var(--text);
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .14s, transform .1s;
    }
    .back-btn:active { background: rgba(127,127,127,.2); transform: scale(.92); }

    /* ── Theme toggle ── */
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text2); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh1); transition: transform .1s;
    }
    .theme-btn:active { transform: scale(.9); }

    /* ── Buttons ── */
    .btn-pink {
      width: 100%; padding: 16px; border-radius: var(--r-sm);
      border: none;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink2) 100%);
      color: #121508; font-family: var(--fd);
      font-size: 18px; font-weight: 800; letter-spacing: .8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,242,53,.35), 0 1px 4px rgba(176,217,41,.22);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-pink:active {
      transform: scale(.93);
      filter: brightness(1.3);
      box-shadow: 0 0 0 6px rgba(200,242,53,.28), 0 2px 8px rgba(200,242,53,.25);
      transition: transform .05s, box-shadow .05s, filter .05s;
    }
    .btn-pink:disabled { opacity: .38; }
    .btn-pink.btn-pop { animation: btn-pop .35s cubic-bezier(.2,.8,.4,1); }
    @keyframes btn-pop {
      0%   { transform: scale(.93); box-shadow: 0 0 0 0 rgba(200,242,53,.5); }
      55%  { transform: scale(1.03); }
      100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(200,242,53,0); }
    }

    .btn-outline {
      width: 100%; padding: 14px; border-radius: var(--r-sm);
      border: 2px solid var(--border); background: transparent;
      color: var(--text); font-family: var(--fd);
      font-size: 17px; font-weight: 700; letter-spacing: .4px;
      cursor: pointer; transition: background .14s, transform .12s, border-color .14s;
    }
    .btn-outline:active {
      background: rgba(200,242,53,.10); transform: scale(.95);
      border-color: rgba(200,242,53,.45);
      transition: background .05s, transform .05s, border-color .05s;
    }

    /* ── Card ── */
    .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--sh2); }
    .sec-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.6px; color: var(--text2); margin-bottom: 14px;
    }

    /* ══════════════════════════════════
       HOME SCREEN
    ══════════════════════════════════ */
    .home-screen {
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    }
    .home-compact-hdr {
      position: sticky; top: 0; z-index: 100;
      background: var(--hdr-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .home-hdr-left { display: flex; align-items: center; gap: 12px; }
    .home-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--navy3); border: 2px solid var(--pink);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fd); font-size: 15px; font-weight: 900; color: var(--pink);
    }
    .home-greeting { font-family: var(--fd); font-size: 19px; font-weight: 900; color: var(--text); letter-spacing: .3px; }
    .wb-toast {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 50%;
      transform: translateX(-50%);
      background: var(--card); color: var(--text);
      border: 1px solid var(--pink);
      font-family: var(--fd); font-weight: 900; font-size: 15px; letter-spacing: .3px;
      padding: 10px 20px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      z-index: 300;
      animation: wbIn .35s ease, wbOut .4s ease 2.8s forwards;
    }
    @keyframes wbIn  { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes wbOut { to   { opacity: 0; transform: translate(-50%, -8px); } }
    .home-date-sub { font-size: 11px; color: var(--text2); font-weight: 500; margin-top: 1px; }
    .home-hdr-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--sfx);
      color: var(--text2); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .14s;
    }
    .home-hdr-btn:active { background: var(--card); }

    /* Week date strip */
    .week-strip {
      display: flex; gap: 8px; padding: 16px 18px 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .week-strip::-webkit-scrollbar { display: none; }
    .week-day {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 14px; border-radius: 22px; min-width: 48px; flex-shrink: 0;
      font-size: 11px; font-weight: 700; color: var(--text2); cursor: default;
      transition: background .15s;
    }
    .week-day-name { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
    .week-day-num { font-family: var(--fd); font-size: 18px; font-weight: 900; line-height: 1; }
    .week-day.today { background: var(--pink); color: #121508; box-shadow: 0 4px 14px rgba(200,242,53,.35); }
    .week-day.has-workout:not(.today) { border: 1.5px solid var(--pink); }

    /* Stat cards grid */
    .home-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 18px 4px; }
    .home-stat-card {
      background: var(--card); border-radius: var(--r); padding: 16px 14px;
      box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 4px;
    }
    .home-stat-icon { font-size: 20px; margin-bottom: 2px; }
    .home-stat-val { font-family: var(--fd); font-size: 40px; font-weight: 900; color: var(--text); line-height: 1; }
    .home-stat-val.accent { color: var(--pink); }
    .home-stat-lbl { font-size: 11px; color: var(--text2); font-weight: 600; }

    /* Home body padding */
    .home-body {
      flex: 1; padding: 12px 18px calc(88px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }

    /* Legacy classes for other screens still using these */
    .home-scroll-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .home-scroll-body {
      flex: 1; overflow-y: auto;
      padding: 18px 18px 60px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--sh2); }
    .stat-val        { font-family: var(--fd); font-size: 44px; font-weight: 900; color: var(--text); line-height: 1; }
    .stat-val.accent { color: var(--pink); }
    .stat-lbl        { font-size: 12px; color: var(--text2); margin-top: 4px; font-weight: 500; }

    /* calendar */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-lbl { text-align: center; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); padding-bottom: 6px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; font-weight: 600; color: var(--text2);
      cursor: default; transition: background .15s; position: relative;
    }
    .cal-day.has-workout { background: rgba(200,242,53,.15); color: var(--pink); cursor: pointer; font-weight: 700; }
    .cal-day.has-workout:active { background: rgba(200,242,53,.28); }
    .cal-day.in-progress { background: rgba(200,242,53,.18); color: var(--pink); cursor: pointer; font-weight: 700; }
    .cal-day.today-ring { box-shadow: 0 0 0 2px var(--text); }
    .cal-day.future { opacity: .3; }
    .cal-day.selected { background: var(--pink) !important; color: #121508 !important; box-shadow: 0 2px 12px rgba(200,242,53,.40); }
    .cal-day.in-progress.selected { background: var(--pink) !important; color: #121508 !important; }
    .cal-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--pink); flex-shrink: 0; }
    .cal-day.selected .cal-day-dot { background: #121508; }
    .cal-expand {
      grid-column: 1 / -1;
      background: var(--sfx); border-radius: 12px;
      padding: 12px 14px; margin-top: 2px;
      border-left: 3px solid var(--pink);
      animation: slideDown .2s ease;
    }
    .cal-expand.active-expand { border-left-color: var(--pink); }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes barSwitch { from { opacity:0; transform:scaleX(.55) scaleY(.4); } to { opacity:1; transform:scaleX(1) scaleY(1); } }
    .cal-expand-date { font-family: var(--fd); font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 8px; letter-spacing: .3px; }
    .cal-expand-ex { font-size: 12px; color: var(--text2); padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cal-expand-ex:last-child { border-bottom: none; }
    .cal-expand-ex-name { font-weight: 600; color: var(--text); }
    .cal-in-progress-badge { font-size: 10px; font-weight: 700; color: var(--pink); background: rgba(200,242,53,.14); padding: 2px 8px; border-radius: 20px; }

    /* break modal & exercise-done sheet */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal-sheet {
      width: 100%; max-width: 430px; margin: 0 auto;
      background: var(--card); border-radius: 24px 24px 0 0;
      padding: 20px 22px env(safe-area-inset-bottom, 28px);
      animation: slideUp .28s cubic-bezier(.18,.82,.4,1);
    }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 20px; }
    .modal-title { font-family: var(--fd); font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: .4px; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--text2); margin-bottom: 22px; line-height: 1.5; }
    .ex-done-btn {
      width: 100%; padding: 16px 18px; border-radius: var(--r-sm); border: 2px solid var(--border);
      background: var(--card); color: var(--text);
      font-family: var(--fd); font-size: 17px; font-weight: 800; letter-spacing: .4px;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--sh1); transition: border-color .14s, background .14s; margin-bottom: 10px;
    }
    .ex-done-btn:active { background: var(--sfx); border-color: var(--pink); }
    .ex-done-btn-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    /* Ending the workout is a real destination, not a footnote — it gets the
       same weight as the two "keep going" buttons above it. */
    .ex-done-finish {
      width: 100%; min-height: 56px; padding: 16px 18px; margin-top: 12px;
      border-radius: var(--r-sm); border: 2px solid var(--success);
      background: rgba(126,200,50,.10); color: var(--success);
      font-family: var(--fd); font-size: 17px; font-weight: 800; letter-spacing: .4px;
      cursor: pointer; transition: background .14s, transform .12s;
    }
    .ex-done-finish:active { background: rgba(126,200,50,.22); transform: scale(.97); }

    /* Home history preview */
    .hist-preview-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .hist-preview-row:last-child { border-bottom: none; }
    .hist-preview-date { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .hist-preview-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .hist-preview-icons { display: flex; gap: 4px; align-items: center; }
    .view-all-btn {
      display: block; width: 100%; margin-top: 12px; padding: 10px;
      border-radius: var(--r-sm); border: 1.5px solid var(--border); background: transparent;
      color: var(--text2); font-family: var(--fd); font-size: 14px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
      transition: background .14s;
    }
    .view-all-btn:active { background: rgba(127,127,127,.07); }

    /* ══════════════════════════════════
       HISTORY SCREEN
    ══════════════════════════════════ */
    .hist-body { flex: 1; overflow-y: auto; padding: 0 18px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    /* History stat cards */
    .hist-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 0 4px; }
    .hist-stat-card {
      background: var(--card); border-radius: var(--r); padding: 16px 14px; box-shadow: var(--sh2);
    }
    .hist-stat-icon { font-size: 20px; margin-bottom: 4px; }
    .hist-stat-val { font-family: var(--fd); font-size: 38px; font-weight: 900; color: var(--text); line-height: 1; }
    .hist-stat-lbl { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 3px; }

    /* Filter pills */
    .hist-filter-row { display: flex; gap: 8px; padding: 4px 0 12px; overflow-x: auto; }
    .hist-filter-row::-webkit-scrollbar { display: none; }
    .hist-filter-pill {
      padding: 8px 18px; border-radius: 22px; flex-shrink: 0;
      font-family: var(--fb); font-size: 13px; font-weight: 700;
      background: var(--sfx); color: var(--text2); cursor: pointer;
      border: none; transition: background .15s, color .15s;
    }
    .hist-filter-pill.active { background: var(--pink); color: #121508; }

    .hist-workout-card { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh2); }
    .hist-workout-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .hist-workout-date { font-family: var(--fd); font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .hist-workout-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .hist-workout-vol {
      font-family: var(--fd); font-size: 16px; font-weight: 800; color: var(--pink);
      background: rgba(200,242,53,.12); padding: 4px 10px; border-radius: 20px;
    }
    .hist-ex-list { padding: 4px 0; }
    .hist-ex-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
    }
    .hist-ex-row:last-child { border-bottom: none; }
    .hist-ex-info { flex: 1; }
    .hist-ex-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .hist-ex-sets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .hist-set-pill {
      font-size: 11px; font-weight: 600; color: var(--text2);
      background: var(--sfx); padding: 3px 8px; border-radius: 20px;
    }
    .hist-empty { text-align: center; padding: 60px 24px; color: var(--text2); }
    .hist-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .hist-empty-txt { font-size: 15px; line-height: 1.6; }

    /* ══════════════════════════════════
       GROUP SELECT SCREEN
    ══════════════════════════════════ */
    .group-select-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    .grp-card {
      position: relative; border-radius: 20px; overflow: hidden; height: 148px;
      cursor: pointer; box-shadow: var(--sh2);
      transition: transform .14s cubic-bezier(.2,.8,.4,1);
    }
    .grp-card:active { transform: scale(.97); }

    .grp-card-bg-icon {
      position: absolute; right: -12px; bottom: -12px; opacity: .14;
      transform: rotate(-10deg);
    }
    .grp-card-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 18px 18px;
      background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.1) 100%);
    }
    .grp-card-name { font-family: var(--fd); font-size: 30px; font-weight: 900; color: white; letter-spacing: .4px; line-height: 1; }
    .grp-card-count { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px; font-weight: 500; }
    .grp-done-pill {
      position: absolute; top: 12px; right: 12px;
      background: var(--success); color: white;
      font-family: var(--fd); font-size: 12px; font-weight: 800; letter-spacing: .5px;
      padding: 4px 10px; border-radius: 20px;
    }

    .finish-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 14px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
    }
    .done-count-badge {
      font-family: var(--fd); font-size: 13px; font-weight: 800; color: #121508;
      background: var(--pink); padding: 4px 12px; border-radius: 20px; letter-spacing: .4px;
    }

    /* ══════════════════════════════════
       GROUP DETAIL (exercise list)
    ══════════════════════════════════ */
    .group-detail-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

    .grp-detail-hero {
      border-radius: 16px; overflow: hidden; height: 100px; position: relative; margin-bottom: 8px;
    }
    .grp-detail-hero-inner {
      height: 100%; display: flex; align-items: center; padding: 0 20px; gap: 16px; position: relative;
    }
    .grp-detail-hero-name {
      font-family: var(--fd); font-size: 42px; font-weight: 900; color: white; letter-spacing: .5px;
    }
    .grp-detail-hero-sub { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 2px; }

    .ex-row-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      box-shadow: var(--sh1); cursor: pointer;
      display: flex; align-items: center; gap: 14px;
      border: 2px solid transparent;
      transition: border-color .15s, transform .12s;
    }
    .ex-row-card:active { transform: scale(.97); }
    .ex-row-card.done-row { border-color: var(--success); background: rgba(13,170,116,.05); }
    .ex-row-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--sfx); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ex-row-info { flex: 1; }
    .ex-row-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .ex-row-pb   { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .ex-row-check { width: 24px; height: 24px; border-radius: 50%; background: var(--success); display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: 800; flex-shrink: 0; }
    .ex-info-btn {
      min-width: 44px; min-height: 44px;
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid var(--border); background: transparent;
      color: var(--text2); font-size: 14px; font-weight: 700; font-style: italic;
      font-family: Georgia, serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
    }
    .ex-info-btn:active { color: var(--pink); border-color: var(--pink); }

    /* ─── REST TIMER ─── */
    .rest-float {
      position: fixed; z-index: 600; display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1.5px solid var(--pink);
      border-radius: 40px; padding: 10px 16px 10px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.55);
      max-width: calc(100vw - 24px);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .rest-float.rest-placed { animation: rest-float-in .3s cubic-bezier(.2,.8,.4,1); }
    .rest-float.rest-dragging { box-shadow: 0 14px 40px rgba(0,0,0,.7); }
    @keyframes rest-float-in { from { opacity: 0; } to { opacity: 1; } }
    .rest-grip {
      width: 22px; height: 34px; flex-shrink: 0; cursor: grab;
      display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    .rest-grip span { width: 3px; height: 3px; border-radius: 50%; background: var(--text2); box-shadow: 0 6px 0 var(--text2), 0 -6px 0 var(--text2); }
    .rest-float.rest-done { border-color: var(--success); }
    .rest-float-label {
      font-size: 10px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--text2);
    }
    .rest-done .rest-float-label { color: var(--success); font-size: 22px; font-family: var(--fd); letter-spacing: 1px; animation: dot-pop .45s ease; }
    .rest-float-time { font-family: var(--fd); font-size: 30px; font-weight: 900; color: var(--pink); line-height: 1; min-width: 66px; text-align: center; }
    .wo-clock {
      position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 400;
      display: flex; align-items: center; gap: 7px;
      background: rgba(18,21,8,.82); border: 1px solid var(--border);
      backdrop-filter: blur(6px); border-radius: 20px; padding: 5px 12px 5px 10px;
      pointer-events: none;
    }
    .wo-clock-hero { top: calc(16px + env(safe-area-inset-top, 0px)); right: 60px; }
    .wo-clock-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); animation: mail-pulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    .wo-clock-lbl {
      font-family: var(--fb); font-size: 8.5px; font-weight: 800; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--text2); line-height: 1.15; text-align: right;
    }
    .wo-clock-time {
      font-family: var(--fd); font-size: 16px; font-weight: 900; color: var(--text);
      letter-spacing: .5px; font-variant-numeric: tabular-nums;
    }
    .rest-card {
      background: var(--card); border: 1.5px solid rgba(200,242,53,.35);
      border-radius: var(--r); padding: 14px 18px; box-shadow: var(--sh2);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: slideDown .25s ease;
    }
    .rest-card.rest-done { border-color: var(--success); }
    .rest-label {
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text2);
    }
    .rest-time {
      font-family: var(--fd); font-size: 44px; font-weight: 900; line-height: 1;
      color: var(--pink); font-variant-numeric: tabular-nums;
    }
    .rest-done .rest-time { color: var(--success); animation: dot-pop .45s ease; }
    .rest-bar {
      width: 100%; height: 6px; border-radius: 3px;
      background: var(--border); overflow: hidden;
    }
    .rest-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--pink2), var(--pink));
      transition: width 1s linear;
    }
    .rest-actions { display: flex; gap: 10px; width: 100%; }
    .rest-btn {
      flex: 1; padding: 9px; border-radius: 10px;
      border: 1.5px solid var(--border); background: transparent;
      color: var(--text); font-size: 13px; font-weight: 700;
      font-family: var(--fb); cursor: pointer; transition: all .12s;
    }
    .rest-btn:active { background: rgba(200,242,53,.12); border-color: rgba(200,242,53,.45); transform: scale(.95); }

    /* ─── LOGIN SCREEN ─── */
    .lg-screen { justify-content: center; }
    .lg-body {
      padding: calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
      max-width: 430px; width: 100%; margin: 0 auto;
    }
    .lg-brand {
      font-family: var(--fd); font-size: 13px; font-weight: 900; letter-spacing: 4px;
      color: var(--pink); margin-bottom: 6px;
    }
    .lg-logo { align-self: center; margin-bottom: 4px; }
    .lg-choice { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .lg-steps { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .lg-step {
      font-family: var(--fb); font-size: 10px; font-weight: 800; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--text2); opacity: .5; white-space: nowrap;
    }
    .lg-step.on { color: var(--pink); opacity: 1; }
    .lg-step.done { opacity: .8; }
    .lg-step-line { flex: 1; height: 1px; background: var(--border); }
    .lg-title {
      font-family: var(--fd); font-size: 38px; font-weight: 900; line-height: 1.05;
      color: var(--text); letter-spacing: -.5px;
    }
    .lg-lede { font-size: 14.5px; line-height: 1.6; color: var(--text2); margin-bottom: 8px; }
    .lg-em { color: var(--text); font-weight: 800; }
    .lg-label {
      font-family: var(--fb); font-size: 10px; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--text2); margin-top: 6px;
    }
    .lg-input {
      width: 100%; padding: 16px; border-radius: var(--r-sm);
      border: 2px solid var(--border); background: var(--sfx); color: var(--text);
      font-family: var(--fb); font-size: 17px; font-weight: 600;
      transition: border-color .15s;
    }
    .lg-input::placeholder { color: var(--text2); opacity: .55; }
    .lg-input:focus { outline: none; border-color: var(--pink); }
    .lg-input:disabled { opacity: .55; }
    .lg-code {
      font-family: var(--fd); font-size: 30px; font-weight: 900;
      letter-spacing: 10px; text-align: center; padding: 16px 8px;
    }
    .lg-hint { font-size: 12.5px; line-height: 1.5; color: var(--text2); }
    .lg-err {
      background: rgba(255,90,90,.10); border: 1px solid rgba(255,90,90,.45);
      border-radius: 10px; padding: 11px 13px;
      font-size: 13px; line-height: 1.55; color: #ff8a8a;
    }
    .lg-cta { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .lg-status { font-size: 12.5px; color: var(--text2); text-align: center; }
    .lg-spin {
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
      border: 2.5px solid rgba(18,21,8,.25); border-top-color: #121508;
      animation: lg-spin .7s linear infinite;
    }
    @keyframes lg-spin { to { transform: rotate(360deg); } }
    .lg-ghost {
      width: 100%; padding: 12px; border: none; background: transparent;
      color: var(--text2); font-family: var(--fb); font-size: 13.5px; font-weight: 700;
      cursor: pointer; border-radius: 10px;
    }
    .lg-ghost:disabled { opacity: .4; }
    .lg-ghost:active { color: var(--text); background: rgba(255,255,255,.05); }
    .lg-fine { font-size: 12px; line-height: 1.55; color: var(--text2); text-align: center; }
    .lg-fine a { color: var(--text2); }

    /* ─── EXERCISE BUILDER ─── */
    .builder-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      box-shadow: var(--sh1); display: flex; flex-direction: column; gap: 12px;
    }
    .builder-steps { display: flex; gap: 6px; }
    .builder-step { height: 5px; flex: 1; border-radius: 3px; background: var(--border); transition: background .25s; }
    .builder-step.on { background: var(--pink); }
    .builder-title { font-family: var(--fd); font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; }
    .builder-sub { font-size: 12px; color: var(--text2); margin-top: -8px; }
    .builder-stage { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .builder-stage svg { display: block; width: 100%; height: auto; }
    .builder-stage svg * { animation: figIn .35s ease; }
    @keyframes figIn { from { opacity: .25; } }
    .builder-name-preview {
      background: var(--bg); border: 1.5px dashed rgba(200,242,53,.35);
      border-radius: 12px; padding: 9px 13px;
    }
    .builder-name-preview label {
      font-size: 9px; font-weight: 800; letter-spacing: 1.8px;
      text-transform: uppercase; color: var(--text2); display: block;
    }
    .builder-name-line {
      font-family: var(--fd); font-size: 18px; font-weight: 900;
      text-transform: uppercase; line-height: 1.1; margin-top: 2px; min-height: 20px;
    }
    .builder-name-line .b-slot { color: var(--pink); }
    .builder-name-line .b-ghost { color: var(--text2); opacity: .5; }
    .builder-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .builder-chip {
      border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s; user-select: none;
    }
    .builder-chip.sel { background: var(--pink); color: #121508; border-color: var(--pink); font-weight: 800; }
    .builder-chips-label {
      width: 100%; font-size: 9px; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--text2); margin-top: 4px;
    }
    .ex-custom-tag {
      font-size: 9px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--pink); border: 1px solid rgba(200,242,53,.4); border-radius: 8px;
      padding: 1px 7px; display: inline-block; margin-top: 3px;
    }
    .ex-plan-tag {
      font-size: 9px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
      color: #121508; background: var(--pink); border-radius: 8px;
      padding: 2px 8px; display: inline-block; margin-top: 3px;
    }
    .plan-card-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
    .plan-mini-btn {
      background: none; border: 1px solid var(--text2); border-radius: 12px;
      color: var(--text2); font-family: var(--fb); font-size: 12px; font-weight: 700;
      padding: 10px 14px; cursor: pointer;
    }
    .log-hero-wiki {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35);
      color: white; font-size: 16px; font-weight: 700; font-style: italic;
      font-family: Georgia, serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ══════════════════════════════════
       VIBELIFT WIKI — in-app how-to sheet
    ══════════════════════════════════ */
    .wiki-dim {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55);
      animation: rest-float-in .2s ease;
    }
    .wiki-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 901;
      background: var(--card); border: 1.5px solid var(--border); border-bottom: none;
      border-radius: 24px 24px 0 0;
      padding: 10px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      max-height: 86vh; overflow-y: auto;
      animation: wiki-up .28s cubic-bezier(.2,.8,.4,1);
    }
    @keyframes wiki-up { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
    .wiki-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 12px; }
    .wiki-title { font-family: var(--fd); font-size: 24px; font-weight: 900; letter-spacing: .4px; color: var(--text); }
    .wiki-stage {
      margin: 12px 0 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .wiki-stage svg { display: block; width: 100%; height: auto; max-height: 200px; }
    .wiki-target { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .wiki-target-lbl {
      font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: var(--text2);
      text-transform: uppercase; margin-right: 2px;
    }
    .wiki-chip {
      font-size: 11px; font-weight: 700; color: var(--pink);
      background: rgba(200,242,53,.09); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 9px;
    }
    .wiki-steps { display: flex; flex-direction: column; gap: 9px; }
    .wiki-step { display: flex; gap: 10px; font-size: 13px; line-height: 1.45; color: var(--text); }
    .wiki-step b {
      font-family: var(--fd); font-weight: 700; font-size: 15px; color: var(--pink);
      min-width: 14px; line-height: 1.25;
    }
    .wiki-done { margin-top: 16px; width: 100%; }

    /* ══════════════════════════════════
       LOG SCREEN — Tinder hero style
    ══════════════════════════════════ */
    .log-hero {
      position: relative; overflow: hidden;
      min-height: calc(150px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .log-hero-bg-icon {
      position: absolute; right: -20px; top: -10px; opacity: .1;
      transform: rotate(12deg);
    }
    .log-hero-content {
      position: relative; z-index: 1; padding: 22px 22px 20px;
      background: linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.05) 100%);
    }
    .log-hero-eyebrow {
      font-family: var(--fd); font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; color: rgba(255,255,255,.55); margin-bottom: 4px;
    }
    .log-hero-name {
      font-family: var(--fd); font-size: clamp(34px, 11vw, 44px); font-weight: 900;
      color: white; line-height: .95; letter-spacing: .5px; text-transform: uppercase;
    }
    .log-hero-pb {
      font-size: 13px; color: rgba(255,255,255,.65); margin-top: 7px; font-weight: 500;
    }
    .log-hero-back {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,.35); border: none; color: white;
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: background .14s;
    }
    .log-hero-back:active { background: rgba(0,0,0,.55); }
    .pr-glow { color: #ffd700; font-size: 13px; font-weight: 700; }

    .log-body {
      flex: 1; padding: 16px 18px calc(240px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: 14px;
    }

    .set-prog {
      background: var(--card); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--sh2);
      position: sticky; top: 8px; z-index: 20;
    }
    .set-dots { display: flex; align-items: flex-start; gap: 0; justify-content: center; overflow-x: auto; scrollbar-width: none; }
    .set-dots::-webkit-scrollbar { display: none; }
    .set-dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; max-width: 64px; }
    .set-dot-connector { flex: 1; height: 2px; margin-top: 19px; background: var(--border); max-width: 28px; transition: background .3s; }
    .set-dot-connector.done-conn { background: var(--pink); }
    .set-dot {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2.5px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: var(--text2);
      transition: all .25s cubic-bezier(.2,.8,.4,1);
    }
    .set-dot.completed { background: var(--navy2); border-color: var(--navy2); color: var(--text); }
    .set-dot.just-done { animation: dot-pop .45s ease; }
    @keyframes dot-pop {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(13,170,116,.55); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(13,170,116,0); }
    }
    .spark-host { position: fixed; z-index: 999; pointer-events: none; width: 0; height: 0; }
    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      animation: spark-fly .55s cubic-bezier(.1,.8,.3,1) forwards;
    }
    @keyframes spark-fly {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
    }
    .spark-ring {
      position: absolute; left: -8px; top: -8px; width: 16px; height: 16px;
      border-radius: 50%; border: 3px solid var(--pink); opacity: .9;
      animation: ring-out .55s cubic-bezier(.1,.8,.3,1) forwards;
    }
    @keyframes ring-out {
      to { transform: scale(6.5); opacity: 0; border-width: 1px; }
    }
    .set-stamp {
      position: fixed; left: 50%; top: 36%; z-index: 998; pointer-events: none;
      transform: translate(-50%,-50%);
      font-family: var(--fd); font-size: 52px; font-weight: 900;
      letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
      color: var(--pink); text-shadow: 0 6px 28px var(--pink-glow), 0 2px 8px rgba(0,0,0,.4);
      animation: stamp-pop .75s cubic-bezier(.2,.9,.3,1) forwards;
    }
    @keyframes stamp-pop {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.55) rotate(-5deg); }
      16%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1)  rotate(1.5deg); }
      28%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
      72%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-64%) scale(.96); }
    }
    @media (prefers-reduced-motion: reduce) {
      .set-stamp { animation-duration: .35s; }
      .spark-ring, .spark { display: none; }
    }

    /* ─── SKELETON LOADING ─── */
    .skel {
      position: relative; overflow: hidden;
      background: var(--sfx); border-radius: 12px;
    }
    .skel::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      animation: skel-sweep 1.3s ease-in-out infinite;
    }
    @keyframes skel-sweep { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }
    .skel-circle { border-radius: 50%; flex-shrink: 0; }
    .acct-skel { display: flex; flex-direction: column; gap: 12px; padding: 2px 0; }
    .acct-skel-row { display: flex; align-items: center; gap: 12px; }
    .hero-loading::before {
      content: ''; position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(100deg, var(--navy2) 40%, var(--navy3) 50%, var(--navy2) 60%);
      background-size: 220% 100%;
      animation: hero-shimmer 1.3s ease-in-out infinite;
    }
    @keyframes hero-shimmer { from { background-position: 130% 0; } to { background-position: -30% 0; } }
    @media (prefers-reduced-motion: reduce) { .hero-loading::before { animation: none; } }

    /* ─── WORKOUT-DONE CELEBRATION ─── */
    .celebrate-overlay {
      position: fixed; inset: 0; z-index: 9500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px;
      background: rgba(10,13,4,.95);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      cursor: pointer; overflow: hidden;
      animation: fadeIn .3s ease;
    }
    .celebrate-title {
      font-family: var(--fd); font-size: clamp(44px, 13vw, 64px); font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px; line-height: .95;
      color: var(--pink); text-align: center;
      animation: celeb-pop .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes celeb-pop {
      from { opacity: 0; transform: scale(.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    .celebrate-stats { display: flex; gap: 12px; }
    .celebrate-stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px 16px; text-align: center; min-width: 86px;
    }
    .celebrate-stat-v {
      font-family: var(--fd); font-size: 30px; font-weight: 900; color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .celebrate-stat-l {
      font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--text2);
    }
    .celebrate-streak {
      background: rgba(200,242,53,.10); border: 1px solid rgba(200,242,53,.45);
      color: var(--pink); border-radius: 24px; padding: 9px 24px;
      font-weight: 900; font-size: 13px; letter-spacing: 2.4px; text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .celebrate-hint { font-size: 12px; color: var(--text2); }
    .confetti-piece {
      position: absolute; top: -14px; width: 8px; height: 13px; border-radius: 2px;
      opacity: .9; pointer-events: none;
      animation: confetti-fall var(--dur, 1.8s) linear var(--delay, 0s) forwards;
    }
    @keyframes confetti-fall {
      from { transform: translateY(-6vh) rotate(0); }
      to   { transform: translateY(110vh) rotate(720deg); }
    }
    .set-dot.active { background: var(--pink); border-color: var(--pink); color: #121508; box-shadow: 0 0 0 6px rgba(200,242,53,.18); transform: scale(1.1); }
    .set-dot.warmup-skipped { background: var(--sfx); border-color: var(--border); color: var(--text2); }
    .set-dot-lbl { font-size: 9px; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

    .warmup-card {
      background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--sh2);
      display: flex; flex-direction: column; gap: 12px;
    }
    .warmup-card-title { font-family: var(--fd); font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .warmup-card-desc { color: var(--text2); font-size: 14px; line-height: 1.5; }

    .input-form { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--sh2); }
    .mode-switch {
      display: flex; gap: 6px; justify-content: center;
      margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .mode-chip {
      flex: 1; min-height: 44px; padding: 10px 6px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); font-family: var(--fd); font-size: 12px; font-weight: 700;
      letter-spacing: .3px; cursor: pointer; transition: all .15s;
    }
    .mode-chip.on { background: var(--pink); border-color: var(--pink); color: #121508; }
    .last-time {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      margin: -8px 0 16px;
    }
    .last-time-lbl {
      font-family: var(--fb); font-size: 10px; font-weight: 800;
      letter-spacing: 1.4px; text-transform: uppercase; color: var(--text2);
    }
    .last-time-val { font-family: var(--fd); font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .last-time-up {
      font-family: var(--fb); font-size: 10px; font-weight: 800; letter-spacing: .6px;
      color: var(--success); border: 1px solid rgba(126,200,50,.45);
      border-radius: 20px; padding: 2px 8px;
    }
    .input-form-title { font-family: var(--fd); font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 16px; letter-spacing: .3px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .inp-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: var(--text2); margin-bottom: 7px; }
    .inp-group input {
      width: 100%; padding: 13px 10px; border-radius: var(--r-sm);
      border: 2px solid var(--border);
      font-family: var(--fd); font-size: 34px; font-weight: 800;
      color: var(--text); text-align: center; outline: none;
      background: var(--sfx); transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }
    .inp-group input::-webkit-inner-spin-button,
    .inp-group input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .inp-group input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(200,242,53,.12); }

    .prev-sets { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sh2); }
    .prev-set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .prev-set-val { flex: 1; text-align: right; }
    .prev-set-undo {
      flex-shrink: 0; min-height: 44px; padding: 0 12px;
      border: none; background: transparent; color: var(--text2);
      font-family: var(--fb); font-size: 12px; font-weight: 700;
      letter-spacing: .4px; cursor: pointer; border-radius: 8px;
    }
    .prev-set-undo:active { background: rgba(255,90,90,.14); color: #ff8a8a; }
    .prev-set-row:last-child { border-bottom: none; }
    .prev-set-lbl { font-size: 13px; color: var(--text2); font-weight: 500; }
    .prev-set-val { font-size: 14px; font-weight: 700; color: var(--text); }

    .pr-badge {
      display: inline-block; background: var(--pink);
      color: #121508; font-size: 9px; font-weight: 800;
      padding: 2px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: .6px; margin-left: 6px;
    }

    .done-banner {
      background: rgba(13,170,116,.08); border: 1.5px solid var(--success);
      border-radius: 12px; padding: 13px 16px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--success);
    }

    .log-action-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 12px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
      display: flex; flex-direction: column; gap: 9px;
    }
    /* Finish + Pause share a row below a divider. Still a real target, but it
       reads as "leaving" rather than as a second primary action. */
    .bar-secondary {
      display: flex; gap: 8px; align-items: stretch;
      margin-top: 4px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn-finish {
      flex: 1; min-height: 54px; padding: 14px 10px; border-radius: var(--r-sm);
      border: 2px solid var(--success); background: rgba(126,200,50,.10);
      color: var(--success); font-family: var(--fd);
      font-size: 16px; font-weight: 800; letter-spacing: .3px;
      cursor: pointer; transition: background .14s, transform .12s;
    }
    .btn-finish:active { background: rgba(126,200,50,.16); transform: scale(.96); }
    .btn-quiet {
      width: 100%; min-height: 46px; padding: 9px; border-radius: var(--r-sm);
      border: none; background: transparent; color: var(--text2);
      font-family: var(--fb); font-size: 13px; font-weight: 700; letter-spacing: .3px;
      cursor: pointer;
    }
    .bar-secondary .btn-quiet { width: auto; flex: 0 0 92px; }
    .btn-quiet:active { color: var(--text); }
    .sets-ctrl { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 2px; }
    .sets-ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--card);
      color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .14s, transform .1s;
    }
    .sets-ctrl-btn:active { border-color: var(--pink); transform: scale(.9); background: rgba(200,242,53,.08); }
    .sets-ctrl-lbl { font-family: var(--fd); font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .4px; }

    /* ══════════════════════════════════
       SUMMARY SCREEN
    ══════════════════════════════════ */
    .sum-hero {
      background: linear-gradient(148deg, var(--navy3) 0%, var(--navy) 50%, var(--navy2) 100%);
      padding: calc(34px + env(safe-area-inset-top)) 22px 26px; color: var(--text); text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .sum-hero::before {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.18) 0%, transparent 70%);
    }
    .sum-hero-emoji { font-size: 52px; position: relative; z-index: 1; }
    .sum-title { font-family: var(--fd); font-size: 34px; font-weight: 900; margin-top: 6px; letter-spacing: .5px; position: relative; z-index: 1; }
    .sum-date  { font-size: 13px; opacity: .58; margin-top: 4px; font-weight: 500; }
    .sum-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
    .sum-stat  { background: rgba(255,255,255,.1); border-radius: 13px; padding: 13px 8px; text-align: center; border: 1px solid rgba(255,255,255,.13); }
    .sum-stat-v { font-family: var(--fd); font-size: 30px; font-weight: 900; }
    .sum-stat-l { font-size: 11px; opacity: .58; margin-top: 2px; font-weight: 500; }
    .sum-body { flex: 1; overflow-y: auto; padding: 20px 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .sum-ex-card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sh2); }
    .sum-ex-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .sum-ex-icon { width: 30px; height: 30px; display: flex; align-items: center; }
    .sum-ex-name  { font-size: 15px; font-weight: 700; color: var(--text); }
    .sum-ex-group { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }
    .sum-tbl-hdr {
      display: grid; grid-template-columns: 38px 1fr 1fr;
      padding: 4px 0 8px; border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px; color: var(--text2);
    }
    .sum-set-row { display: grid; grid-template-columns: 38px 1fr 1fr; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .sum-set-row:last-child { border-bottom: none; }
    .sum-set-n { font-size: 12px; color: var(--text2); font-weight: 700; }
    .sum-set-w { font-family: var(--fd); font-size: 17px; font-weight: 800; color: var(--text); }
    .sum-set-r { font-size: 13px; color: var(--text2); font-weight: 500; }
    .sum-action-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 12px 18px env(safe-area-inset-bottom, 22px);
      background: var(--bar-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border); z-index: 200;
    }

    .trend-up   { color: var(--success); font-weight: 700; font-size: 12px; }
    .trend-down { color: #e05050;        font-weight: 700; font-size: 12px; }

    /* ══════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════ */
    /* ─── SPLASH ROOT ─── */
    .sp-root {
      position: fixed; top: 0; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      z-index: 9999;
      background: #0a0d04;
      overflow: hidden;
      transition: opacity .5s ease;
    }
    .sp-root.sp-exit { opacity: 0; pointer-events: none; }

    /* ─── PHASE 1: dark + logo ─── */
    .sp-p1 {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2;
      transition: opacity .35s ease;
    }
    .sp-p1.sp-p1-out { opacity: 0; pointer-events: none; }

    .sp-logo-glow {
      position: absolute;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.16) 0%, transparent 68%);
      animation: sp-glow-pulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes sp-glow-pulse {
      from { transform: scale(.88); opacity: .6; }
      to   { transform: scale(1.08); opacity: 1; }
    }

    .sp-logo {
      position: relative; z-index: 1;
      animation: sp-logo-in .7s cubic-bezier(.16,1,.3,1) both;
      animation-delay: .12s;
    }
    /* Typographic wordmark — font-rendered, so it is crisp at every size and DPI
       (the old PNG was 257px wide and blurred on retina screens) */
    .brand-wordmark {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fd); font-weight: 900; letter-spacing: .5px; line-height: 1;
      user-select: none; white-space: nowrap;
    }
    .brand-wordmark svg { width: .92em; height: .92em; flex-shrink: 0; color: var(--pink); margin-right: .24em; }
    .bw-vibe { color: var(--pink); }
    .bw-lift { color: var(--text); }
    /* Splash background is always near-black, keep "Lift" light even in light theme */
    .sp-root .bw-lift { color: #f0f5d8; }
    @keyframes sp-logo-in {
      from { opacity: 0; transform: scale(.75) translateY(12px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }


    /* ─── PHASE 2: photo + quote ─── */
    .sp-p2 {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0a0d04 0%, #1a220c 55%, #0a0d04 100%);
      display: flex; flex-direction: column;
      z-index: 1;
      opacity: 0;
      transition: opacity .55s ease;
    }
    .sp-p2.sp-p2-in { opacity: 1; }

    .sp-p2-glow {
      position: absolute;
      top: 22%; left: 50%; transform: translateX(-50%);
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,242,53,.13) 0%, transparent 68%);
      animation: sp-glow-pulse 2.4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .sp-p2-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 0 24px calc(env(safe-area-inset-bottom,0px) + 52px);
      z-index: 1;
    }
    .sp-p2-in .sp-p2-content {
      animation: sp-content-up .55s cubic-bezier(.16,1,.3,1) both;
      animation-delay: .28s;
    }
    @keyframes sp-content-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sp-p2-content .quote-card {
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-color: rgba(255,255,255,.14);
    }
    .sp-p2-content .quote-text { color: rgba(255,255,255,.88); text-shadow: 0 1px 6px rgba(0,0,0,.5); }
    .sp-p2-content .quote-ref  { color: rgba(255,255,255,.5); }

    .sp-btn-wrap {
      position: absolute; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
      padding: 0 24px; z-index: 3;
    }
    .splash-btn {
      width: 100%; margin-top: 14px;
      padding: 18px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink2) 100%);
      color: #121508; font-family: var(--fd);
      font-size: 20px; font-weight: 800; letter-spacing: .8px;
      cursor: pointer;
      box-shadow: 0 4px 28px rgba(200,242,53,.45);
      transition: transform .1s;
    }
    .splash-btn:active { transform: scale(.97); }

    /* ─── DOTS ─── */
    .sp-dots {
      position: absolute; bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 7px; z-index: 10;
    }
    .sp-dot {
      height: 6px; border-radius: 3px;
      background: rgba(255,255,255,.28);
      transition: width .35s cubic-bezier(.4,0,.2,1), background .35s;
      width: 6px;
    }
    .sp-dot.sp-dot-active { width: 22px; background: var(--pink); }

    /* ══════════════════════════════════
       ONBOARDING TOUR
    ══════════════════════════════════ */
    .onboarding-wrap {
      position: fixed; inset: 0; z-index: 9990;
      display: flex; align-items: flex-end; justify-content: center;
    }
    @keyframes obFadeOut {
      to { opacity: 0; pointer-events: none; }
    }
    .onboarding-wrap.fading { animation: obFadeOut .35s ease forwards; }
    .onboarding-bg {
      position: absolute; inset: 0;
      background: rgba(18,21,8,.82);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .onboarding-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 430px;
      background: #1b2010;
      border-top: 1px solid rgba(200,242,53,.10);
      border-radius: 28px 28px 0 0;
      padding: 28px 28px 48px;
      text-align: center;
      animation: slideUp .32s cubic-bezier(.18,.82,.4,1) both;
    }
    .ob-dots {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 24px;
    }
    .ob-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      transition: width .25s, border-radius .25s, background .25s;
    }
    .ob-dot.active { width: 24px; border-radius: 4px; background: var(--pink); }
    .ob-dot.done   { background: rgba(200,242,53,.45); }
    .ob-icon-wrap {
      width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 18px;
      background: rgba(200,242,53,.10); border: 1px solid rgba(200,242,53,.22);
      display: flex; align-items: center; justify-content: center;
    }
    @keyframes obStepIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .ob-step-content { animation: obStepIn .22s ease both; }
    .ob-step-num {
      font-size: 11px; font-weight: 700; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--pink); margin-bottom: 8px;
    }
    .ob-title {
      font-family: var(--fd); font-size: 26px; font-weight: 900; color: rgba(255,255,255,.95);
      letter-spacing: .3px; line-height: 1.1; margin-bottom: 12px;
    }
    .ob-body {
      font-size: 15px; color: rgba(255,255,255,.58); line-height: 1.65; margin-bottom: 26px;
    }
    .ob-next-btn {
      width: 100%; padding: 17px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink2) 100%);
      color: #121508; font-family: var(--fd); font-size: 19px; font-weight: 800;
      letter-spacing: .8px; cursor: pointer;
      box-shadow: 0 4px 28px rgba(200,242,53,.38);
      transition: transform .1s; margin-bottom: 10px;
    }
    .ob-next-btn:active { transform: scale(.97); }
    .ob-skip-btn {
      background: none; border: none; color: rgba(255,255,255,.30);
      font-size: 14px; font-family: var(--fb); cursor: pointer;
      padding: 8px; width: 100%; text-align: center; transition: color .15s;
    }
    .ob-skip-btn:active { color: rgba(255,255,255,.6); }

    /* ══════════════════════════════════
       PROFILE SETUP
    ══════════════════════════════════ */
    .setup-body {

/* ═══════════════════════════════════════
   FEEDBACK EFFECTS (haptic + sparks)
═══════════════════════════════════════ */
function vibe(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ── Rest alert that leaves your music alone ──────────────────────────────
   The old alarm was one long WAV — N seconds of silence, then a beep —
   played through an <audio> element. That claimed the phone's media session:
   the lock screen player switched to "VibeLift" and whatever was playing got
   paused. Two changes fix it:
     1. Sound now comes from Web Audio on an "ambient" audio session, which
        mixes with other audio instead of taking it over. No media session,
        no lock-screen player, no paused music.
     2. The "rest is over" alert when the phone is locked is a notification
        fired by the service worker, not a sound the page has to stay awake
        for. See sw.js. */
/* ── Server push: the alarm that survives a locked phone ─────────────────
   iOS kills the service worker soon after the screen locks, so the local
   SW timer (below) only fires when the worker happens to survive. The real
   alarm is held by /api/rest-push, which sleeps server-side until rest ends
   and sends a Web Push — iOS shows it on the lock screen with sound even
   when the app is dead. The local timer stays as an offline fallback; both
   use the same notification tag, so at most one alert ever shows. */
const PUSH_API = '/api/rest-push';
const VAPID_PUBLIC_KEY = 'BJ2UisTZ0E2LWYJ3_dPaPnV6eOwsIstU42FW4I_O3NqQKWPp3V8BPSDR8AJJvarqp-K0tBKYc3qXDCECgbozlJc';

function pushDeviceId() {
  let id = null;
  try { id = localStorage.getItem('vibelift_device_id'); } catch (e) {}
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem('vibelift_device_id', id); } catch (e) {}
  }
  return id;
}

function pushApi(payload) {
  try {
    return fetch(PUSH_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_id: pushDeviceId(), ...payload }),
      keepalive: true
    }).catch(() => {});
  } catch (e) { return Promise.resolve(); }
}

function vapidKeyBytes(base64) {
  const pad = '='.repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

let pushSubPromise = null;
function ensurePushSubscription() {
  // One attempt per app run; every caller after that reuses the result.
  if (pushSubPromise) return pushSubPromise;
  pushSubPromise = (async () => {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return false;
      if (Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch (e) {}
      }
      if (Notification.permission !== 'granted') return false;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidKeyBytes(VAPID_PUBLIC_KEY)
        });
      }
      // Re-send only when the subscription actually changed.
      const fingerprint = JSON.stringify(sub);
      if (localStorage.getItem('vibelift_push_sent') !== fingerprint) {
        await pushApi({ action: 'subscribe', subscription: sub.toJSON() });
        try { localStorage.setItem('vibelift_push_sent', fingerprint); } catch (e) {}
      }
      return true;
    } catch (e) { return false; /* declined or unsupported — local fallback covers it */ }
  })();
  return pushSubPromise;
}

let restAudioCtx = null;
function primeRestAudio() {
  try {
    // Safari 17+: tells iOS this app's sound should mix, never interrupt.
    if (navigator.audioSession) navigator.audioSession.type = 'ambient';
  } catch (e) {}
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!restAudioCtx) restAudioCtx = new Ctx();
    if (restAudioCtx.state !== 'running') restAudioCtx.resume().catch(() => {});
  } catch (e) { restAudioCtx = null; }
}
function restBeep() {
  const ctx = restAudioCtx;
  if (!ctx) return;
  try {
    if (ctx.state !== 'running') { ctx.resume().catch(() => {}); }
    const now = ctx.currentTime;
    // Six loud pulses alternating 880/1320 Hz — the higher tone sits above
    // most music, so the alert cuts through Spotify without pausing it.
    for (let i = 0; i < 6; i++) {
      const t = now + i * 0.28;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = (i % 2 === 0) ? 880 : 1320;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.9, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.24);
    }
  } catch (e) {}
}

function sparkBurst(x, y, count = 12) {
  const host = document.createElement('div');
  host.className = 'spark-host';
  const ring = document.createElement('div');
  ring.className = 'spark-ring';
  host.appendChild(ring);
  const colors = ['#c8f235', '#0daa74', '#ffd700'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 28 + Math.random() * 34;
    p.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(ang) * dist - 12}px`);
    p.style.background = colors[i % 3];
    host.appendChild(p);
  }
  host.style.left = x + 'px';
  host.style.top = y + 'px';
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 650);
}

/* Generic how-to for user-built custom exercises, assembled from their
   builder choices. Not exercise science — just a sane cue set. */
function customWikiSteps(b) {
  const pos = {
    'Standing':'Stand tall, feet about shoulder-width, core braced.',
    'Seated':'Sit tall with your back supported, feet planted.',
    'Lying Flat':'Lie back with your feet planted and lower back settled.',
    'Incline':'Set the bench to about 30° and lie back fully.',
    'Decline':'Secure your feet and lie back on the decline.',
    'Bent-Over':'Hinge at the hips, back flat, knees soft.',
    'Kneeling':'Kneel with your hips stacked over your knees.',
    'Hanging':'Hang from the bar with long arms and a tight core.',
  }[b.pos] || 'Get set with a stable, braced position.';
  const move = {
    'Press':'Press the weight away until your arms are straight, then return under control.',
    'Row':'Pull the weight toward your body, elbows leading, then lower slowly.',
    'Curl':'Curl the weight up without moving your upper arms, then lower slowly.',
    'Raise':'Raise the weight with long arms to shoulder height, then lower slowly.',
    'Extension':'Extend at the elbow until your arms are straight, keeping elbows still.',
    'Squat':'Lower down under control, then drive back up through your whole foot.',
    'Lunge':'Step and lower until both knees are near 90°, then drive back up.',
    'Fly':'Open your arms wide with soft elbows, then sweep them back together.',
    'Pull':'Pull down or through with your back doing the work, then return slowly.',
    'Hold':'Squeeze into the top position and hold with steady breathing.',
  }[b.move] || 'Move through the full range under control.';
  return [pos, move, 'Same speed both directions — if you have to swing, it’s too heavy.'];
}

/* The wiki entry for any exercise, or null when there is nothing to show. */
function wikiInfo(ex) {
  const d = WIKI_DATA[ex.id];
  if (d) return { eq: d.f[0], pos: d.f[1], move: d.f[2], tgt: d.t, steps: d.s };
  if (ex.builder) return { eq: ex.builder.eq, pos: ex.builder.pos, move: ex.builder.move, tgt: [ex.gl], steps: customWikiSteps(ex.builder) };
  return null;
}

/* ── Cloud sync engine (Phase 2C) ──
   localStorage stays the source of truth; the cloud is a mirror.
   Merge rule (documented in docs/ROADMAP.md): per workout-date. Dates that
   exist only in the cloud are adopted locally; on a per-date conflict the
   device you are holding wins and re-pushes. Sync never blocks the UI —
   every failure just waits for the next trigger (app open, login, back
   online, workout finished). */
const cloudState = { status: 'idle', count: null, listeners: new Set() };
function cloudSet(status, count) {
  cloudState.status = status;
  if (count != null) cloudState.count = count;
  cloudState.listeners.forEach(f => { try { f(); } catch {} });
}
function groupByDate(hist) {
  const m = {};
  (hist || []).forEach(w => { if (w && w.date) (m[w.date] = m[w.date] || []).push(w); });
  return m;
}
async function cloudUser() {
  if (!supa) return null;
  try { const { data } = await supa.auth.getSession(); return data.session ? data.session.user : null; }
  catch { return null; }
}
async function cloudPushDates(uid, hist, dates) {
  const byDate = groupByDate(hist);
  const rows = dates.map(d => ({ user_id: uid, date: d, data: byDate[d] || [], updated_at: new Date().toISOString() }));
  if (!rows.length) return;
  const { error } = await supa.from('workouts').upsert(rows);
  if (error) throw error;
}
async function cloudPushBlob(uid, table, value) {
  const { error } = await supa.from(table).upsert({ user_id: uid, data: value, updated_at: new Date().toISOString() });
  if (error) throw error;
}
function cloudSaveMeta(count) {
